<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101318"><meta name="description" content="Mobile workout timer, rep counter and mobility routine library."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Move Timer</title>
<style>
:root{--bg:#0b0e12;--panel:#131820;--panel2:#1a2029;--text:#f7f8fa;--muted:#a7b0bd;--line:#2a3340;--accent:#d6ff5f;--radius:22px}*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 70% -10%,rgba(214,255,95,.12),transparent 28%),var(--bg);color:var(--text);min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brandmark{width:38px;height:38px;border-radius:13px;background:var(--accent);color:#111;display:grid;place-items:center;font-size:20px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:10px 12px}.panel{background:rgba(19,24,32,.95);border:1px solid var(--line);border-radius:var(--radius)}.picker{padding:16px;margin-bottom:16px}.eyebrow{color:var(--muted);font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.routineRow{display:flex;gap:10px;margin-top:8px}.routineRow select{flex:1;min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px}.routineMeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem;margin-top:11px}.workout{padding:18px;text-align:center}.progressTrack{height:7px;background:#242b34;border-radius:999px;overflow:hidden;margin-bottom:22px}.progressBar{height:100%;width:0;background:var(--accent);transition:width .25s}.exerciseNo{color:var(--muted);font-size:.88rem;font-weight:700}.exerciseName{font-size:clamp(2rem,8vw,3.8rem);line-height:.95;letter-spacing:-.05em;margin:14px auto 8px}.exerciseHint{color:var(--muted);min-height:2.7em;margin:0 auto;max-width:560px}.display{margin:24px 0 16px;display:grid;place-items:center}.ring{width:min(72vw,330px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) var(--progress,0%),#252d38 0)}.ring:before{content:"";position:absolute;inset:10px;border-radius:inherit;background:var(--panel)}.bigValue{position:relative;z-index:1;font-size:clamp(4.5rem,22vw,8.5rem);font-weight:950;letter-spacing:-.08em;line-height:.8}.unit{position:relative;z-index:1;color:var(--muted);font-weight:800;margin-top:10px;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}.controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px;margin:18px 0 10px}.control{border:0;border-radius:18px;background:var(--panel2);color:var(--text);padding:16px 10px;font-weight:850}.control.primary{background:var(--accent);color:#101318;font-size:1.06rem}.subcontrols{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.subcontrols button{border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--muted);padding:10px 13px}.repTools{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.repTools.visible{display:grid}.repTools button{border:1px solid var(--line);border-radius:16px;background:var(--panel2);color:var(--text);padding:14px;font-weight:850}.nextCard{text-align:left;margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--panel2);display:flex;align-items:center;justify-content:space-between;gap:12px}.nextCard small,.exerciseItem small{color:var(--muted);display:block}.pill{font-size:.78rem;font-weight:850;border:1px solid var(--line);padding:7px 9px;border-radius:999px;color:var(--muted)}.library{margin-top:16px;padding:18px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.sectionTitle h2{font-size:1.15rem;margin:0}.sectionTitle span{color:var(--muted);font-size:.82rem}.exerciseList{display:grid;gap:8px}.exerciseItem{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel2);border-radius:15px;padding:12px 14px}.footerNote{font-size:.78rem;color:#7f8997;text-align:center;line-height:1.5;margin:18px 12px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.open{display:flex}.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;width:min(760px,100%);max-height:88dvh;overflow:auto;padding:20px 18px max(24px,env(safe-area-inset-bottom))}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0}.field{margin-top:14px}.field label{display:block;color:var(--muted);font-size:.82rem;font-weight:750;margin-bottom:6px}.field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:12px}.editList{display:grid;gap:8px;margin-top:14px}.editRow{display:grid;grid-template-columns:1fr 90px 42px;gap:8px}.editRow input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px;min-width:0}.remove{background:#28191c;border:1px solid #4d292f;color:#ff9ca7;border-radius:12px}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.sheetActions button{border:0;border-radius:15px;padding:14px;font-weight:850}.save{background:var(--accent);color:#111}.ghost{background:var(--panel2);color:var(--text)}.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#efffc1;color:#12170c;padding:11px 15px;border-radius:999px;font-weight:800;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){.modal{align-items:center}.sheet{border-bottom:1px solid var(--line);border-radius:26px}}
</style></head>
<body><div class="app"><header class="topbar"><div class="brand"><div class="brandmark">↗</div><span>Move Timer</span></div><button class="iconbtn" id="editBtn">Edit routine</button></header><section class="panel picker"><div class="eyebrow">Workout</div><div class="routineRow"><select id="routineSelect"></select></div><div class="routineMeta"><span id="routineDescription"></span><span id="routineDuration"></span></div></section><main class="panel workout"><div class="progressTrack"><div class="progressBar" id="progressBar"></div></div><div class="exerciseNo" id="exerciseNo"></div><h1 class="exerciseName" id="exerciseName"></h1><p class="exerciseHint" id="exerciseHint"></p><div class="display"><div class="ring" id="ring"><div><div class="bigValue" id="bigValue">60</div><div class="unit" id="unit">seconds</div></div></div></div><div class="controls"><button class="control" id="prevBtn">← Prev</button><button class="control primary" id="startBtn">Start</button><button class="control" id="nextBtn">Next →</button></div><div class="repTools" id="repTools"><button id="repMinus">− Rep</button><button id="repPlus">+ Rep</button></div><div class="subcontrols"><button id="resetBtn">Reset</button><button id="modeBtn">Switch to reps</button><button id="soundBtn">Sound: On</button></div><div class="nextCard"><div><small>Up next</small><strong id="nextName">—</strong></div><span class="pill" id="nextTarget">—</span></div></main><section class="panel library"><div class="sectionTitle"><h2>Routine exercises</h2><span>Prev/Next anytime</span></div><div class="exerciseList" id="exerciseList"></div></section><p class="footerNote">Move within a comfortable range. Stop if a movement causes pain, dizziness or unusual discomfort. This timer is a general fitness tool, not medical advice.</p></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheetHead"><h2>Edit routine</h2><button class="iconbtn" id="closeModal">✕</button></div><div class="field"><label>Routine name</label><input id="editName"></div><div class="field"><label>Description</label><input id="editDescription"></div><div class="editList" id="editList"></div><button class="ghost" id="addExercise" style="width:100%;margin-top:10px;border:0;border-radius:14px;padding:13px;font-weight:800">+ Add exercise</button><div class="sheetActions"><button class="ghost" id="restoreBtn">Restore presets</button><button class="save" id="saveBtn">Save routine</button></div></div></div><div class="toast" id="toast">Saved</div>
<script>
const presets=[
{id:'original',name:'Original Mobility Flow',description:'The reel-inspired full-body movement flow.',exercises:[['Body Waves',60,'Let the movement travel smoothly through your whole body.'],['Trunk Twists',60,'Rotate gently side to side; keep the movement relaxed.'],['Arm Swings',60,'Loose rhythmic swings. Keep shoulders relaxed.'],['Dead Arms',60,'Let the arms hang loose and move without forcing range.'],['Golf Swings',60,'Rotate through the torso and hips with an easy tempo.'],['Marches',60,'Tall posture, relaxed arms, steady alternating steps.'],['Ballet Squats',60,'Comfortable stance; knees track with toes.'],['Horseback Stance',60,'Hold a comfortable wide stance and stay tall.']]},
{id:'morning',name:'Morning Mobility',description:'A gentle 8-minute wake-up flow.',exercises:[['Easy March',60,'Start light and gradually raise your knees.'],['Shoulder Rolls',45,'Slow circles forward, then backward.'],['Arm Circles',45,'Small to larger circles without forcing range.'],['Trunk Twists',60,'Easy rotation from side to side.'],['Hip Circles',60,'Smooth circles, both directions.'],['Squat to Reach',60,'Shallow squat is fine; reach tall as you stand.'],['Calf Raises',45,'Rise and lower with control.'],['Body Waves',45,'Finish with relaxed full-body movement.']]},
{id:'desk',name:'Desk Reset',description:'Five minutes to break up long sitting.',exercises:[['Stand & Reach',40,'Reach upward and lengthen through the sides.'],['Shoulder Rolls',40,'Slow circles with relaxed neck and jaw.'],['Chest Openers',40,'Open arms wide, then gently cross in front.'],['Trunk Twists',45,'Turn comfortably without bouncing.'],['Hip Hinge',45,'Push hips back with a long spine, then stand tall.'],['March in Place',50,'Relaxed pace; let arms swing naturally.'],['Calf Raises',40,'Controlled rise and lower.']]},
{id:'lower',name:'Hips & Lower Body',description:'Mobility for hips, ankles and legs.',exercises:[['Marches',60,'Warm up with a steady rhythm.'],['Hip Circles',45,'Circle both directions.'],['Lateral Weight Shifts',60,'Shift side to side without forcing depth.'],['Ballet Squats',60,'Use a comfortable stance and range.'],['Alternating Knee Lifts',60,'Lift only as high as feels controlled.'],['Calf Raises',45,'Slow up, slow down.'],['Ankle Rocks',45,'Rock gently through available ankle range.'],['Horseback Stance',45,'Comfortable hold; finish before form breaks down.']]},
{id:'upper',name:'Shoulders & Upper Body',description:'A relaxed shoulder, arm and trunk flow.',exercises:[['Shoulder Rolls',45,'Forward then backward.'],['Arm Swings',60,'Keep the movement loose.'],['Arm Circles',45,'Change direction halfway.'],['Dead Arms',60,'Let tension drop from shoulders and elbows.'],['Chest Openers',45,'Open and close the arms rhythmically.'],['Trunk Twists',60,'Rotate comfortably with easy breathing.'],['Side Reaches',45,'Alternate sides without collapsing forward.']]},
{id:'recovery',name:'Easy Recovery Flow',description:'Lower-intensity movement for an easy day.',exercises:[['Easy March',60,'Keep effort deliberately easy.'],['Body Waves',45,'Smooth and relaxed.'],['Arm Swings',45,'Loose shoulders and hands.'],['Hip Circles',45,'Small circles are fine.'],['Trunk Twists',45,'Stay in a comfortable range.'],['Lateral Weight Shifts',45,'Slow side-to-side movement.'],['Stand & Reach',45,'Reach tall, then relax.'],['Easy March',45,'Finish with calm, steady movement.']]},
{id:'quick',name:'3-Minute Energiser',description:'A short movement break when time is tight.',exercises:[['March in Place',45,'Build a comfortable rhythm.'],['Arm Swings',30,'Loose and quick, not forced.'],['Trunk Twists',30,'Relaxed rotation.'],['Squat to Reach',30,'Use a shallow range if preferred.'],['Body Waves',45,'Finish loose and moving.']]}
].map(r=>({...r,exercises:r.exercises.map(e=>({name:e[0],seconds:e[1],hint:e[2]}))}));
const $=s=>document.querySelector(s),els={select:$('#routineSelect'),desc:$('#routineDescription'),duration:$('#routineDuration'),no:$('#exerciseNo'),name:$('#exerciseName'),hint:$('#exerciseHint'),big:$('#bigValue'),unit:$('#unit'),ring:$('#ring'),bar:$('#progressBar'),start:$('#startBtn'),prev:$('#prevBtn'),next:$('#nextBtn'),reset:$('#resetBtn'),mode:$('#modeBtn'),sound:$('#soundBtn'),repTools:$('#repTools'),repPlus:$('#repPlus'),repMinus:$('#repMinus'),nextName:$('#nextName'),nextTarget:$('#nextTarget'),list:$('#exerciseList'),modal:$('#modal'),editList:$('#editList'),editName:$('#editName'),editDesc:$('#editDescription'),toast:$('#toast')};
let routines=loadRoutines(),routineIndex=0,exerciseIndex=0,remaining=60,running=false,timer=null,soundOn=true,mode='timer',reps=0,repTarget=10;
function loadRoutines(){try{const x=JSON.parse(localStorage.getItem('moveTimerRoutines'));return Array.isArray(x)&&x.length?x:structuredClone(presets)}catch{return structuredClone(presets)}}function saveRoutines(){localStorage.setItem('moveTimerRoutines',JSON.stringify(routines))}function secondsLabel(s){const m=Math.floor(s/60),r=s%60;return m?`${m}:${String(r).padStart(2,'0')}`:`${s}s`}function totalSeconds(r){return r.exercises.reduce((a,e)=>a+(Number(e.seconds)||0),0)}function routine(){return routines[routineIndex]}function exercise(){return routine().exercises[exerciseIndex]}function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderPicker(){els.select.innerHTML=routines.map((r,i)=>`<option value="${i}">${escapeHtml(r.name)}</option>`).join('');els.select.value=routineIndex;els.desc.textContent=routine().description||'';els.duration.textContent=`~${Math.max(1,Math.round(totalSeconds(routine())/60))} min`}function render(){const e=exercise();els.no.textContent=`Exercise ${exerciseIndex+1} of ${routine().exercises.length}`;els.name.textContent=e.name;els.hint.textContent=e.hint||'Move comfortably and with control.';els.big.textContent=mode==='timer'?remaining:reps;els.unit.textContent=mode==='timer'?'seconds':'reps';const pct=mode==='timer'?100*(1-remaining/Math.max(1,e.seconds)):100*Math.min(1,reps/Math.max(1,repTarget));els.ring.style.setProperty('--progress',`${Math.max(0,Math.min(100,pct))}%`);els.bar.style.width=`${100*((exerciseIndex+(mode==='timer'?pct/100:0))/routine().exercises.length)}%`;els.start.textContent=running?'Pause':'Start';els.mode.textContent=mode==='timer'?'Switch to reps':'Switch to timer';els.repTools.classList.toggle('visible',mode==='reps');const n=routine().exercises[exerciseIndex+1];els.nextName.textContent=n?n.name:'Workout complete';els.nextTarget.textContent=n?secondsLabel(n.seconds):'✓';els.list.innerHTML=routine().exercises.map((x,i)=>`<div class="exerciseItem" style="${i===exerciseIndex?'outline:1px solid var(--accent)':''}"><div><strong>${escapeHtml(x.name)}</strong><small>${escapeHtml(x.hint||'')}</small></div><span class="pill">${secondsLabel(x.seconds)}</span></div>`).join('')}
function stop(){running=false;clearInterval(timer);timer=null}function resetCurrent(){stop();remaining=Number(exercise().seconds)||60;reps=0;render()}function vibrate(p){if(navigator.vibrate)navigator.vibrate(p)}function beep(f=600,d=.06){if(!soundOn)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);o.onended=()=>c.close()}catch{}}function toast(m){els.toast.textContent=m;els.toast.classList.add('show');setTimeout(()=>els.toast.classList.remove('show'),1500)}
function startPause(){if(running){stop();render();return}if(mode==='reps'){running=true;render();return}running=true;beep(520,.05);timer=setInterval(()=>{remaining--;if(remaining<=3&&remaining>0)beep(650,.05);if(remaining<=0){beep(880,.12);vibrate([80,60,120]);nextExercise(true);return}render()},1000);render()}function nextExercise(auto=false){stop();if(exerciseIndex<routine().exercises.length-1){exerciseIndex++;remaining=Number(exercise().seconds)||60;reps=0;render();if(auto)setTimeout(startPause,600)}else{remaining=0;render();toast('Workout complete ✓');vibrate([100,80,100,80,180])}}function prevExercise(){stop();exerciseIndex=Math.max(0,exerciseIndex-1);remaining=Number(exercise().seconds)||60;reps=0;render()}function setRoutine(i){stop();routineIndex=Number(i)||0;exerciseIndex=0;remaining=Number(exercise().seconds)||60;reps=0;renderPicker();render()}
function editRow(e,i){return `<div class="editRow" data-i="${i}"><input class="eName" value="${escapeHtml(e.name)}"><input class="eSeconds" type="number" min="5" max="1800" step="5" value="${Number(e.seconds)||60}"><button class="remove">✕</button><input class="eHint" value="${escapeHtml(e.hint||'')}" style="grid-column:1/4"></div>`}function openEditor(){const r=routine();els.editName.value=r.name;els.editDesc.value=r.description||'';els.editList.innerHTML=r.exercises.map(editRow).join('');els.modal.classList.add('open')}function saveEditor(){const rows=[...els.editList.querySelectorAll('.editRow')],exercises=rows.map(row=>({name:row.querySelector('.eName').value.trim()||'Exercise',seconds:Math.max(5,Number(row.querySelector('.eSeconds').value)||60),hint:row.querySelector('.eHint').value.trim()}));if(!exercises.length)return toast('Add at least one exercise');routines[routineIndex]={...routine(),name:els.editName.value.trim()||'Custom routine',description:els.editDesc.value.trim(),exercises};saveRoutines();els.modal.classList.remove('open');setRoutine(routineIndex);toast('Routine saved')}
els.select.onchange=e=>setRoutine(e.target.value);els.start.onclick=startPause;els.next.onclick=()=>nextExercise(false);els.prev.onclick=prevExercise;els.reset.onclick=resetCurrent;els.mode.onclick=()=>{stop();mode=mode==='timer'?'reps':'timer';if(mode==='reps'){repTarget=Math.max(1,Math.round(exercise().seconds/4));reps=0}else remaining=Number(exercise().seconds)||60;render()};els.sound.onclick=()=>{soundOn=!soundOn;els.sound.textContent=`Sound: ${soundOn?'On':'Off'}`;if(soundOn)beep()};els.repPlus.onclick=()=>{reps++;vibrate(15);render();if(reps===repTarget)beep(820,.08)};els.repMinus.onclick=()=>{reps=Math.max(0,reps-1);render()};$('#editBtn').onclick=openEditor;$('#closeModal').onclick=()=>els.modal.classList.remove('open');$('#addExercise').onclick=()=>els.editList.insertAdjacentHTML('beforeend',editRow({name:'New exercise',seconds:60,hint:''},els.editList.children.length));els.editList.onclick=e=>{if(e.target.closest('.remove'))e.target.closest('.editRow').remove()};$('#saveBtn').onclick=saveEditor;$('#restoreBtn').onclick=()=>{routines=structuredClone(presets);saveRoutines();els.modal.classList.remove('open');setRoutine(0);toast('Presets restored')};els.modal.onclick=e=>{if(e.target===els.modal)els.modal.classList.remove('open')};renderPicker();setRoutine(0);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
