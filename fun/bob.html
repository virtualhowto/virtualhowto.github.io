<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospector's Bug Out Bag</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Roboto+Condensed:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto Condensed', sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #4a2c1a 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .poster-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 70% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                linear-gradient(45deg, 
                    rgba(139, 69, 19, 0.3) 0%, 
                    rgba(160, 82, 45, 0.2) 25%,
                    rgba(210, 180, 140, 0.1) 50%,
                    rgba(139, 69, 19, 0.3) 100%
                );
            background-size: 200% 200%;
            animation: subtleShimmer 8s ease-in-out infinite;
        }
        
        @keyframes subtleShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .forest-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.3) 0%, transparent 30%),
                radial-gradient(circle at 60% 40%, rgba(255, 215, 0, 0.2) 0%, transparent 40%),
                linear-gradient(to bottom, rgba(34, 139, 34, 0.1) 0%, transparent 60%);
            opacity: 0.4;
        }
        
        .wood-surface {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70%;
            background: 
                repeating-linear-gradient(
                    90deg,
                    #8B4513 0px,
                    #A0522D 2px,
                    #CD853F 4px,
                    #D2691E 6px,
                    #8B4513 8px
                );
            background-size: 40px 100%;
            opacity: 0.8;
            transform: perspective(800px) rotateX(15deg);
            transform-origin: bottom;
            box-shadow: 
                inset 0 20px 40px rgba(0,0,0,0.3),
                inset 0 -20px 40px rgba(255,215,0,0.1);
        }
        
        .title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            color: #FFD700;
            text-shadow: 
                3px 3px 0px #8B4513,
                6px 6px 0px rgba(0,0,0,0.5),
                0 0 30px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
            text-align: center;
            z-index: 100;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }
        
        @keyframes titleGlow {
            0% { text-shadow: 3px 3px 0px #8B4513, 6px 6px 0px rgba(0,0,0,0.5), 0 0 30px rgba(255, 215, 0, 0.5); }
            100% { text-shadow: 3px 3px 0px #8B4513, 6px 6px 0px rgba(0,0,0,0.5), 0 0 50px rgba(255, 215, 0, 0.8); }
        }
        
        .gear-layout {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            height: 70%;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 10px;
            z-index: 50;
        }
        
        .gear-item {
            position: relative;
            background: rgba(139, 69, 19, 0.3);
            border-radius: 10px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            transition: all 0.3s ease;
            box-shadow: 
                0 8px 16px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,215,0,0.2);
        }
        
        .gear-item:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 15px 30px rgba(0,0,0,0.4),
                inset 0 2px 4px rgba(255,215,0,0.4),
                0 0 25px rgba(255,215,0,0.3);
            border-color: rgba(255, 215, 0, 0.8);
        }
        
        .backpack {
            grid-column: 5 / 9;
            grid-row: 2 / 6;
            background: radial-gradient(circle at 30% 30%, rgba(101, 67, 33, 0.9), rgba(62, 39, 35, 0.9));
            font-size: 4rem;
        }
        
        .pickaxe {
            grid-column: 1 / 3;
            grid-row: 1 / 4;
            transform: rotate(-45deg);
            font-size: 2.5rem;
        }
        
        .shovel {
            grid-column: 11 / 13;
            grid-row: 1 / 4;
            transform: rotate(45deg);
            font-size: 2.5rem;
        }
        
        .gold-pan {
            grid-column: 2 / 5;
            grid-row: 6 / 8;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3), rgba(184, 134, 11, 0.3));
            font-size: 2rem;
        }
        
        .sluice {
            grid-column: 9 / 12;
            grid-row: 6 / 8;
            font-size: 1.8rem;
        }
        
        .boots {
            grid-column: 1 / 3;
            grid-row: 6 / 8;
            font-size: 2rem;
        }
        
        .compass {
            grid-column: 1 / 3;
            grid-row: 4 / 6;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent);
            animation: compassSpin 10s linear infinite;
            font-size: 1.8rem;
        }
        
        @keyframes compassSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .first-aid {
            grid-column: 11 / 13;
            grid-row: 4 / 6;
            background: rgba(220, 20, 60, 0.2);
            font-size: 1.8rem;
        }
        
        .rope {
            grid-column: 3 / 5;
            grid-row: 3 / 5;
            font-size: 1.5rem;
        }
        
        .gloves {
            grid-column: 9 / 11;
            grid-row: 3 / 5;
            font-size: 1.5rem;
        }
        
        .flask {
            grid-column: 5 / 7;
            grid-row: 6 / 8;
            background: radial-gradient(circle, rgba(70, 130, 180, 0.3), transparent);
            font-size: 1.8rem;
        }
        
        .vials {
            grid-column: 7 / 9;
            grid-row: 6 / 8;
            font-size: 1.3rem;
        }
        
        .maps {
            grid-column: 5 / 9;
            grid-row: 1 / 2;
            font-size: 1.5rem;
        }
        
        .gear-icon {
            font-size: inherit;
            margin-bottom: 5px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }
        
        .gear-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .light-rays {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 75% 25%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
            animation: lightShift 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes lightShift {
            0%, 100% { opacity: 0.6; transform: rotate(0deg) scale(1); }
            50% { opacity: 1; transform: rotate(2deg) scale(1.1); }
        }
        
        .adventure-badge {
            position: absolute;
            bottom: 5%;
            right: 5%;
            width: 100px;
            height: 100px;
            border: 3px solid #FFD700;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 69, 19, 0.8), rgba(62, 39, 35, 0.8));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            animation: badgePulse 2s ease-in-out infinite;
        }
        
        @keyframes badgePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); }
        }
        
        @media (max-width: 768px) {
            .gear-layout {
                width: 95%;
                gap: 5px;
            }
            
            .gear-item {
                padding: 5px;
            }
            
            .gear-label {
                font-size: 0.6rem;
            }
            
            .backpack { font-size: 3rem; }
            .pickaxe, .shovel { font-size: 2rem; }
            .gold-pan, .boots, .compass, .first-aid, .flask { font-size: 1.5rem; }
            .rope, .gloves, .maps { font-size: 1.2rem; }
            .vials { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="forest-background"></div>
        <div class="wood-surface"></div>
        <div class="light-rays"></div>
        
        <h1 class="title">WILDERNESS READY<br>PROSPECTOR'S BUG OUT BAG</h1>
        
        <div class="gear-layout">
            <div class="gear-item backpack">
                <div class="gear-icon">🎒</div>
                <div class="gear-label">Canvas Pack</div>
            </div>
            
            <div class="gear-item pickaxe">
                <div class="gear-icon">⛏️</div>
                <div class="gear-label">Pickaxe</div>
            </div>
            
            <div class="gear-item shovel">
                <div class="gear-icon">🕳️</div>
                <div class="gear-label">Shovel</div>
            </div>
            
            <div class="gear-item gold-pan">
                <div class="gear-icon">🥽</div>
                <div class="gear-label">Gold Pan</div>
            </div>
            
            <div class="gear-item sluice">
                <div class="gear-icon">⚒️</div>
                <div class="gear-label">Sluice Box</div>
            </div>
            
            <div class="gear-item boots">
                <div class="gear-icon">🥾</div>
                <div class="gear-label">Sturdy Boots</div>
            </div>
            
            <div class="gear-item compass">
                <div class="gear-icon">🧭</div>
                <div class="gear-label">Compass</div>
            </div>
            
            <div class="gear-item first-aid">
                <div class="gear-icon">🏥</div>
                <div class="gear-label">First Aid</div>
            </div>
            
            <div class="gear-item rope">
                <div class="gear-icon">🪢</div>
                <div class="gear-label">Rope</div>
            </div>
            
            <div class="gear-item gloves">
                <div class="gear-icon">🧤</div>
                <div class="gear-label">Work Gloves</div>
            </div>
            
            <div class="gear-item flask">
                <div class="gear-icon">🍶</div>
                <div class="gear-label">Water Flask</div>
            </div>
            
            <div class="gear-item vials">
                <div class="gear-icon">🧪</div>
                <div class="gear-label">Sample Vials</div>
            </div>
            
            <div class="gear-item maps">
                <div class="gear-icon">🗺️</div>
                <div class="gear-label">Trail Maps</div>
            </div>
        </div>
        
        <div class="adventure-badge">
            <div class="gear-icon">⭐</div>
        </div>
    </div>
</body>
</html>
