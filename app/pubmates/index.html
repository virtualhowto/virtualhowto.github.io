<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PubMates 🍻 Prospect Edition</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>🍻 PubMates</h1>
      <p>Find your central meeting spot — pub, park, creek, or prospecting area.</p>

      <div id="locations"></div>

      <button id="addLocationBtn">➕ Add Location</button>

      <div class="icon-bar">
        <button class="icon-btn" data-type="pub" title="Pubs 🍺">🍺</button>
        <button class="icon-btn" data-type="park" title="Parks 🌳">🌳</button>
        <button class="icon-btn" data-type="creek" title="Creeks 💧">💧</button>
        <button class="icon-btn" data-type="prospecting" title="Prospecting ⛏️">⛏️</button>
      </div>

      <button id="findBtn" class="main-btn">📍 Find Central Point</button>
    </aside>

    <div id="map"></div>
  </div>

  <footer>
    <p>© 2025 PubMates Prospect Edition | Built by <a href="https://virtualhowto.github.io">VirtualHowTo</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
