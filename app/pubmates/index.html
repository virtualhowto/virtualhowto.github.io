<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PubMates 🍺</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🍻 PubMates</h1>
    <p>Find the perfect pub or park halfway between you and your mates.</p>
  </header>

  <main>
    <section id="inputs" class="glass">
      <div id="locations">
        <div class="address-group">
          <input type="text" placeholder="Enter address 1" class="address" />
        </div>
        <div class="address-group">
          <input type="text" placeholder="Enter address 2" class="address" />
        </div>
      </div>

      <div class="add-remove">
        <button id="addLocationBtn">➕ Add another address</button>
      </div>

      <div class="controls">
        <label for="type">Find nearby:</label>
        <select id="type">
          <option value="pub">Pubs 🍺</option>
          <option value="park">Parks 🌳</option>
        </select>
        <button id="findBtn">🍻 Find Meeting Spot</button>
      </div>
    </section>

    <div id="map"></div>
  </main>

  <footer>
    <p>© 2025 PubMates | Built with ❤️ by 
      <a href="https://virtualhowto.github.io">VirtualHowTo</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
