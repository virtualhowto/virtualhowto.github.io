<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Night Pro Camera - VirtualHowTo</title>
    <style>
        :root {
            --vh-primary: #00a8e8;
            --vh-secondary: #0077b6;
            --vh-accent: #00d4ff;
            --vh-dark: #003459;
            --vh-darker: #001d3d;
            --vh-light: #90e0ef;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .vh-logo {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 168, 232, 0.9);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 168, 232, 0.3);
        }

        .vh-logo-icon {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--vh-primary);
        }

        .vh-logo-text {
            color: white;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        #camera-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #video {
            width: 100%;
            flex: 1;
            object-fit: cover;
            background: #000;
        }

        #canvas {
            display: none;
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .button-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 14px;
            border: 2px solid var(--vh-primary);
            background: rgba(0, 168, 232, 0.2);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
            background: rgba(0, 168, 232, 0.4);
        }

        button.active {
            background: var(--vh-primary);
            border-color: var(--vh-accent);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        button.capture {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 0;
            border-width: 4px;
            background: rgba(0, 168, 232, 0.3);
            border-color: var(--vh-accent);
        }

        button.capture:active {
            background: rgba(0, 168, 232, 0.6);
        }

        button.small {
            padding: 8px 15px;
            font-size: 12px;
        }

        .info-panel {
            position: absolute;
            top: 50px;
            left: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            line-height: 1.5;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .label {
            font-weight: 600;
            color: var(--vh-accent);
        }

        .value {
            font-family: 'Courier New', monospace;
        }

        .photo-count {
            position: absolute;
            bottom: 80px;
            right: 15px;
            background: var(--vh-primary);
            padding: 8px 12px;
            border-radius: 15px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 168, 232, 0.3);
            z-index: 100;
        }

        .shutter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            pointer-events: none;
        }

        .shutter-overlay.active {
            display: flex;
        }

        .shutter-countdown {
            text-align: center;
        }

        .shutter-timer {
            font-size: 64px;
            font-weight: 700;
            color: var(--vh-accent);
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            animation: pulse 1s ease-in-out infinite;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shutter-label {
            font-size: 18px;
            color: #fff;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shutter-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px auto 0;
            border-radius: 2px;
            overflow: hidden;
        }

        .shutter-progress-bar {
            height: 100%;
            background: var(--vh-accent);
            width: 0%;
            transition: width linear;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--vh-primary);
            padding: 20px 40px;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            box-shadow: 0 4px 20px rgba(0, 168, 232, 0.5);
        }

        .notification.show {
            opacity: 1;
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(244, 67, 54, 0.95);
            padding: 20px;
            border-radius: 10px;
            color: #fff;
            max-width: 80%;
            text-align: center;
            display: none;
        }

        .slider-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-label {
            color: #fff;
            font-size: 12px;
            min-width: 100px;
            font-weight: 600;
        }

        input[type="range"] {
            flex: 1;
            height: 25px;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--vh-accent);
            border-radius: 50%;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
        }

        input[type="range"]::-moz-range-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: var(--vh-accent);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
        }

        .slider-value {
            color: #fff;
            font-size: 12px;
            min-width: 70px;
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        .section-header {
            color: var(--vh-accent);
            font-size: 13px;
            font-weight: 700;
            margin: 8px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #fff;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-label.checked {
            background: rgba(0, 168, 232, 0.3);
            border: 1px solid var(--vh-accent);
        }

        select {
            background: rgba(0, 168, 232, 0.1);
            color: #fff;
            border: 2px solid rgba(0, 168, 232, 0.3);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            width: 100%;
            margin-top: 5px;
        }

        select option {
            background: var(--vh-darker);
            color: #fff;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="vh-logo">
        <div class="vh-logo-icon">VH</div>
        <div class="vh-logo-text">VirtualHowTo</div>
    </div>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        
        <div class="info-panel">
            <div class="info-row">
                <span class="label">Exposure Time:</span>
                <span class="value" id="exposure-time-value">Auto</span>
            </div>
            <div class="info-row">
                <span class="label">ISO:</span>
                <span class="value" id="iso-value">Auto</span>
            </div>
            <div class="info-row">
                <span class="label">White Balance:</span>
                <span class="value" id="wb-value">Auto</span>
            </div>
            <div class="info-row">
                <span class="label">Capture Interval:</span>
                <span class="value" id="interval-value">2.0s</span>
            </div>
            <div class="info-row">
                <span class="label">Next Photo:</span>
                <span class="value" id="countdown-value">--</span>
            </div>
            <div class="info-row">
                <span class="label">Status:</span>
                <span class="value" id="status-value">Ready</span>
            </div>
        </div>

        <div class="photo-count">📷 <span id="photo-count">0</span></div>

        <div class="shutter-overlay" id="shutter-overlay">
            <div class="shutter-countdown">
                <div class="shutter-timer" id="shutter-timer">0.0s</div>
                <div class="shutter-label">Exposing...</div>
                <div class="shutter-progress">
                    <div class="shutter-progress-bar" id="shutter-progress-bar"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="section-header">Cycle Parameters</div>
            <div class="checkbox-group">
                <label class="checkbox-label" id="cycle-exposure-label">
                    <input type="checkbox" id="cycle-exposure" checked>
                    <span>Exposure Time</span>
                </label>
                <label class="checkbox-label" id="cycle-iso-label">
                    <input type="checkbox" id="cycle-iso" checked>
                    <span>ISO</span>
                </label>
                <label class="checkbox-label" id="cycle-wb-label">
                    <input type="checkbox" id="cycle-wb" checked>
                    <span>White Balance</span>
                </label>
            </div>

            <div class="divider"></div>

            <div class="slider-control">
                <div class="slider-row">
                    <span class="slider-label">Capture Every</span>
                    <select id="interval-select">
                        <option value="500">0.5 seconds</option>
                        <option value="1000">1 second</option>
                        <option value="2000" selected>2 seconds</option>
                        <option value="5000">5 seconds</option>
                        <option value="10000">10 seconds</option>
                        <option value="15000">15 seconds</option>
                        <option value="30000">30 seconds</option>
                        <option value="60000">1 minute</option>
                        <option value="120000">2 minutes</option>
                        <option value="300000">5 minutes</option>
                        <option value="600000">10 minutes</option>
                        <option value="900000">15 minutes</option>
                        <option value="1800000">30 minutes</option>
                        <option value="3600000">60 minutes</option>
                    </select>
                </div>
            </div>

            <div class="divider"></div>

            <div class="button-row">
                <button id="settings-btn" class="small">⚙️ Settings</button>
                <button id="start-cycle">▶️ Start Cycle</button>
                <button class="capture" id="capture">📸</button>
                <button id="view-photos" class="small">View (<span id="count-btn">0</span>)</button>
            </div>
        </div>

        <div class="notification" id="notification">Photo Saved!</div>
        <div class="error" id="error">Camera access denied. Please allow camera permissions.</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startCycleBtn = document.getElementById('start-cycle');
        const captureBtn = document.getElementById('capture');
        const viewPhotosBtn = document.getElementById('view-photos');
        const notification = document.getElementById('notification');
        const errorDiv = document.getElementById('error');
        const intervalSelect = document.getElementById('interval-select');
        const settingsBtn = document.getElementById('settings-btn');
        const shutterOverlay = document.getElementById('shutter-overlay');
        const shutterTimer = document.getElementById('shutter-timer');
        const shutterProgressBar = document.getElementById('shutter-progress-bar');

        // Checkboxes
        const cycleExposureCheckbox = document.getElementById('cycle-exposure');
        const cycleIsoCheckbox = document.getElementById('cycle-iso');
        const cycleWbCheckbox = document.getElementById('cycle-wb');

        let stream = null;
        let track = null;
        let photos = [];
        let isCycling = false;
        let cycleTimeout = null;
        let countdownInterval = null;
        let shutterCountdownInterval = null;
        let currentExposureIndex = 0;
        let currentIsoIndex = 0;
        let currentWBIndex = 0;
        let captureIntervalMs = 2000;
        let nextCaptureTime = null;

        // Night photography settings with longer exposure times
        const exposureTimes = [
            { name: 'Auto', value: null },
            { name: '1/1000s', value: 0.001 },
            { name: '1/500s', value: 0.002 },
            { name: '1/250s', value: 0.004 },
            { name: '1/125s', value: 0.008 },
            { name: '1/60s', value: 0.0167 },
            { name: '1/30s', value: 0.0333 },
            { name: '1/15s', value: 0.0667 },
            { name: '1/8s', value: 0.125 },
            { name: '1/4s', value: 0.25 },
            { name: '1/2s', value: 0.5 },
            { name: '1s', value: 1 },
            { name: '2s', value: 2 },
            { name: '4s', value: 4 },
            { name: '8s', value: 8 },
            { name: '15s', value: 15 },
            { name: '30s', value: 30 },
            { name: '45s', value: 45 },
            { name: '60s', value: 60 },
            { name: '90s', value: 90 },
            { name: '120s', value: 120 }
        ];

        const isoValues = [
            { name: 'Auto', value: null },
            { name: 'ISO 100', value: 100 },
            { name: 'ISO 200', value: 200 },
            { name: 'ISO 400', value: 400 },
            { name: 'ISO 800', value: 800 },
            { name: 'ISO 1600', value: 1600 },
            { name: 'ISO 3200', value: 3200 },
            { name: 'ISO 6400', value: 6400 },
            { name: 'ISO 12800', value: 12800 }
        ];

        const whiteBalancePresets = [
            { name: 'Auto', temp: null },
            { name: 'Tungsten', temp: 3200 },
            { name: 'Fluorescent', temp: 4000 },
            { name: 'Daylight', temp: 5500 },
            { name: 'Cloudy', temp: 6500 },
            { name: 'Shade', temp: 7500 },
            { name: 'Cool White', temp: 4100 },
            { name: 'Warm White', temp: 2700 }
        ];

        // Camera capabilities storage
        let cameraCapabilities = {
            hasExposureTime: false,
            hasISO: false,
            hasWhiteBalance: false,
            hasColorTemperature: false,
            exposureTimeRange: null,
            isoRange: null,
            colorTempRange: null
        };

        // Initialize camera
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                track = stream.getVideoTracks()[0];

                const capabilities = track.getCapabilities();
                console.log('Camera capabilities:', capabilities);

                // Detect what's supported
                detectCapabilities(capabilities);
                
                // Show capabilities to user
                showCapabilitiesInfo();

                updateDisplay();
            } catch (err) {
                console.error('Camera error:', err);
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Camera access denied. Please allow camera permissions and reload.';
            }
        }

        // Detect camera capabilities
        function detectCapabilities(capabilities) {
            // Check exposure time
            if (capabilities.exposureTime) {
                cameraCapabilities.hasExposureTime = true;
                cameraCapabilities.exposureTimeRange = {
                    min: capabilities.exposureTime.min,
                    max: capabilities.exposureTime.max
                };
            }

            // Check ISO
            if (capabilities.iso) {
                cameraCapabilities.hasISO = true;
                cameraCapabilities.isoRange = {
                    min: capabilities.iso.min,
                    max: capabilities.iso.max
                };
            }

            // Check white balance
            if (capabilities.whiteBalanceMode && capabilities.whiteBalanceMode.includes('manual')) {
                cameraCapabilities.hasWhiteBalance = true;
            }

            // Check color temperature
            if (capabilities.colorTemperature) {
                cameraCapabilities.hasColorTemperature = true;
                cameraCapabilities.colorTempRange = {
                    min: capabilities.colorTemperature.min,
                    max: capabilities.colorTemperature.max
                };
            }

            console.log('Detected capabilities:', cameraCapabilities);
        }

        // Show capabilities information
        function showCapabilitiesInfo() {
            const capInfo = [];

            if (cameraCapabilities.hasExposureTime) {
                const minMs = cameraCapabilities.exposureTimeRange.min;
                const maxMs = cameraCapabilities.exposureTimeRange.max;
                const minSec = (minMs / 1000).toFixed(4);
                const maxSec = (maxMs / 1000).toFixed(2);
                capInfo.push(`✅ Exposure Time: ${minSec}s - ${maxSec}s`);
            } else {
                capInfo.push(`❌ Exposure Time: Not supported (will use exposure compensation)`);
            }

            if (cameraCapabilities.hasISO) {
                capInfo.push(`✅ ISO: ${cameraCapabilities.isoRange.min} - ${cameraCapabilities.isoRange.max}`);
            } else {
                capInfo.push(`❌ ISO: Not supported`);
            }

            if (cameraCapabilities.hasColorTemperature) {
                capInfo.push(`✅ White Balance: ${cameraCapabilities.colorTempRange.min}K - ${cameraCapabilities.colorTempRange.max}K`);
            } else if (cameraCapabilities.hasWhiteBalance) {
                capInfo.push(`⚠️ White Balance: Manual mode only (no temperature control)`);
            } else {
                capInfo.push(`❌ White Balance: Not supported`);
            }

            // Show notification with capabilities
            setTimeout(() => {
                notification.innerHTML = `
                    <div style="text-align: left; line-height: 1.6;">
                        <div style="font-weight: bold; margin-bottom: 8px; text-align: center;">📷 Camera Capabilities</div>
                        ${capInfo.map(info => `<div style="font-size: 14px; margin: 4px 0;">${info}</div>`).join('')}
                    </div>
                `;
                notification.style.padding = '20px';
                notification.style.maxWidth = '90%';
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                    notification.style.padding = '20px 40px';
                    notification.style.maxWidth = 'none';
                }, 5000);
            }, 1000);
        }

        // Apply camera settings
        async function applySettings() {
            if (!track) return;

            try {
                const capabilities = track.getCapabilities();
                const constraints = {};

                // Apply exposure time if supported
                if (cameraCapabilities.hasExposureTime && exposureTimes[currentExposureIndex].value !== null) {
                    const expTimeSeconds = exposureTimes[currentExposureIndex].value;
                    const expTimeMs = expTimeSeconds * 1000;
                    const min = cameraCapabilities.exposureTimeRange.min;
                    const max = cameraCapabilities.exposureTimeRange.max;
                    
                    if (expTimeMs >= min && expTimeMs <= max) {
                        constraints.exposureMode = 'manual';
                        constraints.exposureTime = expTimeMs;
                    } else {
                        console.log(`Exposure time ${expTimeMs}ms out of range ${min}-${max}ms`);
                    }
                } else if (capabilities.exposureCompensation && exposureTimes[currentExposureIndex].value !== null) {
                    // Fallback to exposure compensation if exposure time not supported
                    const expValue = Math.min(2, Math.max(-2, exposureTimes[currentExposureIndex].value));
                    constraints.exposureCompensation = expValue;
                }

                // Apply ISO if supported
                if (cameraCapabilities.hasISO && isoValues[currentIsoIndex].value !== null) {
                    const isoValue = isoValues[currentIsoIndex].value;
                    const min = cameraCapabilities.isoRange.min;
                    const max = cameraCapabilities.isoRange.max;
                    const clampedIso = Math.max(min, Math.min(max, isoValue));
                    constraints.iso = clampedIso;
                }

                // Apply white balance if supported
                if (cameraCapabilities.hasColorTemperature && whiteBalancePresets[currentWBIndex].temp !== null) {
                    const wbTemp = whiteBalancePresets[currentWBIndex].temp;
                    const min = cameraCapabilities.colorTempRange.min;
                    const max = cameraCapabilities.colorTempRange.max;
                    const clampedTemp = Math.max(min, Math.min(max, wbTemp));
                    constraints.whiteBalanceMode = 'manual';
                    constraints.colorTemperature = clampedTemp;
                } else if (cameraCapabilities.hasWhiteBalance && whiteBalancePresets[currentWBIndex].temp !== null) {
                    // Manual WB mode without temperature control
                    constraints.whiteBalanceMode = 'manual';
                }

                if (Object.keys(constraints).length > 0) {
                    await track.applyConstraints({ advanced: [constraints] });
                    console.log('Applied constraints:', constraints);
                }

                updateDisplay();
            } catch (err) {
                console.error('Error applying settings:', err);
            }
        }

        // Update display
        function updateDisplay() {
            document.getElementById('exposure-time-value').textContent = exposureTimes[currentExposureIndex].name;
            document.getElementById('iso-value').textContent = isoValues[currentIsoIndex].name;
            
            const wb = whiteBalancePresets[currentWBIndex];
            document.getElementById('wb-value').textContent = 
                wb.temp ? `${wb.name} (${wb.temp}K)` : wb.name;
            
            const intervalSeconds = captureIntervalMs / 1000;
            const intervalText = intervalSeconds >= 60 
                ? `${(intervalSeconds / 60).toFixed(1)}m`
                : intervalSeconds >= 1
                    ? `${intervalSeconds.toFixed(1)}s`
                    : `${intervalSeconds * 1000}ms`;
            document.getElementById('interval-value').textContent = intervalText;
            
            document.getElementById('status-value').textContent = 
                isCycling ? 'Auto Cycling...' : 'Ready';
            
            document.getElementById('photo-count').textContent = photos.length;
            document.getElementById('count-btn').textContent = photos.length;

            // Update checkbox labels
            updateCheckboxStyles();
        }

        // Update checkbox styles and disable unsupported features
        function updateCheckboxStyles() {
            const exposureLabel = document.getElementById('cycle-exposure-label');
            const isoLabel = document.getElementById('cycle-iso-label');
            const wbLabel = document.getElementById('cycle-wb-label');

            // Exposure
            exposureLabel.classList.toggle('checked', cycleExposureCheckbox.checked);
            if (!cameraCapabilities.hasExposureTime) {
                exposureLabel.style.opacity = '0.6';
                exposureLabel.title = 'Limited support - using exposure compensation';
            }

            // ISO
            isoLabel.classList.toggle('checked', cycleIsoCheckbox.checked);
            if (!cameraCapabilities.hasISO) {
                cycleIsoCheckbox.checked = false;
                cycleIsoCheckbox.disabled = true;
                isoLabel.style.opacity = '0.4';
                isoLabel.style.cursor = 'not-allowed';
                isoLabel.title = 'Not supported by your camera';
            }

            // White Balance
            wbLabel.classList.toggle('checked', cycleWbCheckbox.checked);
            if (!cameraCapabilities.hasColorTemperature && !cameraCapabilities.hasWhiteBalance) {
                cycleWbCheckbox.checked = false;
                cycleWbCheckbox.disabled = true;
                wbLabel.style.opacity = '0.4';
                wbLabel.style.cursor = 'not-allowed';
                wbLabel.title = 'Not supported by your camera';
            } else if (!cameraCapabilities.hasColorTemperature) {
                wbLabel.style.opacity = '0.6';
                wbLabel.title = 'Limited support - manual mode only';
            }
        }

        // Update countdown display
        function updateCountdown() {
            if (!nextCaptureTime) {
                document.getElementById('countdown-value').textContent = '--';
                return;
            }

            const now = Date.now();
            const remaining = Math.max(0, nextCaptureTime - now);
            const seconds = (remaining / 1000).toFixed(1);
            document.getElementById('countdown-value').textContent = `${seconds}s`;
        }

        // Show shutter countdown
        async function showShutterCountdown(exposureTime) {
            // Only show for exposures longer than 0.5 seconds
            if (exposureTime === null || exposureTime < 0.5) {
                return;
            }

            shutterOverlay.classList.add('active');
            
            const startTime = Date.now();
            const endTime = startTime + (exposureTime * 1000);
            
            // Clear any existing countdown
            if (shutterCountdownInterval) {
                clearInterval(shutterCountdownInterval);
            }

            shutterCountdownInterval = setInterval(() => {
                const now = Date.now();
                const elapsed = (now - startTime) / 1000;
                const remaining = Math.max(0, exposureTime - elapsed);
                const progress = (elapsed / exposureTime) * 100;

                // Format display based on time remaining
                let displayTime;
                if (remaining >= 60) {
                    const minutes = Math.floor(remaining / 60);
                    const seconds = Math.floor(remaining % 60);
                    displayTime = `${minutes}m ${seconds}s`;
                } else {
                    displayTime = `${remaining.toFixed(1)}s`;
                }

                shutterTimer.textContent = displayTime;
                shutterProgressBar.style.width = `${Math.min(100, progress)}%`;

                if (now >= endTime) {
                    clearInterval(shutterCountdownInterval);
                    shutterCountdownInterval = null;
                    
                    // Keep overlay visible briefly to show completion
                    setTimeout(() => {
                        shutterOverlay.classList.remove('active');
                        shutterProgressBar.style.width = '0%';
                    }, 300);
                }
            }, 50);
        }

        // Get available exposure times based on camera capabilities
        function getAvailableExposureTimes() {
            if (!cameraCapabilities.hasExposureTime) {
                // Return limited set if no exposure time support
                return exposureTimes.slice(0, 7); // Up to 1/15s
            }
            
            const min = cameraCapabilities.exposureTimeRange.min / 1000; // Convert to seconds
            const max = cameraCapabilities.exposureTimeRange.max / 1000;
            
            return exposureTimes.filter(exp => {
                if (exp.value === null) return true; // Keep Auto
                return exp.value >= min && exp.value <= max;
            });
        }

        // Get available ISO values based on camera capabilities
        function getAvailableISOValues() {
            if (!cameraCapabilities.hasISO) {
                return [isoValues[0]]; // Just Auto
            }
            
            const min = cameraCapabilities.isoRange.min;
            const max = cameraCapabilities.isoRange.max;
            
            return isoValues.filter(iso => {
                if (iso.value === null) return true; // Keep Auto
                return iso.value >= min && iso.value <= max;
            });
        }

        // Cycle through settings
        function cycleSettings() {
            const availableExposures = getAvailableExposureTimes();
            const availableISOs = getAvailableISOValues();
            
            // Cycle through enabled parameters
            if (cycleExposureCheckbox.checked) {
                currentExposureIndex = (currentExposureIndex + 1) % availableExposures.length;
            }
            
            // Cycle ISO less frequently (every 2 exposure changes)
            if (cycleIsoCheckbox.checked && cameraCapabilities.hasISO && currentExposureIndex % 2 === 0) {
                currentIsoIndex = (currentIsoIndex + 1) % availableISOs.length;
            }
            
            // Cycle WB even less frequently (every 3 exposure changes)
            if (cycleWbCheckbox.checked && (cameraCapabilities.hasColorTemperature || cameraCapabilities.hasWhiteBalance) && currentExposureIndex % 3 === 0) {
                currentWBIndex = (currentWBIndex + 1) % whiteBalancePresets.length;
            }
            
            applySettings();
        }

        // Schedule next capture
        function scheduleNextCapture() {
            if (!isCycling) return;

            nextCaptureTime = Date.now() + captureIntervalMs;
            
            cycleTimeout = setTimeout(async () => {
                cycleSettings();
                await capturePhoto(true);
                scheduleNextCapture();
            }, captureIntervalMs);
        }

        // Start/Stop auto cycle
        async function toggleCycle() {
            if (!isCycling) {
                // Check if at least one parameter is selected
                if (!cycleExposureCheckbox.checked && !cycleIsoCheckbox.checked && !cycleWbCheckbox.checked) {
                    alert('Please select at least one parameter to cycle (Exposure Time, ISO, or White Balance)');
                    return;
                }

                isCycling = true;
                startCycleBtn.textContent = '⏸ Stop Cycle';
                startCycleBtn.classList.add('active');
                
                // Immediate first capture
                await cycleSettings();
                await capturePhoto(true);
                
                // Schedule next captures
                scheduleNextCapture();

                // Start countdown display
                countdownInterval = setInterval(updateCountdown, 100);
            } else {
                isCycling = false;
                startCycleBtn.textContent = '▶️ Start Cycle';
                startCycleBtn.classList.remove('active');
                
                if (cycleTimeout) {
                    clearTimeout(cycleTimeout);
                    cycleTimeout = null;
                }

                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }

                nextCaptureTime = null;
            }
            updateDisplay();
        }

        // Capture photo
        async function capturePhoto(isAutoCycle = false) {
            if (!video.videoWidth) return;

            // Get current exposure time
            const currentExposureTime = exposureTimes[currentExposureIndex].value;
            
            // Show shutter countdown for long exposures
            if (currentExposureTime && currentExposureTime >= 0.5) {
                showShutterCountdown(currentExposureTime);
                // Wait for the exposure time
                await new Promise(resolve => setTimeout(resolve, currentExposureTime * 1000));
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    const photo = {
                        blob: blob,
                        url: URL.createObjectURL(blob),
                        timestamp: new Date().toISOString(),
                        exposureTime: exposureTimes[currentExposureIndex].name,
                        iso: isoValues[currentIsoIndex].name,
                        whiteBalance: whiteBalancePresets[currentWBIndex].name,
                        whiteBalanceTemp: whiteBalancePresets[currentWBIndex].temp
                    };

                    photos.push(photo);
                    
                    // Show notification
                    notification.textContent = isAutoCycle 
                        ? `Auto Captured #${photos.length}` 
                        : 'Photo Saved!';
                    notification.classList.add('show');
                    setTimeout(() => notification.classList.remove('show'), 1000);
                    
                    updateDisplay();
                    resolve();
                }, 'image/jpeg', 0.95);
            });
        }

        // View saved photos
        function viewPhotos() {
            if (photos.length === 0) {
                alert('No photos saved yet!');
                return;
            }

            // Stop cycling when viewing photos
            if (isCycling) {
                toggleCycle();
            }

            // Create gallery
            const gallery = window.open('', '_blank');
            gallery.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Saved Photos - VirtualHowTo</title>
                    <style>

                            --vh-secondary: #0077b6;
                            --vh-accent: #00d4ff;
                            --vh-dark: #003459;

                        }
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body { 
                            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                            background: #000;
                            color: #fff;
                            padding: 20px;
                        }
                        .vh-header {
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            margin-bottom: 20px;
                            justify-content: center;
                        }
                        .vh-logo-icon {
                            width: 32px;
                            height: 32px;
                            background: white;
                            border-radius: 50%;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-weight: 700;
                            font-size: 16px;
                            color: var(--vh-primary);
                        }
                        .vh-logo-text {
                            color: var(--vh-accent);
                            font-weight: 700;
                            font-size: 16px;
                            letter-spacing: 0.5px;
                        }
                        h1 { text-align: center; margin-bottom: 20px; color: var(--vh-accent); }
                        .photo-grid { 
                            display: grid;
                            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                            gap: 20px;
                            margin-bottom: 20px;
                        }
                        .photo-card {
                            background: var(--vh-darker);
                            border-radius: 10px;
                            overflow: hidden;
                            box-shadow: 0 4px 6px rgba(0, 168, 232, 0.2);
                            border: 1px solid rgba(0, 168, 232, 0.3);
                        }
                        .photo-card img {
                            width: 100%;
                            height: 250px;
                            object-fit: cover;
                            display: block;
                        }
                        .photo-info {
                            padding: 15px;
                            font-size: 13px;
                            line-height: 1.6;
                        }
                        .photo-info strong {
                            color: var(--vh-accent);
                        }
                        .download-btn {
                            width: 100%;
                            padding: 10px;
                            margin-top: 10px;
                            background: var(--vh-primary);
                            color: white;
                            border: none;
                            border-radius: 5px;
                            cursor: pointer;

                        .download-btn:active {
                            background: var(--vh-secondary);
                            transform: scale(0.98);
                        }
                        .download-all {
                            position: sticky;
                            top: 20px;
                            padding: 15px;
                            margin-bottom: 20px;
                            background: var(--vh-primary);
                            color: white;
                            border: none;
                            border-radius: 10px;
                            cursor: pointer;
                            font-size: 16px;
                            font-weight: 600;
                            width: 100%;
                            z-index: 10;

                        @media (max-width: 600px) {

                            }

                    </style>
                </head>
                <body>
                    <div class="vh-header">
                        <div class="vh-logo-icon">VH</div>
                        <div class="vh-logo-text">VirtualHowTo</div>

                    <h1>🌙 Night Photos (${photos.length})</h1>
                    <button class="download-all" onclick="downloadAll()">Download All Photos</button>
                    <div class="photo-grid" id="gallery"></div>
                    <script>
                        const photosData = ${JSON.stringify(photos.map(p => ({
                            url: p.url,
                            timestamp: p.timestamp,

                            card.className = 'photo-card';

                            const timeStr = date.toLocaleTimeString();
                            
                            card.innerHTML = \`

                                    <div><strong>Photo #\${index + 1}</strong></div>

                                    <div>Exposure: \${photo.exposureTime}</div>
                                    <div>ISO: \${photo.iso}</div>
                                    <div>WB: \${photo.whiteBalance}\${photo.whiteBalanceTemp ? ' (' + photo.whiteBalanceTemp + 'K)' : ''}</div>
                                    <button class="download-btn" onclick="downloadPhoto(\${index})">
                                        Download Photo
                                    </button>
                                </div>
                            \`;
                            
                            galleryDiv.appendChild(card);
                        });

                        function downloadPhoto(index) {
                            const photo = photosData[index];
                            const a = document.createElement('a');
                            a.href = photo.url;
                            a.download = \`night_photo_\${index + 1}_\${Date.now()}.jpg\`;
                            a.click();
                        }

                        function downloadAll() {
                            photosData.forEach((photo, index) => {
                                setTimeout(() => {
                                    const a = document.createElement('a');
                                    a.href = photo.url;
                                    a.download = \`night_photo_\${index + 1}_\${Date.now()}.jpg\`;
                                    a.click();
                                }, index * 200);
                            });
                        }
                    <\/script>
                </body>
                </html>
            `);
        }

        // Show settings modal with detailed capabilities
        function showSettings() {
            const currentSettings = track ? track.getSettings() : {};
            
            let capabilitiesText = '📷 CAMERA CAPABILITIES\n\n';
            
            // Exposure Time
            if (cameraCapabilities.hasExposureTime) {
                const minMs = cameraCapabilities.exposureTimeRange.min;
                const maxMs = cameraCapabilities.exposureTimeRange.max;
                const minSec = minMs < 1 ? `${minMs}ms` : `${(minMs / 1000).toFixed(3)}s`;
                const maxSec = `${(maxMs / 1000).toFixed(2)}s`;
                capabilitiesText += `✅ Exposure Time\n   Range: ${minSec} - ${maxSec}\n   Current: ${currentSettings.exposureTime ? (currentSettings.exposureTime / 1000).toFixed(3) + 's' : 'Auto'}\n\n`;
            } else {
                capabilitiesText += `❌ Exposure Time\n   Not supported by this camera\n   (Using exposure compensation instead)\n\n`;
            }
            
            // ISO
            if (cameraCapabilities.hasISO) {
                capabilitiesText += `✅ ISO\n   Range: ${cameraCapabilities.isoRange.min} - ${cameraCapabilities.isoRange.max}\n   Current: ${currentSettings.iso || 'Auto'}\n\n`;
            } else {
                capabilitiesText += `❌ ISO\n   Not supported by this camera\n\n`;
            }
            
            // White Balance
            if (cameraCapabilities.hasColorTemperature) {
                capabilitiesText += `✅ White Balance (Color Temperature)\n   Range: ${cameraCapabilities.colorTempRange.min}K - ${cameraCapabilities.colorTempRange.max}K\n   Current: ${currentSettings.colorTemperature ? currentSettings.colorTemperature + 'K' : 'Auto'}\n\n`;
            } else if (cameraCapabilities.hasWhiteBalance) {
                capabilitiesText += `⚠️ White Balance\n   Manual mode only (no temp control)\n   Current: ${currentSettings.whiteBalanceMode || 'Auto'}\n\n`;
            } else {
                capabilitiesText += `❌ White Balance\n   Not supported by this camera\n\n`;
            }
            
            capabilitiesText += '💡 TIP: Your camera may have limited manual controls. The app will use the best available settings for night photography.';
            
            alert(capabilitiesText);
        }

        // Event listeners
        startCycleBtn.addEventListener('click', toggleCycle);
        captureBtn.addEventListener('click', () => capturePhoto(false));
        viewPhotosBtn.addEventListener('click', viewPhotos);
        settingsBtn.addEventListener('click', showSettings);

        intervalSelect.addEventListener('change', (e) => {
            captureIntervalMs = parseInt(e.target.value);
            updateDisplay();
        });

        // Checkbox listeners
        cycleExposureCheckbox.addEventListener('change', updateCheckboxStyles);
        cycleIsoCheckbox.addEventListener('change', updateCheckboxStyles);
        cycleWbCheckbox.addEventListener('change', updateCheckboxStyles);

        // Initialize
        initCamera();
    </script>
</body>
</html>
