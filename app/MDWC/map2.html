<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Map Builder (NSW Imagery)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet + Esri-Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.11/dist/esri-leaflet.js"></script>

  <!-- html2canvas for export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root{--bg:#0e1116;--panel:#1a1f29;--ink:#e8eef7;--muted:#aab3c5;--accent:#4aa3ff;--border:#2a3342;}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
    header{background:#121722;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
    header h1{font-size:18px;margin:0;font-weight:600}
    #topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
    .btn{background:var(--panel);border:1px solid var(--border);color:var(--ink);padding:6px 12px;border-radius:10px;cursor:pointer}
    .btn.primary{background:var(--accent);color:#0a1524;border:none}
    #toolbar{display:flex;gap:10px;padding:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:#1a1f29}
    .tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border:1px dashed var(--border);border-radius:10px;cursor:grab;background:var(--panel)}
    .tool .emoji{font-size:28px}
    .tool .lbl{font-size:12px;color:var(--muted)}
    #map{width:100%;height:80vh}
    /* overlay canvas for drawing */
    #draw-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
    /* leaflet tooltip tweak (for our editable labels) */
    .leaflet-tooltip.custom-label{background:rgba(18,23,34,.75);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:2px 6px;font-size:12px}
    #hint{position:fixed;bottom:10px;left:10px;background:#0f141d;border:1px solid var(--border);padding:8px 10px;border-radius:10px;color:var(--muted);font-size:12px;z-index:1000}
  </style>
</head>
<body>
  <header>
    <h1>Event Map Builder</h1>
    <div id="topbar">
      <button class="btn" id="modeToggle">✏️ Draw Mode</button>
      <input type="color" id="colorPicker" value="#ff0000" class="btn" />
      <label style="display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;">
        <input type="checkbox" id="fillToggle" checked /> Fill
      </label>
      <button class="btn" id="finishPolygon">Finish Polygon</button>
      <button class="btn primary" id="exportBtn">Export PNG</button>
    </div>
  </header>

  <div id="toolbar">
    <div class="tool" draggable="true" data-label="Stage" data-icon="🎤"><span class="emoji">🎤</span><span class="lbl">Stage</span></div>
    <div class="tool" draggable="true" data-label="Toilets" data-icon="🚻"><span class="emoji">🚻</span><span class="lbl">Toilets</span></div>
    <div class="tool" draggable="true" data-label="Parking" data-icon="🅿️"><span class="emoji">🅿️</span><span class="lbl">Parking</span></div>
    <div class="tool" draggable="true" data-label="First Aid" data-icon="⛑️"><span class="emoji">⛑️</span><span class="lbl">First Aid</span></div>
    <div class="tool" draggable="true" data-label="Camping" data-icon="⛺"><span class="emoji">⛺</span><span class="lbl">Camping</span></div>
    <div class="tool" draggable="true" data-label="Competition Detecting" data-icon="🏆🔎"><span class="emoji">🏆🔎</span><span class="lbl">Competition</span></div>
    <div class="tool" draggable="true" data-label="Free Detecting" data-icon="🆓🔎"><span class="emoji">🆓🔎</span><span class="lbl">Free Detecting</span></div>
    <div class="tool" draggable="true" data-label="Sign-in Desk" data-icon="🛎️"><span class="emoji">🛎️</span><span class="lbl">Sign-in Desk</span></div>
    <div class="tool" draggable="true" data-label="Entry Gate" data-icon="⛩️"><span class="emoji">⛩️</span><span class="lbl">Entry Gate</span></div>
    <div class="tool" draggable="true" data-label="Food Area" data-icon="🍽️"><span class="emoji">🍽️</span><span class="lbl">Food Area</span></div>
  </div>

  <div id="map"></div>
  <canvas id="draw-layer"></canvas>

  <div id="hint">💡 Pan/zoom NSW Imagery • Drag icons • Draw polygons (fill optional) • Click polygon to select + Delete • Export PNG</div>

  <script>
    // --- Leaflet map ---
    const map = L.map('map', { zoomControl: true }).setView([-32.77, 149.67], 15);

    // --- NSW Imagery basemap via ArcGIS REST (Esri-Leaflet) ---
    // If this fails, check the service name; common one is 'NSW_Imagery'.
    L.esri.tiledMapLayer({
      url: 'https://maps.six.nsw.gov.au/arcgis/rest/services/public/NSW_Imagery/MapServer',
      attribution: 'Imagery © NSW Spatial Services'
    }).addTo(map);

    // --- Overlay canvas for freehand polygon drawing (screen space) ---
    const canvas = document.getElementById('draw-layer');
    const ctx = canvas.getContext('2d');
    function resizeCanvas(){ const size = map.getSize(); canvas.width=size.x; canvas.height=size.y; redraw(); }
    map.on('resize', resizeCanvas); resizeCanvas();

    // Keep canvas aligned with map when panning/zooming
    map.on('move', redraw);
    map.on('zoom', redraw);

    // --- State ---
    let dragItem=null, drawMode=false, points=[], polygons=[], selectedPolygonIndex=null;

    // --- Drag/drop icons -> Leaflet markers with editable tooltips ---
    document.querySelectorAll('.tool').forEach(t => t.addEventListener('dragstart', ()=>{dragItem=t;}));
    map.getContainer().addEventListener('dragover', e => e.preventDefault());
    map.getContainer().addEventListener('drop', e => {
      e.preventDefault();
      if(!dragItem || drawMode) return;
      const containerPoint = L.point(e.offsetX, e.offsetY);
      const latlng = map.containerPointToLatLng(containerPoint);
      addMarker(dragItem.dataset.icon, dragItem.dataset.label, latlng);
    });

    function addMarker(icon,label,latlng){
      const marker = L.marker(latlng, { draggable: true }).addTo(map);
      marker.bindTooltip(`<div contenteditable="true" style="outline:0">${icon} ${label}</div>`, {
        permanent:true, direction:'top', className:'custom-label', opacity:0.95
      });
    }

    // --- Polygon drawing on canvas (screen coords) ---
    document.getElementById('modeToggle').onclick = () => {
      drawMode = !drawMode;
      document.getElementById('modeToggle').textContent = drawMode ? '🖱️ Label Mode' : '✏️ Draw Mode';
    };

    map.on('click', e => {
      if(!drawMode) {
        // selection: click to select a polygon
        const cp = map.latLngToContainerPoint(e.latlng);
        selectedPolygonIndex = hitTestPolygon(cp.x, cp.y);
        redraw();
        return;
      }
      const pt = map.latLngToContainerPoint(e.latlng);
      points.push(pt);
      redraw();
    });

    document.getElementById('finishPolygon').onclick = () => {
      if(points.length > 2){
        polygons.push({ points: points.map(p => L.point(p.x, p.y)), color: document.getElementById('colorPicker').value });
      }
      points = [];
      redraw();
    };

    // --- Delete selected polygon with Delete key ---
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Delete' && selectedPolygonIndex != null){
        polygons.splice(selectedPolygonIndex,1);
        selectedPolygonIndex = null;
        redraw();
      }
    });

    // --- Drawing helpers (screen space) ---
    function pathFromPoints(pts){
      const p = new Path2D();
      if(!pts.length) return p;
      p.moveTo(pts[0].x, pts[0].y);
      for(let i=1;i<pts.length;i++) p.lineTo(pts[i].x, pts[i].y);
      p.closePath(); return p;
    }
    function hitTestPolygon(x,y){
      for(let i=polygons.length-1;i>=0;i--){
        const p = pathFromPoints(polygons[i].points);
        if(ctx.isPointInPath(p, x, y)) return i;
      }
      return null;
    }
    function hexToRgba(hex,a){let r=0,g=0,b=0;if(hex?.length===7){r=parseInt(hex.slice(1,3),16);g=parseInt(hex.slice(3,5),16);b=parseInt(hex.slice(5,7),16);}return `rgba(${r},${g},${b},${a})`; }

    function redraw(){
      // reproject stored screen points if map moved? We stored screen coords,
      // so we just repaint; polygons stay visually fixed relative to the viewport.
      // (If you want geo-anchored polygons, I can convert these to Leaflet polygons.)
      ctx.clearRect(0,0,canvas.width,canvas.height);
      polygons.forEach((poly,i)=>{
        const p = pathFromPoints(poly.points);
        if(document.getElementById('fillToggle').checked){
          ctx.fillStyle = hexToRgba(poly.color, 0.25);
          ctx.fill(p);
        }
        ctx.setLineDash([6,4]);
        ctx.lineWidth = i===selectedPolygonIndex ? 3 : 2;
        ctx.strokeStyle = i===selectedPolygonIndex ? '#000' : poly.color;
        ctx.stroke(p);
      });
      if(points.length){
        ctx.setLineDash([4,4]);
        ctx.strokeStyle = document.getElementById('colorPicker').value;
        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
        for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.stroke();
      }
    }

    // --- Export (map only; overlays are included via html2canvas on map container) ---
    document.getElementById('exportBtn').onclick = () => {
      html2canvas(document.querySelector('#map'), {useCORS:true, scale:2}).then(c=>{
        const a=document.createElement('a'); a.download='event-map.png'; a.href=c.toDataURL(); a.click();
      });
    };
  </script>
</body>
</html>
