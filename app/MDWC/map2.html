<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Map Builder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.11/dist/esri-leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{--bg:#0e1116;--panel:#1a1f29;--ink:#e8eef7;--muted:#aab3c5;--accent:#4aa3ff;--border:#2a3342;}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
    header{background:#121722;border-bottom:1px solid var(--border);padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    header h1{font-size:16px;margin:0;font-weight:600;flex:0 0 auto}
    #topbar{display:flex;flex:1;flex-wrap:wrap;gap:6px;align-items:center}
    .btn{background:var(--panel);border:1px solid var(--border);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
    .btn.primary{background:var(--accent);color:#0a1524;border:none}
    .dropdown{position:relative;display:inline-block}
    .dropdown-content{display:none;position:absolute;background:#1a1f29;border:1px solid var(--border);border-radius:8px;min-width:120px;z-index:2000}
    .dropdown-content button{width:100%;text-align:left;padding:6px 10px;background:none;border:none;color:var(--ink);cursor:pointer}
    .dropdown:hover .dropdown-content{display:block}
    #pdfDialog{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1f29;border:1px solid var(--border);border-radius:10px;padding:20px;z-index:3000;width:280px}
    #pdfDialog label{display:block;margin:10px 0;color:var(--muted)}
    #pdfDialog select{width:100%;padding:6px;margin-top:4px;background:#000;color:#fff;border-radius:6px}
    #pdfDialog .actions{margin-top:15px;text-align:right}
  </style>
</head>
<body>
  <header>
    <h1>Event Map Builder</h1>
    <div id="topbar">
      <div class="dropdown">
        <button class="btn">📤 Export ▼</button>
        <div class="dropdown-content">
          <button id="exportPng">Export PNG</button>
          <button id="openPdfDialog">Export PDF</button>
          <button id="exportJsonBtn">Export JSON</button>
          <button id="importJsonBtn">Import JSON</button>
        </div>
      </div>
    </div>
  </header>

  <div id="mapWrap"><div id="map"></div></div>

  <!-- PDF Options Dialog -->
  <div id="pdfDialog">
    <h3 style="margin-top:0;color:#fff;">PDF Export Options</h3>
    <label>Paper Size
      <select id="pdfSize">
        <option value="a4">A4</option>
        <option value="a3">A3</option>
        <option value="a1">A1</option>
      </select>
    </label>
    <label>Orientation
      <select id="pdfOrientation">
        <option value="portrait">Portrait</option>
        <option value="landscape">Landscape</option>
      </select>
    </label>
    <label>Scale Mode
      <select id="pdfScaleMode">
        <option value="ratio">Maintain Ratio</option>
        <option value="fit">Fit to Page</option>
      </select>
    </label>
    <div class="actions">
      <button class="btn" id="cancelPdf">Cancel</button>
      <button class="btn primary" id="exportPdf">Export</button>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([-33.083,149.689],15); // Sofala fallback
    L.esri.tiledMapLayer({
      url:'https://maps.six.nsw.gov.au/arcgis/rest/services/public/NSW_Imagery/MapServer',
      attribution:'Imagery © NSW Spatial Services'
    }).addTo(map);

    // Export PNG
    document.getElementById('exportPng').onclick=()=>{
      html2canvas(document.getElementById('mapWrap'),{useCORS:true,scale:2})
        .then(c=>{
          const a=document.createElement('a');
          a.download='event-map.png';
          a.href=c.toDataURL('image/png');
          a.click();
        });
    };

    // Open PDF options dialog
    document.getElementById('openPdfDialog').onclick=()=>{
      document.getElementById('pdfDialog').style.display='block';
    };
    document.getElementById('cancelPdf').onclick=()=>{
      document.getElementById('pdfDialog').style.display='none';
    };

    // Export PDF
    document.getElementById('exportPdf').onclick=()=>{
      const { jsPDF } = window.jspdf;
      const size=document.getElementById('pdfSize').value;
      const orientation=document.getElementById('pdfOrientation').value;
      const scaleMode=document.getElementById('pdfScaleMode').value;
      const pdf=new jsPDF({orientation,unit:'mm',format:size});
      html2canvas(document.getElementById('mapWrap'),{useCORS:true,scale:2,backgroundColor:'#000'})
        .then(c=>{
          const img=c.toDataURL('image/jpeg',1.0);
          const pageW=pdf.internal.pageSize.getWidth();
          const pageH=pdf.internal.pageSize.getHeight();
          let imgW,imgH,x,y;
          if(scaleMode==='fit'){imgW=pageW;imgH=pageH;x=0;y=0;}
          else{
            const ratio=Math.min(pageW/c.width,pageH/c.height);
            imgW=c.width*ratio; imgH=c.height*ratio;
            x=(pageW-imgW)/2; y=(pageH-imgH)/2;
          }
          pdf.addImage(img,'JPEG',x,y,imgW,imgH);
          pdf.save(`event-map-${size}-${orientation}.pdf`);
          document.getElementById('pdfDialog').style.display='none';
        });
    };

    // Stub JSON import/export
    document.getElementById('exportJsonBtn').onclick=()=>alert("JSON export not wired in this snippet");
    document.getElementById('importJsonBtn').onclick=()=>alert("JSON import not wired in this snippet");
  </script>
</body>
</html>
