<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Map Builder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet + Esri-Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.11/dist/esri-leaflet.js"></script>

  <!-- Export libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root{--bg:#0e1116;--panel:#1a1f29;--ink:#e8eef7;--muted:#aab3c5;--accent:#4aa3ff;--border:#2a3342;}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
    header{background:#121722;border-bottom:1px solid var(--border);padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    header h1{font-size:16px;margin:0;font-weight:600;flex:0 0 auto}
    #topbar{display:flex;flex:1;flex-wrap:wrap;gap:6px;align-items:center}
    .btn{background:var(--panel);border:1px solid var(--border);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
    .btn.primary{background:var(--accent);color:#0a1524;border:none}
    #searchBox{background:#fff;color:#000;border:1px solid var(--border);border-radius:6px;padding:6px;font-size:14px;flex:1;min-width:160px}
    #toolbar{display:flex;overflow-x:auto;gap:8px;padding:6px;background:#1a1f29;border-bottom:1px solid var(--border)}
    .tool{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:6px 8px;border:1px dashed var(--border);border-radius:8px;cursor:pointer;background:var(--panel)}
    .tool .emoji{font-size:22px}

    #mapWrap{position:relative}
    #map{width:100%;height:calc(100vh - 340px)}

    #hint{position:fixed;bottom:6px;left:6px;right:6px;background:#0f141d;border:1px solid var(--border);padding:6px 10px;border-radius:10px;color:var(--muted);font-size:12px;z-index:1000;text-align:center}

    #polygonControls{position:fixed;bottom:70px;right:10px;display:none;flex-direction:column;gap:6px;z-index:1200}

    #legend{position:absolute;bottom:10px;left:10px;background:#000;border:1px solid var(--border);padding:8px;border-radius:10px;font-size:12px;z-index:800;color:#fff;max-width:220px}
    #legend h3{margin:0 0 6px 0;font-size:12px}
    #legend ul{margin:0;padding:0;list-style:none}
    #legend li{margin:2px 0}

    #watermark{position:absolute;bottom:10px;right:10px;z-index:850;display:none;cursor:move;user-select:none}
    #watermark img{display:block;max-width:100%;max-height:100%}
    #wmControls{position:absolute;bottom:110%;right:0;background:#0f141d;border:1px solid var(--border);border-radius:8px;padding:8px;display:none;gap:6px;z-index:851;width:240px}
    #wmControls label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;margin:4px 0}
    #wmControls input[type="range"]{flex:1}

    .compass-control{
      background:#0f141d;border:1px solid var(--border);border-radius:50%;
      width:40px;height:40px;display:flex;align-items:center;justify-content:center;
      font-size:20px;color:var(--ink)
    }

    .size-popup label{font-size:12px;color:#000;display:flex;align-items:center;gap:6px}
    .size-popup input[type="range"]{width:140px}
  </style>
</head>
<body>
  <header>
    <h1>Event Map Builder</h1>
    <div id="topbar">
      <input type="text" id="searchBox" placeholder="Search location..." />
      <button class="btn" id="gpsBtn">📍 Use GPS</button>
      <label style="color:var(--muted);font-size:12px;">
        Icon Size <input type="range" id="iconSize" min="12" max="96" step="2" value="26">
      </label>
      <button class="btn" id="modeToggle">✏️ Draw Mode</button>
      <input type="color" id="colorPicker" value="#ff0000" class="btn" />
      <button class="btn" id="finishPolygon">Finish</button>
      <button class="btn" id="cancelPolygon">Cancel</button>
      <label style="display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;">
        <input type="checkbox" id="defaultFill" checked /> Fill new polygon
      </label>

      <!-- JSON save/load -->
      <button class="btn" id="exportJsonBtn">Export JSON</button>
      <input type="file" id="importJsonFile" accept="application/json" style="display:none"/>
      <button class="btn" id="importJsonBtn">Import JSON</button>

      <!-- watermark (accept any file; browser will ignore non-images) -->
      <input type="file" id="logoFile" style="display:none"/>
      <button class="btn" id="logoBtn">Upload Logo</button>
      <button class="btn" id="toggleWmPanel">WM Controls</button>

      <!-- export -->
      <select id="exportSize" class="btn">
        <option value="a4">A4</option>
        <option value="a3">A3</option>
        <option value="a1">A1</option>
      </select>
      <select id="exportOrientation" class="btn">
        <option value="portrait">Portrait</option>
        <option value="landscape">Landscape</option>
      </select>
      <select id="exportScaleMode" class="btn">
        <option value="ratio">Maintain Ratio</option>
        <option value="fit">Fit to Page</option>
      </select>
      <button class="btn" id="exportBtn">Export PNG</button>
      <button class="btn primary" id="exportPdfBtn">Export PDF</button>
    </div>
  </header>

  <div id="toolbar">
    <div class="tool" data-label="Stage" data-icon="🎤"><span class="emoji">🎤</span></div>
    <div class="tool" data-label="Toilets" data-icon="🚻"><span class="emoji">🚻</span></div>
    <div class="tool" data-label="Parking" data-icon="🅿️"><span class="emoji">🅿️</span></div>
    <div class="tool" data-label="First Aid" data-icon="⛑️"><span class="emoji">⛑️</span></div>
    <div class="tool" data-label="Camping" data-icon="⛺"><span class="emoji">⛺</span></div>
    <div class="tool" data-label="Competition Detecting" data-icon="🏆🔎"><span class="emoji">🏆🔎</span></div>
    <div class="tool" data-label="Free Detecting" data-icon="🆓🔎"><span class="emoji">🆓🔎</span></div>
    <div class="tool" data-label="Sign-in Desk" data-icon="🛎️"><span class="emoji">🛎️</span></div>
    <div class="tool" data-label="Entry Gate" data-icon="⛩️"><span class="emoji">⛩️</span></div>
    <div class="tool" data-label="Food Area" data-icon="🍽️"><span class="emoji">🍽️</span></div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>

    <!-- Legend inside the map so exports match the view -->
    <div id="legend"><h3>Legend</h3><ul id="legendList"></ul></div>

    <!-- Watermark with controls -->
    <div id="watermark">
      <img id="watermarkImg" alt="watermark"/>
      <div id="wmControls">
        <label>Opacity <input id="wmOpacity" type="range" min="0.05" max="1" step="0.05" value="0.5"></label>
        <label>Size (px) <input id="wmSize" type="range" min="60" max="800" step="10" value="180"></label>
        <div style="display:flex;gap:6px;justify-content:flex-end;">
          <button class="btn" id="wmHide">Hide</button>
        </div>
      </div>
    </div>
  </div>

  <div id="hint">💡 GPS start (Sofala fallback) • Drag/click emoji labels (per-icon resize: right-click/long-press) • Draw polygons (toggle fill/delete) • Watermark • Export PNG/PDF • Export/Import JSON</div>

  <div id="polygonControls" class="leaflet-top leaflet-right">
    <button id="toggleFill" class="btn">Toggle Fill</button>
    <button id="deletePoly" class="btn">Delete</button>
  </div>

  <script>
    // --- Map init with GPS and Sofala fallback ---
    const map = L.map('map'); // no initial view yet
    L.esri.tiledMapLayer({
      url:'https://maps.six.nsw.gov.au/arcgis/rest/services/public/NSW_Imagery/MapServer',
      attribution:'Imagery © NSW Spatial Services'
    }).addTo(map);

    const SOFALA_CENTER = [-33.083, 149.689]; // Sofala NSW
    const SOFALA_ZOOM = 15;

    let userMarker = null;
    let userAccuracy = null;

    function centerOnUser({silent=false} = {}) {
      if (!navigator.geolocation) {
        map.setView(SOFALA_CENTER, SOFALA_ZOOM);
        if (!silent) alert("Geolocation not supported by this browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = pos.coords.accuracy || 0;

          map.setView([lat, lng], 16);

          if (!userMarker) {
            userMarker = L.marker([lat, lng], { title: "You are here" }).addTo(map);
          } else {
            userMarker.setLatLng([lat, lng]);
          }
          if (!userAccuracy) {
            userAccuracy = L.circle([lat, lng], { radius: acc, color:"#4aa3ff", fillOpacity:0.15 }).addTo(map);
          } else {
            userAccuracy.setLatLng([lat, lng]).setRadius(acc);
          }
        },
        () => {
          map.setView(SOFALA_CENTER, SOFALA_ZOOM);
          if (!silent) alert("Could not get your location. Defaulting to Sofala, NSW.");
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    }

    // Try to center at load (silent)
    centerOnUser({ silent: true });
    // GPS button
    document.getElementById('gpsBtn').addEventListener('click', () => centerOnUser());

    // Compass control
    const compassControl = L.control({position: 'topright'});
    compassControl.onAdd = () => {
      const div = L.DomUtil.create('div', 'compass-control'); div.innerHTML = '🧭'; return div;
    };
    compassControl.addTo(map);

    // Search (Enter to pan via Nominatim)
    const searchBox=document.getElementById('searchBox');
    searchBox.addEventListener('keydown',async e=>{
      if(e.key!=="Enter") return;
      const q=searchBox.value.trim(); if(!q) return;
      try{
        const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
        const data=await res.json();
        if(data && data.length){ map.setView([+data[0].lat, +data[0].lon], 15); }
        else alert("Location not found");
      }catch{ alert("Search error"); }
    });

    // ---------- State ----------
    let drawMode=false, tempPoints=[], tempLines=[], polygons=[], selected=null, selectedLine=null, activeTool=null;
    const legendSet=new Map();
    const markers=[]; // store emoji markers

    // ---------- Tools ----------
    document.querySelectorAll('.tool').forEach(t=>{
      t.addEventListener('dragstart',()=>{activeTool=t;});
      t.addEventListener('click',()=>{ activeTool=t; });
    });
    map.getContainer().addEventListener('dragover',e=>e.preventDefault());
    map.getContainer().addEventListener('drop',e=>{
      e.preventDefault(); if(!activeTool||drawMode) return;
      placeEmoji(map.containerPointToLatLng([e.offsetX,e.offsetY]), {label:activeTool.dataset.label, icon:activeTool.dataset.icon});
    });
    map.on('click',e=>{
      if(activeTool && !drawMode){ placeEmoji(e.latlng, {label:activeTool.dataset.label, icon:activeTool.dataset.icon}); activeTool=null; return; }
      if(!drawMode) return;
      // drawing lines for visualizing polygon edges as you click
      tempPoints.push([e.latlng.lat,e.latlng.lng]);
      if(tempPoints.length>1){
        const line=L.polyline([tempPoints.at(-2),tempPoints.at(-1)],{
          color:document.getElementById('colorPicker').value,dashArray:"4,4",weight:2
        }).addTo(map);
        line.on('click',()=>selectLine(line));
        tempLines.push(line);
      }
    });

    function placeEmoji(latlng, meta){
      const defaultSize = parseInt(document.getElementById('iconSize').value);
      const size = meta.size || defaultSize;

      const html = `<div style="font-size:${size}px;cursor:move;">${meta.icon}</div>`;
      const marker = L.marker(latlng,{
        icon: L.divIcon({className:"custom-div-icon",html,iconSize:[size,size],iconAnchor:[size/2,size/2]}),
        draggable:true
      }).addTo(map);
      marker.myMeta = {...meta, size};
      markers.push(marker);

      legendSet.set(meta.label, meta.icon);
      renderLegend();

      // Per-icon size popup (right-click) + long-press for mobile
      marker.on('contextmenu',()=>openSizePopup(marker));
      let lpTimer=null;
      marker.on('touchstart', ()=>{ lpTimer=setTimeout(()=>openSizePopup(marker), 600); });
      marker.on('touchend', ()=>{ if(lpTimer) clearTimeout(lpTimer); });
    }

    function openSizePopup(marker){
      const sizeNow = marker.myMeta.size || 26;
      const wrap = document.createElement('div');
      wrap.className = 'size-popup';
      wrap.innerHTML = `<label>Size <input type="range" min="12" max="96" step="2" value="${sizeNow}"></label>`;
      const input = wrap.querySelector('input');
      input.addEventListener('input', ()=>{
        const newSize = parseInt(input.value);
        marker.myMeta.size = newSize;
        marker.setIcon(L.divIcon({
          className:"custom-div-icon",
          html:`<div style="font-size:${newSize}px;cursor:move;">${marker.myMeta.icon}</div>`,
          iconSize:[newSize,newSize],
          iconAnchor:[newSize/2,newSize/2]
        }));
      });
      marker.bindPopup(wrap, {autoPan:true}).openPopup();
    }

    function renderLegend(){
      const list=document.getElementById('legendList'); list.innerHTML='';
      legendSet.forEach((icon,label)=>{ const li=document.createElement('li'); li.textContent=`${icon} ${label}`; list.appendChild(li); });
    }

    // Global icon size sets default for NEW icons
    document.getElementById('iconSize').addEventListener('change',()=>{ /* defaults only */ });

    // ---------- Drawing polygons ----------
    document.getElementById('modeToggle').onclick=()=>{
      drawMode=!drawMode;
      document.getElementById('modeToggle').textContent=drawMode?'🖱️ Label Mode':'✏️ Draw Mode';
    };
    document.getElementById('finishPolygon').onclick=()=>{
      if(tempPoints.length>2){
        const poly=L.polygon(tempPoints,{
          color:document.getElementById('colorPicker').value,weight:2,dashArray:"6,4",
          fillOpacity: document.getElementById('defaultFill').checked ? 0.25 : 0
        }).addTo(map);
        poly.on('click',()=>selectPolygon(poly));
        polygons.push(poly);
      }
      clearSketch();
    };
    document.getElementById('cancelPolygon').onclick=()=>clearSketch();

    function clearSketch(){ tempPoints=[]; tempLines.forEach(l=>map.removeLayer(l)); tempLines=[]; }
    function selectPolygon(poly){ selected=poly; selectedLine=null; document.getElementById('polygonControls').style.display='flex'; }
    function selectLine(line){ if(selectedLine) selectedLine.setStyle({weight:2}); selectedLine=line; selected=null; line.setStyle({weight:4}); document.getElementById('polygonControls').style.display='none'; }
    document.getElementById('toggleFill').onclick=()=>{ if(!selected) return; selected.setStyle({fillOpacity: selected.options.fillOpacity>0 ? 0 : 0.25}); };
    document.getElementById('deletePoly').onclick=()=>deleteSelected();
    document.addEventListener('keydown',e=>{ if(e.key==="Delete") deleteSelected(); });
    function deleteSelected(){
      if(selected){ map.removeLayer(selected); polygons=polygons.filter(p=>p!==selected); selected=null; document.getElementById('polygonControls').style.display='none'; }
      if(selectedLine){ map.removeLayer(selectedLine); tempLines=tempLines.filter(l=>l!==selectedLine); selectedLine=null; }
    }

    // ---------- Watermark ----------
    const wm=document.getElementById('watermark'), wmImg=document.getElementById('watermarkImg'),
          wmControls=document.getElementById('wmControls'), wmOpacity=document.getElementById('wmOpacity'), wmSize=document.getElementById('wmSize');
    document.getElementById('logoBtn').onclick=()=>document.getElementById('logoFile').click();
    document.getElementById('logoFile').addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{
        wmImg.src=ev.target.result;
        wm.style.display='block'; wmControls.style.display='flex';
        wm.style.width=wmSize.value+'px'; wm.style.opacity=wmOpacity.value;
        ensureWMLeftTop();
      };
      r.readAsDataURL(f);
    });
    document.getElementById('toggleWmPanel').onclick=()=>{ wmControls.style.display=(wmControls.style.display==='flex'?'none':'flex'); };
    wmOpacity.oninput=()=>wm.style.opacity=wmOpacity.value;
    wmSize.oninput=()=>wm.style.width=wmSize.value+'px';
    document.getElementById('wmHide').onclick=()=>{ wm.style.display='none'; wmControls.style.display='none'; };

    function ensureWMLeftTop(){
      if(!wm.style.left && !wm.style.top){
        wm.style.left = (document.getElementById('mapWrap').clientWidth - 200) + 'px';
        wm.style.top  = (document.getElementById('mapWrap').clientHeight - 150) + 'px';
        wm.style.right='auto'; wm.style.bottom='auto'; wm.style.position='absolute';
      }
    }

    // Drag watermark (mouse)
    let dragging=false,startX=0,startY=0,startLeft=0,startTop=0;
    wm.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX;startY=e.clientY;const r=wm.getBoundingClientRect();startLeft=r.left;startTop=r.top;map.dragging.disable();});
    window.addEventListener('mousemove',e=>{if(!dragging) return;const dx=e.clientX-startX,dy=e.clientY-startY;const wrap=document.getElementById('mapWrap').getBoundingClientRect();wm.style.left=(startLeft+dx-wrap.left)+'px';wm.style.top=(startTop+dy-wrap.top)+'px';wm.style.right='auto';wm.style.bottom='auto';wm.style.position='absolute';});
    window.addEventListener('mouseup',()=>{dragging=false;map.dragging.enable();});

    // Drag watermark (touch)
    let draggingT=false, tStart=null;
    wm.addEventListener('touchstart',e=>{const t=e.touches[0];draggingT=true;tStart={x:t.clientX,y:t.clientY};const r=wm.getBoundingClientRect();startLeft=r.left;startTop=r.top;map.dragging.disable();},{passive:false});
    window.addEventListener('touchmove',e=>{if(!draggingT) return;const t=e.touches[0];const dx=t.clientX-tStart.x,dy=t.clientY-tStart.y;const wrap=document.getElementById('mapWrap').getBoundingClientRect();wm.style.left=(startLeft+dx-wrap.left)+'px';wm.style.top=(startTop+dy-wrap.top)+'px';wm.style.right='auto';wm.style.bottom='auto';wm.style.position='absolute';e.preventDefault();},{passive:false});
    window.addEventListener('touchend',()=>{draggingT=false;map.dragging.enable();});

    // Draw WM on canvas (for exports)
    function addWatermarkToCanvas(c){
      return new Promise(resolve=>{
        if(!wmImg.src || wm.style.display==='none'){ return resolve(c); }
        const ctx=c.getContext('2d'); const wrap=document.getElementById('mapWrap').getBoundingClientRect(); const wmRect=wm.getBoundingClientRect();
        const scaleX=c.width/wrap.width, scaleY=c.height/wrap.height;
        const left=(wmRect.left-wrap.left)*scaleX, top=(wmRect.top-wrap.top)*scaleY, w=wmRect.width*scaleX, h=wmRect.height*scaleY;
        ctx.globalAlpha=parseFloat(wmOpacity.value); ctx.drawImage(wmImg,left,top,w,h); ctx.globalAlpha=1; resolve(c);
      });
    }

    // ---------- PNG Export (whole page) ----------
    document.getElementById('exportBtn').onclick=()=>{
      const size=document.getElementById('exportSize').value;
      let scale=2; if(size==='a4') scale=2.5; if(size==='a3') scale=3.5; if(size==='a1') scale=7;
      html2canvas(document.body,{useCORS:true,scale}).then(addWatermarkToCanvas).then(c=>{
        const a=document.createElement('a'); a.download=`event-map-${size}.png`; a.href=c.toDataURL('image/png'); a.click();
      });
    };

    // ---------- PDF Export (size + orientation + scale mode) ----------
    document.getElementById('exportPdfBtn').onclick=()=>{
      const { jsPDF } = window.jspdf;
      const size=document.getElementById('exportSize').value;
      let format='a4'; if(size==='a3') format='a3'; if(size==='a1') format='a1';
      const orientation=document.getElementById('exportOrientation').value;
      const scaleMode=document.getElementById('exportScaleMode').value; // 'ratio' | 'fit'

      const pdf=new jsPDF({orientation,unit:'mm',format});

      html2canvas(document.getElementById('mapWrap'), {
        useCORS:true,
        scale:2,
        backgroundColor:'#000'
      })
      .then(addWatermarkToCanvas)
      .then(c=>{
        const img=c.toDataURL('image/jpeg',1.0);
        const pageW=pdf.internal.pageSize.getWidth();
        const pageH=pdf.internal.pageSize.getHeight();

        let imgW, imgH, x, y;
        if(scaleMode==='fit'){
          imgW=pageW; imgH=pageH; x=0; y=0; // may distort
        }else{
          const ratio=Math.min(pageW/c.width, pageH/c.height);
          imgW=c.width*ratio; imgH=c.height*ratio;
          x=(pageW-imgW)/2; y=(pageH-imgH)/2;
        }

        pdf.addImage(img,'JPEG',x,y,imgW,imgH);
        pdf.save(`event-map-${format}-${orientation}-${scaleMode}.pdf`);
      });
    };

    // ---------- JSON Export / Import ----------
    document.getElementById('exportJsonBtn').onclick=()=>{
      const data = buildProjectJSON();
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `event-map-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    document.getElementById('importJsonBtn').onclick=()=>document.getElementById('importJsonFile').click();
    document.getElementById('importJsonFile').addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{
        try{
          const obj = JSON.parse(ev.target.result);
          restoreProjectJSON(obj);
        }catch(err){ alert('Invalid JSON'); }
      };
      r.readAsText(f);
    });

    function buildProjectJSON(){
      // Markers (emoji-only)
      const savedMarkers = markers.map(m=>{
        const ll = m.getLatLng();
        return { lat: ll.lat, lng: ll.lng, meta: m.myMeta }; // {label,icon,size}
      });

      // Polygons
      const savedPolys = polygons.map(p=>{
        const rings = p.getLatLngs();
        const latlngs = rings[0].map(ll=>[ll.lat,ll.lng]);
        const {color,weight,dashArray,fillOpacity}=p.options;
        return { latlngs, style:{color,weight,dashArray,fillOpacity} };
      });

      // Legend
      const savedLegend = Array.from(legendSet.entries()).map(([label,icon])=>({label,icon}));

      // Watermark
      const wrapRect=document.getElementById('mapWrap').getBoundingClientRect();
      const wmRect=wm.getBoundingClientRect();
      const hasImg = !!wmImg.src;
      const wmData = hasImg ? {
        src: wmImg.src,
        visible: wm.style.display !== 'none',
        left: (wmRect.left - wrapRect.left),
        top: (wmRect.top - wrapRect.top),
        width: wm.offsetWidth,
        opacity: parseFloat(wm.style.opacity || 1)
      } : null;

      return {
        version: 2,
        createdAt: new Date().toISOString(),
        view: { center: map.getCenter(), zoom: map.getZoom() },
        markers: savedMarkers,
        polygons: savedPolys,
        legend: savedLegend,
        watermark: wmData
      };
    }

    function restoreProjectJSON(data){
      // Clear
      markers.forEach(m=>map.removeLayer(m)); markers.length=0;
      polygons.forEach(p=>map.removeLayer(p)); polygons.length=0;
      tempLines.forEach(l=>map.removeLayer(l)); tempLines.length=0;
      legendSet.clear(); renderLegend();

      // View
      if(data.view && data.view.center && typeof data.view.zoom!=='undefined'){
        map.setView([data.view.center.lat, data.view.center.lng], data.view.zoom);
      } else {
        map.setView(SOFALA_CENTER, SOFALA_ZOOM);
      }

      // Legend
      if(Array.isArray(data.legend)){
        data.legend.forEach(item=>{ if(item && item.label && item.icon){ legendSet.set(item.label,item.icon); }});
        renderLegend();
      }

      // Markers
      if(Array.isArray(data.markers)){
        data.markers.forEach(m=>{
          const latlng = L.latLng(m.lat, m.lng);
          const meta = m.meta && m.meta.icon ? m.meta : {icon:'📍',label:'Marker',size:26};
          placeEmoji(latlng, meta);
        });
      }

      // Polygons
      if(Array.isArray(data.polygons)){
        data.polygons.forEach(p=>{
          const poly=L.polygon(p.latlngs, p.style || {color:'#ff0000',weight:2,dashArray:'6,4',fillOpacity:0.25}).addTo(map);
          poly.on('click',()=>selectPolygon(poly));
          polygons.push(poly);
        });
      }

      // Watermark
      if(data.watermark && data.watermark.src){
        wmImg.src = data.watermark.src;
        wm.style.display = data.watermark.visible ? 'block' : 'none';
        wmControls.style.display = data.watermark.visible ? 'flex' : 'none';
        wm.style.position='absolute';
        wm.style.left = (data.watermark.left||0)+'px';
        wm.style.top  = (data.watermark.top||0)+'px';
        wm.style.right='auto'; wm.style.bottom='auto';
        wm.style.width = (data.watermark.width||180)+'px';
        wm.style.opacity = (typeof data.watermark.opacity==='number'? data.watermark.opacity : 0.5);
      }
    }
  </script>
</body>
</html>
