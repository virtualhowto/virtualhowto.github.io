<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Map Builder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet + Esri-Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.11/dist/esri-leaflet.js"></script>

  <!-- Export libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root{--bg:#0e1116;--panel:#1a1f29;--ink:#e8eef7;--muted:#aab3c5;--accent:#4aa3ff;--border:#2a3342;}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
    header{background:#121722;border-bottom:1px solid var(--border);padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    header h1{font-size:16px;margin:0;font-weight:600;flex:0 0 auto}
    #topbar{display:flex;flex:1;flex-wrap:wrap;gap:6px;align-items:center}
    .btn{background:var(--panel);border:1px solid var(--border);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
    .btn.primary{background:var(--accent);color:#0a1524;border:none}
    #searchBox{background:#fff;color:#000;border:1px solid var(--border);border-radius:6px;padding:6px;font-size:14px;flex:1;min-width:160px}
    #toolbar{display:flex;overflow-x:auto;gap:8px;padding:6px;background:#1a1f29;border-bottom:1px solid var(--border)}
    .tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:1px dashed var(--border);border-radius:8px;cursor:pointer;background:var(--panel)}
    .tool .emoji{font-size:22px}
    .tool .lbl{font-size:11px;color:var(--muted);white-space:nowrap}

    #mapWrap{position:relative}
    #map{width:100%;height:calc(100vh - 240px)}
    .leaflet-tooltip.custom-label{background:rgba(18,23,34,.75);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:2px 6px;font-size:12px}

    #hint{position:fixed;bottom:6px;left:6px;right:6px;background:#0f141d;border:1px solid var(--border);padding:6px 10px;border-radius:10px;color:var(--muted);font-size:12px;z-index:1000;text-align:center}

    #polygonControls{position:fixed;bottom:70px;right:10px;display:none;flex-direction:column;gap:6px;z-index:1200}

    /* Legend with solid black background so it prints as seen */
    #legend{position:absolute;bottom:10px;left:10px;background:#000;border:1px solid var(--border);padding:8px;border-radius:10px;font-size:12px;z-index:800;color:#fff;max-width:200px}
    #legend h3{margin:0 0 6px 0;font-size:12px}
    #legend ul{margin:0;padding:0;list-style:none}
    #legend li{margin:2px 0}

    /* Watermark overlay (inside mapWrap so it exports) */
    #watermark{position:absolute;bottom:10px;right:10px;z-index:850;display:none;cursor:move;user-select:none}
    #watermark img{display:block;max-width:100%;max-height:100%}
    #wmControls{position:absolute;bottom:110%;right:0;background:#0f141d;border:1px solid var(--border);border-radius:8px;padding:8px;display:none;gap:6px;z-index:851;width:220px}
    #wmControls label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;margin:4px 0}
    #wmControls input[type="range"]{flex:1}

    /* Compass as a Leaflet control on the map */
    .compass-control{
      background:#0f141d;border:1px solid var(--border);border-radius:50%;
      width:40px;height:40px;display:flex;align-items:center;justify-content:center;
      font-size:20px;color:var(--ink)
    }
  </style>
</head>
<body>
  <header>
    <h1>Event Map Builder</h1>
    <div id="topbar">
      <input type="text" id="searchBox" placeholder="Search location..." />
      <button class="btn" id="modeToggle">✏️ Draw Mode</button>
      <input type="color" id="colorPicker" value="#ff0000" class="btn" />
      <button class="btn" id="finishPolygon">Finish</button>
      <button class="btn" id="cancelPolygon">Cancel</button>
      <label style="display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;">
        <input type="checkbox" id="defaultFill" checked /> Fill new polygon
      </label>
      <select id="exportSize" class="btn">
        <option value="a4">A4</option>
        <option value="a3">A3</option>
        <option value="a1">A1</option>
      </select>
      <input type="file" id="logoFile" accept="image/*" style="display:none"/>
      <button class="btn" id="logoBtn">Upload Logo</button>
      <button class="btn" id="toggleWmPanel">WM Controls</button>
      <button class="btn" id="exportBtn">Export PNG</button>
      <button class="btn primary" id="exportPdfBtn">Export PDF</button>
    </div>
  </header>

  <div id="toolbar">
    <div class="tool" data-label="Stage" data-icon="🎤"><span class="emoji">🎤</span><span class="lbl">Stage</span></div>
    <div class="tool" data-label="Toilets" data-icon="🚻"><span class="emoji">🚻</span><span class="lbl">Toilets</span></div>
    <div class="tool" data-label="Parking" data-icon="🅿️"><span class="emoji">🅿️</span><span class="lbl">Parking</span></div>
    <div class="tool" data-label="First Aid" data-icon="⛑️"><span class="emoji">⛑️</span><span class="lbl">First Aid</span></div>
    <div class="tool" data-label="Camping" data-icon="⛺"><span class="emoji">⛺</span><span class="lbl">Camping</span></div>
    <div class="tool" data-label="Competition Detecting" data-icon="🏆🔎"><span class="emoji">🏆🔎</span><span class="lbl">Competition</span></div>
    <div class="tool" data-label="Free Detecting" data-icon="🆓🔎"><span class="emoji">🆓🔎</span><span class="lbl">Free Detecting</span></div>
    <div class="tool" data-label="Sign-in Desk" data-icon="🛎️"><span class="emoji">🛎️</span><span class="lbl">Sign-in Desk</span></div>
    <div class="tool" data-label="Entry Gate" data-icon="⛩️"><span class="emoji">⛩️</span><span class="lbl">Entry Gate</span></div>
    <div class="tool" data-label="Food Area" data-icon="🍽️"><span class="emoji">🍽️</span><span class="lbl">Food Area</span></div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>

    <!-- Legend inside the map so exports match the view -->
    <div id="legend"><h3>Legend</h3><ul id="legendList"></ul></div>

    <!-- Watermark with controls -->
    <div id="watermark">
      <img id="watermarkImg" alt="watermark"/>
      <div id="wmControls">
        <label>Opacity <input id="wmOpacity" type="range" min="0.05" max="1" step="0.05" value="0.5"></label>
        <label>Size (px) <input id="wmSize" type="range" min="60" max="500" step="10" value="150"></label>
        <div style="display:flex;gap:6px;justify-content:flex-end;">
          <button class="btn" id="wmHide">Hide</button>
        </div>
      </div>
    </div>
  </div>

  <div id="hint">💡 Search • Drag/click emoji labels (no pins) • Draw polygons/lines • Toggle fill/delete • Watermark controls • Export PNG/PDF</div>

  <div id="polygonControls" class="leaflet-top leaflet-right">
    <button id="toggleFill" class="btn">Toggle Fill</button>
    <button id="deletePoly" class="btn">Delete</button>
  </div>

  <script>
    // --- Map ---
    const map = L.map('map').setView([-32.77,149.67],15);
    L.esri.tiledMapLayer({
      url:'https://maps.six.nsw.gov.au/arcgis/rest/services/public/NSW_Imagery/MapServer',
      attribution:'Imagery © NSW Spatial Services'
    }).addTo(map);

    // Compass as a Leaflet control (on the map)
    const compassControl = L.control({position: 'topright'});
    compassControl.onAdd = () => {
      const div = L.DomUtil.create('div', 'compass-control'); div.innerHTML = '🧭'; return div;
    };
    compassControl.addTo(map);

    // --- Search (OSM Nominatim) ---
    const searchBox=document.getElementById('searchBox');
    searchBox.addEventListener('keydown',async e=>{
      if(e.key!=="Enter") return;
      const q=searchBox.value.trim(); if(!q) return;
      try{
        const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
        const data=await res.json();
        if(data && data.length){ map.setView([+data[0].lat, +data[0].lon], 15); }
        else alert("Location not found");
      }catch{ alert("Search error"); }
    });

    // --- State ---
    let drawMode=false, tempPoints=[], tempLines=[], polygons=[], selected=null, selectedLine=null, activeTool=null;
    const legendSet=new Map();

    // --- Emoji tools (drag + click) ---
    document.querySelectorAll('.tool').forEach(t=>{
      t.addEventListener('dragstart',()=>{activeTool=t;});
      t.addEventListener('click',()=>{ activeTool=t; });
    });
    map.getContainer().addEventListener('dragover',e=>e.preventDefault());
    map.getContainer().addEventListener('drop',e=>{
      e.preventDefault(); if(!activeTool||drawMode) return;
      placeEmoji(map.containerPointToLatLng([e.offsetX,e.offsetY]));
    });
    map.on('click',e=>{
      if(activeTool && !drawMode){ placeEmoji(e.latlng); activeTool=null; return; }
      if(!drawMode) return;
      tempPoints.push([e.latlng.lat,e.latlng.lng]);
      if(tempPoints.length>1){
        const line=L.polyline([tempPoints.at(-2),tempPoints.at(-1)],{
          color:document.getElementById('colorPicker').value,dashArray:"4,4",weight:2
        }).addTo(map);
        line.on('click',()=>selectLine(line));
        tempLines.push(line);
      }
    });

    function placeEmoji(latlng){
      const html = `<div contenteditable="true" style="font-size:20px;cursor:move;">${activeTool.dataset.icon} ${activeTool.dataset.label}</div>`;
      L.marker(latlng,{
        icon: L.divIcon({className:"custom-div-icon",html,iconSize:[30,30],iconAnchor:[15,15]}),
        draggable:true
      }).addTo(map);
      legendSet.set(activeTool.dataset.label,activeTool.dataset.icon);
      renderLegend();
    }

    function renderLegend(){
      const list = document.getElementById('legendList'); list.innerHTML='';
      legendSet.forEach((icon,label)=>{ const li=document.createElement('li'); li.textContent=`${icon} ${label}`; list.appendChild(li); });
    }

    // --- Drawing polygons ---
    document.getElementById('modeToggle').onclick=()=>{
      drawMode=!drawMode;
      document.getElementById('modeToggle').textContent=drawMode?'🖱️ Label Mode':'✏️ Draw Mode';
    };
    document.getElementById('finishPolygon').onclick=()=>{
      if(tempPoints.length>2){
        const poly=L.polygon(tempPoints,{
          color:document.getElementById('colorPicker').value,weight:2,dashArray:"6,4",
          fillOpacity: document.getElementById('defaultFill').checked ? 0.25 : 0
        }).addTo(map);
        poly.on('click',()=>selectPolygon(poly));
        polygons.push(poly);
      }
      clearSketch();
    };
    document.getElementById('cancelPolygon').onclick=()=>clearSketch();

    function clearSketch(){ tempPoints=[]; tempLines.forEach(l=>map.removeLayer(l)); tempLines=[]; }

    function selectPolygon(poly){ selected=poly; selectedLine=null; document.getElementById('polygonControls').style.display='flex'; }
    function selectLine(line){ if(selectedLine) selectedLine.setStyle({weight:2}); selectedLine=line; selected=null; line.setStyle({weight:4}); document.getElementById('polygonControls').style.display='none'; }

    document.getElementById('toggleFill').onclick=()=>{
      if(!selected) return; selected.setStyle({fillOpacity: selected.options.fillOpacity>0 ? 0 : 0.25});
    };
    document.getElementById('deletePoly').onclick=()=>deleteSelected();
    document.addEventListener('keydown',e=>{ if(e.key==="Delete") deleteSelected(); });
    function deleteSelected(){
      if(selected){ map.removeLayer(selected); polygons=polygons.filter(p=>p!==selected); selected=null; document.getElementById('polygonControls').style.display='none'; }
      if(selectedLine){ map.removeLayer(selectedLine); tempLines=tempLines.filter(l=>l!==selectedLine); selectedLine=null; }
    }

    // --- Watermark upload/drag/size/opacity ---
    const wm = document.getElementById('watermark');
    const wmImg = document.getElementById('watermarkImg');
    const wmControls = document.getElementById('wmControls');
    const wmOpacity = document.getElementById('wmOpacity');
    const wmSize = document.getElementById('wmSize');

    document.getElementById('logoBtn').onclick=()=>document.getElementById('logoFile').click();
    document.getElementById('logoFile').addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{ wmImg.src=ev.target.result; wm.style.display='block'; wmControls.style.display='flex'; wm.style.width=wmSize.value+'px'; wm.style.opacity=wmOpacity.value; };
      r.readAsDataURL(f);
    });
    document.getElementById('toggleWmPanel').onclick=()=>{ wmControls.style.display = (wmControls.style.display==='flex'?'none':'flex'); };
    wmOpacity.oninput=()=>{ wm.style.opacity = wmOpacity.value; };
    wmSize.oninput=()=>{ wm.style.width = wmSize.value+'px'; };
    document.getElementById('wmHide').onclick=()=>{ wm.style.display='none'; wmControls.style.display='none'; };

    // Drag watermark (mouse + touch)
    let dragging=false, startX=0, startY=0, startLeft=0, startTop=0;
    const onDown = (x,y)=>{ dragging=true; const r=wm.getBoundingClientRect(); startX=x; startY=y; startLeft=r.left; startTop=r.top; map.dragging.disable(); };
    const onMove = (x,y)=>{ if(!dragging) return;
      const dx=x-startX, dy=y-startY; const wrapRect=document.getElementById('mapWrap').getBoundingClientRect();
      wm.style.left=(startLeft+dx-wrapRect.left)+'px'; wm.style.top=(startTop+dy-wrapRect.top)+'px';
      wm.style.right='auto'; wm.style.bottom='auto'; wm.style.position='absolute';
    };
    const onUp = ()=>{ dragging=false; map.dragging.enable(); };

    wm.addEventListener('mousedown', e=>{ onDown(e.clientX,e.clientY); e.preventDefault(); });
    window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
    window.addEventListener('mouseup', onUp);

    wm.addEventListener('touchstart', e=>{ const t=e.touches[0]; onDown(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
    window.addEventListener('touchmove', e=>{ if(!dragging) return; const t=e.touches[0]; onMove(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
    window.addEventListener('touchend', onUp);

    // Helper: draw watermark into any canvas (safeguard)
    function addWatermarkToCanvas(c){
      return new Promise(resolve=>{
        if(!wmImg.src || wm.style.display==='none') return resolve(c);
        const ctx=c.getContext('2d');
        const wrapRect=document.getElementById('mapWrap').getBoundingClientRect();
        const wmRect=wm.getBoundingClientRect();
        const scaleX=c.width/wrapRect.width, scaleY=c.height/wrapRect.height;
        const left=(wmRect.left-wrapRect.left)*scaleX;
        const top =(wmRect.top -wrapRect.top )*scaleY;
        const w=wmRect.width*scaleX, h=wmRect.height*scaleY;
        ctx.globalAlpha=parseFloat(wmOpacity.value); ctx.drawImage(wmImg,left,top,w,h); ctx.globalAlpha=1;
        resolve(c);
      });
    }

    // --- PNG Export (whole page) ---
    document.getElementById('exportBtn').onclick=()=>{
      const size=document.getElementById('exportSize').value;
      let scale=2; if(size==='a4') scale=2.5; if(size==='a3') scale=3.5; if(size==='a1') scale=7;
      html2canvas(document.body,{useCORS:true,scale}).then(addWatermarkToCanvas).then(c=>{
        const a=document.createElement('a'); a.download=`event-map-${size}.png`; a.href=c.toDataURL('image/png'); a.click();
      });
    };

    // --- PDF Export (capture the full map wrapper so legend & overlays match the view) ---
    document.getElementById('exportPdfBtn').onclick=()=>{
      const { jsPDF } = window.jspdf;
      const size=document.getElementById('exportSize').value;
      let format='a4'; if(size==='a3') format='a3'; if(size==='a1') format='a1';
      const pdf=new jsPDF({orientation:'portrait',unit:'mm',format});

      html2canvas(document.getElementById('mapWrap'), {
        useCORS:true,
        scale:2,
        backgroundColor:'#000' // ensures any transparent areas render as black
      })
      .then(addWatermarkToCanvas)
      .then(c=>{
        const img=c.toDataURL('image/jpeg',1.0);
        const pageW=pdf.internal.pageSize.getWidth();
        const pageH=pdf.internal.pageSize.getHeight();
        pdf.addImage(img,'JPEG',0,0,pageW,pageH);
        pdf.save(`event-map-${format}.pdf`);
      });
    };
  </script>
</body>
</html>
