<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Map Builder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet + Esri-Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.11/dist/esri-leaflet.js"></script>

  <!-- Export libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root{--bg:#0e1116;--panel:#1a1f29;--ink:#e8eef7;--muted:#aab3c5;--accent:#4aa3ff;--border:#2a3342;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
    header{background:#121722;border-bottom:1px solid var(--border);padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    header h1{font-size:16px;margin:0;font-weight:600}
    #topbar{display:flex;flex:1;flex-wrap:wrap;gap:8px;align-items:center}
    .btn{background:var(--panel);border:1px solid var(--border);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
    .btn.primary{background:var(--accent);color:#0a1524;border:none}
    #searchBox{background:#fff;color:#000;border:1px solid var(--border);border-radius:6px;padding:6px;font-size:14px;flex:1;min-width:170px}
    .dropdown{position:relative;display:inline-block}
    .dropdown-menu{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:#1a1f29;border:1px solid var(--border);border-radius:10px;min-width:180px;z-index:3000;box-shadow:0 10px 25px rgba(0,0,0,.4)}
    .dropdown-menu button{width:100%;text-align:left;padding:10px 12px;background:none;border:none;color:var(--ink);cursor:pointer;font-size:14px}
    .dropdown-menu button:hover{background:#0f141d}
    #toolbar{display:flex;overflow-x:auto;gap:8px;padding:6px;background:#1a1f29;border-bottom:1px solid var(--border)}
    .tool{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:6px 8px;border:1px dashed var(--border);border-radius:8px;cursor:pointer;background:var(--panel)}
    .tool .emoji{font-size:22px}
    #mapWrap{position:relative;flex:1}
    #map{width:100%;height:100%}
    #legend{position:absolute;bottom:10px;left:10px;background:#000;border:1px solid var(--border);padding:8px;border-radius:10px;font-size:12px;z-index:800;color:#fff;max-width:220px}
    #legend h3{margin:0 0 6px 0;font-size:12px}
    #legend ul{margin:0;padding:0;list-style:none}
    #legend li{margin:2px 0}
    #polygonControls{position:fixed;bottom:70px;right:10px;display:none;flex-direction:column;gap:6px;z-index:1200}
    #watermark{position:absolute;bottom:10px;right:10px;z-index:850;display:none;cursor:move;user-select:none}
    #watermark img{display:block;max-width:100%;max-height:100%}
    #wmControls{position:absolute;bottom:110%;right:0;background:#0f141d;border:1px solid var(--border);border-radius:8px;padding:8px;display:none;gap:6px;z-index:851;width:240px}
    #wmControls label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;margin:4px 0}
    #wmControls input[type="range"]{flex:1}
    .compass-control{width:80px;height:80px}
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3500}
    .modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1f29;border:1px solid var(--border);border-radius:12px;padding:18px;z-index:3600;width:min(90vw,360px)}
    .modal h3{margin:0 0 10px 0;color:#fff;font-size:16px}
    .modal label{display:block;margin:10px 0;color:var(--muted);font-size:13px}
    .modal select{width:100%;padding:8px;border-radius:8px;background:#0b0f16;color:#fff;border:1px solid var(--border)}
    .modal .actions{margin-top:16px;display:flex;gap:8px;justify-content:flex-end}
  </style>
</head>
<body>
  <header>
    <h1>Event Map Builder</h1>
    <div id="topbar">
      <button class="btn" id="gpsBtn">📍 Use GPS</button>
      <button class="btn" id="modeToggle">✏️ Draw Mode</button>
      <input type="color" id="colorPicker" value="#ff0000" class="btn" />
      <button class="btn" id="finishPolygon">Finish</button>
      <button class="btn" id="cancelPolygon">Cancel</button>
      <label style="display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;">
        <input type="checkbox" id="defaultFill" checked /> Fill new polygon
      </label>
      <div class="dropdown">
        <button class="btn" id="exportMenuBtn">📤 Export ▼</button>
        <div class="dropdown-menu" id="exportMenu">
          <button id="menuPng">Export PNG</button>
          <button id="menuPdf">Export PDF…</button>
          <button id="menuJsonExport">Export JSON</button>
          <button id="menuJsonImport">Import JSON</button>
        </div>
      </div>
      <input type="file" id="importJsonFile" accept="application/json" style="display:none"/>
      <input type="file" id="logoFile" accept="image/*" style="display:none"/>
      <button class="btn" id="logoBtn">Upload Logo</button>
    </div>
  </header>

  <div id="toolbar">
    <div class="tool" data-label="Stage" data-icon="🎤"><span class="emoji">🎤</span></div>
    <div class="tool" data-label="Toilets" data-icon="🚻"><span class="emoji">🚻</span></div>
    <div class="tool" data-label="Parking" data-icon="🅿️"><span class="emoji">🅿️</span></div>
    <div class="tool" data-label="First Aid" data-icon="⛑️"><span class="emoji">⛑️</span></div>
    <div class="tool" data-label="Camping" data-icon="⛺"><span class="emoji">⛺</span></div>
    <div class="tool" data-label="Competition Detecting" data-icon="🏆"><span class="emoji">🏆</span></div>
    <div class="tool" data-label="Free Detecting" data-icon="🆓"><span class="emoji">🆓</span></div>
    <div class="tool" data-label="Sign-in Desk" data-icon="🛎️"><span class="emoji">🛎️</span></div>
    <div class="tool" data-label="Entry Gate" data-icon="⛩️"><span class="emoji">⛩️</span></div>
    <div class="tool" data-label="Food Area" data-icon="🍽️"><span class="emoji">🍽️</span></div>
    <div class="tool" data-label="Text Label" data-icon="✏️"><span class="emoji">✏️</span></div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>
    <div id="legend"><h3>Legend</h3><ul id="legendList"></ul></div>
    <div id="watermark">
      <img id="watermarkImg" alt="watermark"/>
      <div id="wmControls">
        <label>Opacity <input id="wmOpacity" type="range" min="0.05" max="1" step="0.05" value="0.5"></label>
        <label>Size (px) <input id="wmSize" type="range" min="60" max="800" step="10" value="180"></label>
        <button class="btn" id="wmDelete">Delete Watermark</button>
      </div>
    </div>
  </div>

  <div id="polygonControls" class="leaflet-top leaflet-right">
    <button id="toggleFill" class="btn">Toggle Fill</button>
    <button id="deletePoly" class="btn">Delete</button>
  </div>

  <script>
    /* Init Map */
    const map=L.map('map',{attributionControl:false}).setView([-33.1,149.7],15);
    L.esri.tiledMapLayer({url:'https://maps.six.nsw.gov.au/arcgis/rest/services/public/NSW_Imagery/MapServer'}).addTo(map);

    /* GPS */
    document.getElementById('gpsBtn').onclick=()=>{
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(p=>{
          map.setView([p.coords.latitude,p.coords.longitude],17);
        },()=>{map.setView([-33.1,149.7],15)});
      } else map.setView([-33.1,149.7],15);
    };

    /* Compass */
    const compassControl=L.control({position:'topright'});
    compassControl.onAdd=()=>{const d=L.DomUtil.create('div','compass-control');d.innerHTML=`<div style="position:relative;width:80px;height:80px;border-radius:50%;background:#0f141d;border:2px solid #4aa3ff;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)"><span style="position:absolute;top:2px;left:50%;transform:translateX(-50%);font-weight:bold;color:#ff4444">N</span><span style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%)">S</span><span style="position:absolute;left:2px;top:50%;transform:translateY(-50%)">W</span><span style="position:absolute;right:2px;top:50%;transform:translateY(-50%)">E</span></div>`;return d};compassControl.addTo(map);

    /* Watermark */
    const wm=document.getElementById('watermark'),wmImg=document.getElementById('watermarkImg'),wmControls=document.getElementById('wmControls');
    document.getElementById('logoBtn').onclick=()=>document.getElementById('logoFile').click();
    document.getElementById('logoFile').addEventListener('change',e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{wmImg.src=ev.target.result;wm.style.display='block';wmControls.style.display='flex';wm.style.width=document.getElementById('wmSize').value+'px';wm.style.opacity=document.getElementById('wmOpacity').value};
      r.readAsDataURL(f);
    });
    document.getElementById('wmOpacity').oninput=()=>{wm.style.opacity=document.getElementById('wmOpacity').value;hideWmControlsSoon()};
    document.getElementById('wmSize').oninput=()=>{wm.style.width=document.getElementById('wmSize').value+'px';hideWmControlsSoon()};
    wm.onclick=()=>{wmControls.style.display='flex'};
    document.getElementById('wmDelete').onclick=()=>{wm.style.display='none';wmControls.style.display='none'};
    function hideWmControlsSoon(){clearTimeout(wm._t);wm._t=setTimeout(()=>{wmControls.style.display='none'},1200)}

    /* === Markers === */
    const legendList=document.getElementById('legendList');
    const legendItems=new Set();
    function addLegend(label,icon){
      if(!legendItems.has(label)){
        legendItems.add(label);
        const li=document.createElement('li');li.textContent=`${icon} ${label}`;
        legendList.appendChild(li);
      }
    }
    document.querySelectorAll('.tool').forEach(t=>{
      t.onclick=()=>{
        const icon=t.dataset.icon,label=t.dataset.label;
        if(label==="Text Label"){ // prompt text
          map.once('click',e=>{
            const txt=prompt("Enter label text:");if(!txt)return;
            const m=L.marker(e.latlng,{draggable:true}).addTo(map).bindTooltip(txt,{permanent:true});
            m.on('click',()=>{map.removeLayer(m)});
          });
        } else {
          map.once('click',e=>{
            const m=L.marker(e.latlng,{draggable:true}).addTo(map).bindTooltip(label,{permanent:true});
            m._icon.textContent=icon;
            addLegend(label,icon);
            m.on('click',()=>{map.removeLayer(m)});
          });
        }
      };
    });

    /* === Polygons === */
    let drawing=false,polyPoints=[],polyLayer,selectedPoly=null;
    document.getElementById('modeToggle').onclick=()=>{drawing=!drawing;};
    map.on('click',e=>{
      if(drawing){
        polyPoints.push(e.latlng);
        if(polyLayer)map.removeLayer(polyLayer);
        polyLayer=L.polygon(polyPoints,{color:document.getElementById('colorPicker').value,fillOpacity:document.getElementById('defaultFill').checked?0.4:0}).addTo(map);
      }
    });
    document.getElementById('finishPolygon').onclick=()=>{drawing=false;polyPoints=[];polyLayer=null;};
    document.getElementById('cancelPolygon').onclick=()=>{if(polyLayer)map.removeLayer(polyLayer);drawing=false;polyPoints=[];polyLayer=null;};
    map.on('click',e=>{
      map.eachLayer(l=>{
        if(l instanceof L.Polygon && l.getBounds().contains(e.latlng)){
          selectedPoly=l;document.getElementById('polygonControls').style.display='flex';
        }
      });
    });
    document.getElementById('toggleFill').onclick=()=>{if(selectedPoly){const o=selectedPoly.options;selectedPoly.setStyle({fillOpacity:o.fillOpacity>0?0:0.4})}};
    document.getElementById('deletePoly').onclick=()=>{if(selectedPoly){map.removeLayer(selectedPoly);selectedPoly=null;document.getElementById('polygonControls').style.display='none'}};

    /* === Export PNG/PDF === */
    function captureMapCanvas(){
      return html2canvas(document.getElementById('mapWrap'),{useCORS:true,scale:2,backgroundColor:'#000',foreignObjectRendering:true});
    }
    document.getElementById('menuPng').onclick=()=>{captureMapCanvas().then(c=>{const a=document.createElement('a');a.download='event-map.png';a.href=c.toDataURL('image/png');a.click();});};
    document.getElementById('menuPdf').onclick=()=>{captureMapCanvas().then(c=>{const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});pdf.addImage(c.toDataURL('image/jpeg',1.0),'JPEG',0,0,297,210);pdf.save('event-map.pdf');});};

    /* === JSON Export/Import === */
    document.getElementById('menuJsonExport').onclick=()=>{
      const data=[];map.eachLayer(l=>{
        if(l instanceof L.Marker)data.push({type:'marker',latlng:l.getLatLng(),tooltip:l.getTooltip()?l.getTooltip().getContent():null,icon:l._icon.textContent});
        if(l instanceof L.Polygon)data.push({type:'polygon',latlngs:l.getLatLngs(),options:l.options});
      });
      const a=document.createElement('a');a.download='event-map.json';a.href='data:application/json,'+encodeURIComponent(JSON.stringify(data));a.click();
    };
    document.getElementById('menuJsonImport').onclick=()=>document.getElementById('importJsonFile').click();
    document.getElementById('importJsonFile').addEventListener('change',e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();r.onload=ev=>{
        const arr=JSON.parse(ev.target.result);
        arr.forEach(o=>{
          if(o.type==='marker'){const m=L.marker(o.latlng,{draggable:true}).addTo(map).bindTooltip(o.tooltip,{permanent:true});m._icon.textContent=o.icon;m.on('click',()=>map.removeLayer(m));}
          if(o.type==='polygon'){L.polygon(o.latlngs,o.options).addTo(map);}
        });
      };r.readAsText(f);
    });
  </script>
</body>
</html>
