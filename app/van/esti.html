<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campervan Auto Pricing + ROI (AU)</title>

<style>
body {
  background:#020617;
  color:#e5e7eb;
  font-family:system-ui, sans-serif;
  margin:0;
  padding:16px;
}
.container {
  max-width:900px;
  margin:auto;
}
.card {
  background:#0f172a;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}
label {
  display:block;
  font-size:.8rem;
  color:#94a3b8;
  margin-top:10px;
}
input {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#020617;
  color:#e5e7eb;
}
.result {
  display:flex;
  justify-content:space-between;
  padding:8px;
  background:#020617;
  border-radius:8px;
  margin-top:6px;
}
strong { color:#38bdf8; }
</style>
</head>

<body>
<div class="container">

<h2>Campervan Investment – Auto Nightly Rate</h2>

<div class="card">
<h3>Marketplace Input</h3>

<label>Facebook Marketplace URL (paste)</label>
<input id="fbUrl" placeholder="https://www.facebook.com/marketplace/item/..." />

<label>Listing Title (optional but recommended)</label>
<input id="title" placeholder="2011 Jayco Swan Camper Trailer" />

<label>
  <input type="checkbox" id="autoRate" checked>
  Auto-calculate nightly rate
</label>
</div>

<div class="card">
<h3>Detected Details</h3>

<div class="result">
  <span>Detected Year</span>
  <strong id="yearOut">–</strong>
</div>
<div class="result">
  <span>Detected Model</span>
  <strong id="modelOut">–</strong>
</div>
<div class="result">
  <span>Suggested Nightly Rate</span>
  <strong id="rateOut">$0</strong>
</div>
</div>

<div class="card">
<h3>Manual Override</h3>
<label>Nightly Rate ($)</label>
<input id="rate" type="number" value="120" />
</div>

</div>

<script>
// --- Extract year from text or URL ---
function extractYear(text) {
  const match = text.match(/(19|20)\d{2}/);
  return match ? parseInt(match[0]) : null;
}

// --- Extract model keywords ---
function extractModel(text) {
  const knownModels = [
    "jayco swan",
    "jayco",
    "swan",
    "hiace",
    "sprinter",
    "transit",
    "motorhome",
    "camper",
    "pop top",
    "pop-top"
  ];
  text = text.toLowerCase();
  for (let m of knownModels) {
    if (text.includes(m)) return m;
  }
  return "generic camper";
}

// --- Auto nightly rate logic ---
function calculateRate(year, model) {
  const currentYear = new Date().getFullYear();
  const age = year ? currentYear - year : 15;

  let base = 80;
  if (age <= 5) base = 190;
  else if (age <= 10) base = 150;
  else if (age <= 15) base = 120;
  else if (age <= 20) base = 95;

  let multiplier = 1.0;
  if (model.includes("motorhome")) multiplier = 1.15;
  else if (model.includes("pop")) multiplier = 1.05;
  else if (model.includes("swan")) multiplier = 1.05;

  return Math.round(base * multiplier / 5) * 5;
}

// --- Main update ---
function update() {
  const url = document.getElementById("fbUrl").value;
  const title = document.getElementById("title").value;

  const combined = `${url} ${title}`;

  const year = extractYear(combined);
  const model = extractModel(combined);

  document.getElementById("yearOut").textContent = year ?? "Unknown";
  document.getElementById("modelOut").textContent = model;

  if (document.getElementById("autoRate").checked) {
    const rate = calculateRate(year, model);
    document.getElementById("rate").value = rate;
    document.getElementById("rateOut").textContent = `$${rate}`;
  } else {
    document.getElementById("rateOut").textContent =
      `$${document.getElementById("rate").value}`;
  }
}

["fbUrl","title","rate","autoRate"].forEach(id =>
  document.getElementById(id).addEventListener("input", update)
);

update();
</script>

</body>
</html>
