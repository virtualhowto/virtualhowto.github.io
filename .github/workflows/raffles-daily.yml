name: Refresh raffles and specials

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Refresh venue data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
        run: python raffles/tools/update_data.py
      - name: Commit changes
        run: |
          git config user.name "raffles-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raffles/data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily raffles and specials refresh"
            git push
          fi
