<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMaaS - Virtual Machine as a Service</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.2/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #ffffff; }
        .container { width: 90%; max-width: 1200px; margin: auto; overflow: hidden; padding: 20px; }
        header { background: #1c3f94; color: #fff; padding: 20px 0; text-align: center; }
        .hero { text-align: center; padding: 50px; background: #2d4fad; color: white; }
        .hero h1 { margin: 0; font-size: 2.5em; }
        .pricing { text-align: center; padding: 40px; background: white; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); border-radius: 10px; }
        .pricing h2 { margin-bottom: 20px; color: #1c3f94; }
        .pricing form { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .pricing label { font-weight: bold; color: #1c3f94; }
        .pricing input, .pricing select, .pricing input[type='range'] { padding: 12px; width: 100%; max-width: 400px; border: 1px solid #ccc; border-radius: 5px; }
        .pricing button { padding: 12px 20px; background: #e31837; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .pricing button:hover { background: #c2172f; }
        .result-container { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; }
        .compute-type { margin-top: 15px; font-size: 1em; font-weight: bold; color: #1c3f94; }
        .firewall-options { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
        .vm-list-container { width: 100%; max-width: 400px; background: #f0f2f5; padding: 10px; border-radius: 5px; box-shadow: 0px 0px 5px rgba(0,0,0,0.1); }
        .vm-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        .vm-list li { display: flex; align-items: center; padding: 5px; border-bottom: 1px solid #ddd; }
        .vm-list input { margin-right: 10px; }
        .cart { position: fixed; right: 20px; top: 100px; width: 300px; background: white; padding: 20px; box-shadow: 0px 0px 10px rgba(0,0,0,0.2); border-radius: 10px; }
        .cart h3 { margin-top: 0; color: #1c3f94; }
    </style>
</head>
<body>
    <header>
        <h1>Virtual Machine as a Service (VMaaS)</h1>
    </header>
    <section class="hero">
        <h1>Scalable, Secure, and Reliable Cloud VMs</h1>
        <p>Deploy your virtual machines in minutes with flexible pricing and high performance.</p>
    </section>
    <div class="container">
        <section class="pricing">
            <h2>VM Pricing Calculator</h2>
            <input type="file" id="fileUpload" accept=".xlsx">
            <div class="vm-list-container">
                <h3>Select Virtual Machines:</h3>
                <ul id="vm-list" class="vm-list"></ul>
            </div>
            <form id='pricing-form'>
                <label for='cpu'>vCPU:</label>
                <input type='number' id='cpu' min='1' required>
                <label for='ram'>RAM (GB):</label>
                <input type='number' id='ram' min='1' required>
                <label for='storage'>Storage (GB):</label>
                <input type='number' id='storage' min='10' required>
                <label for='bandwidth'>Bandwidth (Mbps): <span id="bandwidth-value">100</span></label>
                <input type='range' id='bandwidth' min='100' max='1000' step='100' value='100'>
                
                <label for='firewall'>Include Firewall?</label>
                <select id='firewall'>
                    <option value="none">No</option>
                    <option value="hosting">Hosting Platform Firewall</option>
                    <option value="aggregated">Aggregated SD-WAN/MPLS Firewall</option>
                </select>
                
                <button type='button' onclick='addToCart()'>Add to Cart</button>
            </form>
            <div class="result-container" id='result'></div>
            <div class="compute-type" id='compute-type'></div>
        </section>
    </div>
    <div class="cart" id="cart">
        <h3>Summary</h3>
        <ul id="cart-list"></ul>
        <p><strong>Total Cost:</strong> <span id="cart-total">$0.00</span></p>
    </div>
    <footer>
        <p>&copy; 2025 VMaaS - All Rights Reserved</p>
    </footer>

    <script>
        document.getElementById("bandwidth").addEventListener("input", function() {
            document.getElementById("bandwidth-value").textContent = this.value;
        });
    </script>
</body>
</html>
