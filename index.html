<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMaaS - Virtual Machine as a Service</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .container { width: 90%; max-width: 1200px; margin: auto; overflow: hidden; padding: 20px; }
        header { background: #333; color: #fff; padding: 20px 0; text-align: center; }
        .hero { text-align: center; padding: 50px; background: #007bff; color: white; }
        .hero h1 { margin: 0; font-size: 2.5em; }
        .pricing { text-align: center; padding: 40px; background: white; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); border-radius: 10px; }
        .pricing h2 { margin-bottom: 20px; }
        .pricing form { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .pricing label { font-weight: bold; }
        .pricing input { padding: 12px; width: 80%; max-width: 300px; border: 1px solid #ccc; border-radius: 5px; }
        .pricing button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .pricing button:hover { background: #0056b3; }
        .result-container { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; }
        .compute-type { margin-top: 15px; font-size: 1em; font-weight: bold; color: #007bff; }
        footer { background: #333; color: white; text-align: center; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Virtual Machine as a Service (VMaaS)</h1>
    </header>
    <section class="hero">
        <h1>Scalable, Secure, and Reliable Cloud VMs</h1>
        <p>Deploy your virtual machines in minutes with flexible pricing and high performance.</p>
    </section>
    <div class="container">
        <section class="pricing">
            <h2>VM Pricing Calculator</h2>
            <form id='pricing-form'>
                <label for='cpu'>vCPU:</label>
                <input type='number' id='cpu' min='1' required>
                <label for='ram'>RAM (GB):</label>
                <input type='number' id='ram' min='1' required>
                <label for='storage'>Storage (GB):</label>
                <input type='number' id='storage' min='10' required>
                <label for='bandwidth'>Bandwidth (Mbps):</label>
                <input type='number' id='bandwidth' min='1' required>
                <button type='submit'>Calculate</button>
            </form>
            <div class="result-container" id='result'></div>
            <div class="compute-type" id='compute-type'></div>
        </section>
    </div>
    <footer>
        <p>&copy; 2025 VMaaS - All Rights Reserved</p>
    </footer>

    <script>
        async function fetchPricing() {
            const response = await fetch('pricing.json');
            return response.json();
        }
        
        document.addEventListener("DOMContentLoaded", async function () {
            const pricingData = await fetchPricing();
            const form = document.getElementById("pricing-form");
            const result = document.getElementById("result");
            const computeType = document.getElementById("compute-type");
            
            form.addEventListener("input", function () {
                const cpu = parseInt(document.getElementById("cpu").value) || 0;
                const ram = parseInt(document.getElementById("ram").value) || 0;
                const storage = parseInt(document.getElementById("storage").value) || 0;
                const bandwidth = parseInt(document.getElementById("bandwidth").value) || 0;

                const cpuCost = cpu * pricingData.cpu;
                const ramCost = ram * pricingData.ram;
                const storageCost = storage * pricingData.storage;
                const bandwidthCost = bandwidth * pricingData.bandwidth_mbps;

                const totalCost = cpuCost + ramCost + storageCost + bandwidthCost;
                result.innerHTML = `Estimated Monthly Cost: $${totalCost.toFixed(2)}`;
                
                // Determine Compute Type
                let computeCategory = "";
                if (ram / cpu >= 16) {
                    computeCategory = "Memory-Optimized: Ideal for databases, caching, and in-memory computing.";
                } else if (ram / cpu >= 8) {
                    computeCategory = "Balanced: Suitable for general-purpose applications and business workloads.";
                } else if (ram / cpu >= 4) {
                    computeCategory = "Compute-Optimized: Ideal for CPU-intensive tasks.";
                } else {
                    computeCategory = "High-Performance Compute: Workloads requiring heavy CPU cycles.";
                }
                computeType.innerHTML = computeCategory;
            });
        });
    </script>
</body>
</html>
