<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMaaS - Virtual Machine as a Service</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.2/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background: #ffffff; }
        .container { width: 90%; max-width: 1200px; margin: auto; overflow: hidden; padding: 20px; }
        header { background: linear-gradient(90deg, #1c3f94, #cc5500); color: #fff; padding: 20px 0; text-align: center; font-size: 1.5em; font-weight: bold; }
        .hero { text-align: center; padding: 50px; background: #cc5500; color: white; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.2); }
        .hero h1 { margin: 0; font-size: 2.8em; font-weight: bold; }
        .hero p { font-size: 1.2em; margin-top: 10px; }
        .pricing { text-align: center; padding: 40px; background: white; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); border-radius: 10px; transition: all 0.3s ease; }
        .pricing:hover { box-shadow: 0px 6px 20px rgba(0,0,0,0.15); }
        .pricing h2 { margin-bottom: 20px; color: #cc5500; font-size: 2em; }
        .pricing form { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .pricing label { font-weight: bold; color: #cc5500; font-size: 1.1em; }
        .pricing input, .pricing select, .pricing input[type='range'] { padding: 14px; width: 100%; max-width: 400px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; transition: all 0.3s ease; }
        .pricing input:focus, .pricing select:focus { border-color: #cc5500; outline: none; }
        .pricing button { padding: 14px 24px; background: #cc5500; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2em; font-weight: bold; transition: 0.3s ease; }
        .pricing button:hover { background: #b04b00; transform: scale(1.05); }
        .result-container { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; }
        .compute-type { margin-top: 15px; font-size: 1.1em; font-weight: bold; color: #cc5500; }
        .firewall-options { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
        .vm-list-container { width: 100%; max-width: 450px; background: #f8f9fa; padding: 15px; border-radius: 10px; box-shadow: 0px 2px 8px rgba(0,0,0,0.1); }
        .vm-list { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; }
        .vm-list li { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #ddd; }
        .vm-list input { margin-right: 10px; }
        .cart { position: fixed; right: 20px; top: 120px; width: 320px; background: white; padding: 20px; box-shadow: 0px 4px 10px rgba(0,0,0,0.2); border-radius: 10px; }
        .cart h3 { margin-top: 0; color: #cc5500; font-size: 1.5em; text-align: center; }
        .cart ul { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        .cart p { text-align: center; font-size: 1.2em; font-weight: bold; }
        footer { text-align: center; background: #1c3f94; color: white; padding: 15px; font-size: 1em; margin-top: 30px; }
    </style>
</head>
<body>
    <header>Virtual Machine as a Service (VMaaS)</header>
    <section class="hero">
        <h1>Scalable, Secure, and Reliable Cloud VMs</h1>
        <p>Deploy your virtual machines in minutes with flexible pricing and high performance.</p>
    </section>
    <div class="container">
        <section class="pricing">
            <h2>VM Pricing Calculator</h2>
            <input type="file" id="fileUpload" accept=".xlsx">
            <div class="vm-list-container">
                <h3>Select Virtual Machines:</h3>
                <ul id="vm-list" class="vm-list"></ul>
            </div>
        </section>
    </div>
    <script>
        document.getElementById("fileUpload").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsBinaryString(file);
            reader.onload = function(e) {
                const data = e.target.result;
                const workbook = XLSX.read(data, { type: "binary" });
                const vInfo = XLSX.utils.sheet_to_json(workbook.Sheets["vInfo"]);
                const vmList = document.getElementById("vm-list");
                vmList.innerHTML = "";
                vInfo.forEach(vm => {
                    let li = document.createElement("li");
                    let checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.value = vm["VM"];
                    li.appendChild(checkbox);
                    li.appendChild(document.createTextNode(`${vm["VM"]} - ${vm["OS according to the configuration file"]}, ${vm["CPUs"]} vCPU, ${vm["Provisioned MB"] / 1024} GB RAM`));
                    vmList.appendChild(li);
                });
            };
        });
    </script>
</body>
</html>
