<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VM Pricing Processor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.2/xlsx.full.min.js"></script>
</head>
<body>
  <h1>VM Pricing Calculator</h1>

  <input type="file" id="excelFile" accept=".xlsx" />
  <table id="vm-table" border="1">
    <thead>
      <tr>
        <th>VM Name</th>
        <th>OS</th>
        <th>CPU</th>
        <th>RAM (GB)</th>
        <th>Storage (GB)</th>
        <th>Used Storage (GB)</th>
        <th>Azure VM</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="summary">
    <h3>Summary</h3>
    <table id="summary-table" border="1">
      <thead>
        <tr>
          <th>VM Name</th>
          <th>OS</th>
          <th>CPU</th>
          <th>RAM (GB)</th>
          <th>Storage (GB)</th>
          <th>Used Storage (GB)</th>
          <th>Azure VM</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="summary-total-azure-cost"></p>
    <p id="summary-total-standard-cost"></p>
    <p id="cart-total"></p>
  </div>

  <script src="Vm%20Pricing%20Processor.js"></script>
  <script>
    document.getElementById('excelFile').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function (e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const vms = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

        const tableBody = document.querySelector("#vm-table tbody");
        tableBody.innerHTML = "";

        for (let vm of vms) {
          let vmName = vm["VM"] || vm["VM Name"] || "Unknown";
          let osType = vm["OS according to the configuration file"] || "Unknown";
          let cpu = parseInt(vm["CPUs"] || vm["NumCpu"] || 0);
          let ramMB = parseInt(vm["Memory"] || vm["MemoryMB"] || 0);
          let ramGB = (ramMB / 1024).toFixed(2);
          let storageMiB = parseFloat(vm["Provisioned MiB"] || 0);
          let usedStorageMiB = parseFloat(vm["In Use MiB"] || 0);
          let storageGB = (storageMiB / 1024).toFixed(2);
          let usedStorageGB = (usedStorageMiB / 1024).toFixed(2);

          let row = document.createElement("tr");
          row.innerHTML = `
            <td>${vmName}</td>
            <td>${osType}</td>
            <td>${cpu}</td>
            <td>${ramGB}</td>
            <td>${storageGB}</td>
            <td>${usedStorageGB}</td>
            <td><select class="azure-vm-select"><option>Matching...</option></select></td>
          `;

          row.addEventListener("click", () => {
            row.classList.toggle("selected");
          });

          tableBody.appendChild(row);
        }
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
