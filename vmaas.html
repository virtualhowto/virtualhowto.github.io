<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VM Pricing Processor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.2/xlsx.full.min.js"></script>
  <style>
    #cart-summary {
      position: fixed;
      top: 80px;
      right: 20px;
      width: 300px;
      background: #f8f9fa;
      border: 1px solid #ccc;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .selected {
      background-color: #ffeeba;
    }
  </style>
</head>
<body>
  <h1>VM Pricing Calculator</h1>

  <input type="file" id="excelFile" accept=".xlsx" />
  <table id="vm-table" border="1">
    <thead>
      <tr>
        <th>VM Name</th>
        <th>OS</th>
        <th>CPU</th>
        <th>RAM (GB)</th>
        <th>Storage (GB)</th>
        <th>Used Storage (GB)</th>
        <th>Azure VM</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="cart-summary">
    <h3>Pricing Cart</h3>
    <p id="summary-total-azure-cost">Azure Total: $0.00</p>
    <p id="summary-total-standard-cost">Standard Total: $0.00</p>
    <p id="cart-total">Cart Total: $0.00</p>
  </div>

  <script>
    let azurePricing = [];

    async function fetchAzurePricing() {
      const res = await fetch("azure-pricing.json");
      azurePricing = await res.json();
    }

    function matchAzureVM(cpu, ramGB, osType) {
      const isWindows = osType.toLowerCase().includes("windows");
      const matched = azurePricing.find(vm =>
        vm.numberOfCores == cpu && (vm.memoryInMB / 1024).toFixed(2) == ramGB
      );

      if (!matched) return { name: "No Match", cost: 0 };

      const price = parseFloat(isWindows ? matched.windowsPrice : matched.linuxPrice) * 720;
      return { name: matched.name, cost: price };
    }

    function updateSummary() {
      let totalAzureCost = 0;
      let totalStandardCost = 0;

      document.querySelectorAll("#vm-table tbody tr.selected").forEach(row => {
        totalAzureCost += parseFloat(row.dataset.azureCost || 0);
        totalStandardCost += parseFloat(row.dataset.standardCost || 0);
      });

      document.getElementById("summary-total-azure-cost").textContent = `Azure Total: $${totalAzureCost.toFixed(2)}`;
      document.getElementById("summary-total-standard-cost").textContent = `Standard Total: $${totalStandardCost.toFixed(2)}`;
      document.getElementById("cart-total").textContent = `Cart Total: $${(totalAzureCost + totalStandardCost).toFixed(2)}`;
    }

    document.getElementById('excelFile').addEventListener('change', async function (e) {
      const file = e.target.files[0];
      if (!file) return;

      await fetchAzurePricing();

      const reader = new FileReader();
      reader.onload = async function (e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const vms = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

        const tableBody = document.querySelector("#vm-table tbody");
        tableBody.innerHTML = "";

        for (let vm of vms) {
          let vmName = vm["VM"] || vm["VM Name"] || "Unknown";
          let osType = vm["OS according to the configuration file"] || "Unknown";
          let cpu = parseInt(vm["CPUs"] || vm["NumCpu"] || 0);
          let ramMB = parseInt(vm["Memory"] || vm["MemoryMB"] || 0);
          let ramGB = (ramMB / 1024).toFixed(2);
          let storageMiB = parseFloat(vm["Provisioned MiB"] || 0);
          let usedStorageMiB = parseFloat(vm["In Use MiB"] || 0);
          let storageGB = (storageMiB / 1024).toFixed(2);
          let usedStorageGB = (usedStorageMiB / 1024).toFixed(2);

          let matched = matchAzureVM(cpu, ramGB, osType);

          let row = document.createElement("tr");
          row.innerHTML = `
            <td>${vmName}</td>
            <td>${osType}</td>
            <td>${cpu}</td>
            <td>${ramGB}</td>
            <td>${storageGB}</td>
            <td>${usedStorageGB}</td>
            <td><select class="azure-vm-select"><option>${matched.name}</option></select></td>
          `;

          row.dataset.azureCost = matched.cost;
          row.dataset.standardCost = (cpu * 15).toFixed(2); // Example standard pricing

          row.addEventListener("click", () => {
            row.classList.toggle("selected");
            updateSummary();
          });

          tableBody.appendChild(row);
        }
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
