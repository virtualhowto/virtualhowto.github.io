<!DOCTYPE html>
<html lang="en">
<head>
 <!-- Google tag (gtag.js) -->

  function gtag(){dataLayer.push(arguments);}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RVTools Matcher</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
<style>
  body { padding-top: 4.5rem; }
  .highlight { background-color: #d1e7dd; }
  .no-match { background-color: #f8d7da; }
  #spinner { display: none; }
  .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1055; }
  .modal-dialog-scrollable { max-height: 90vh; }
  .filter-input { width: 100%; padding: 0.25rem; margin-bottom: 0.5rem; }
  .sticky-header { position: fixed; top: 0; width: 100%; z-index: 1020; background: #fff; padding: .5rem 1rem; box-shadow: 0 2px 2px rgba(0,0,0,0.1); }
</style>
</head>
<body class="bg-light">
<div class="sticky-header d-flex justify-content-between align-items-center">
  <h4 class="mb-0">RVTools Matcher</h4>
  <div>
    <span class="me-4">Total Azure Price: <strong id="totalPrice">$0.00</strong></span>
    <span class="me-4">ATA Price: <strong id="ataPrice">$0.00</strong></span>
    <span class="me-4">Storage Charge @ $0.30/GB: <strong id="storageCharge">$0.00</strong></span>
    <span>Total Combined: <strong id="grandTotal">$0.00</strong></span>
  </div>
</div>
<div class="container mt-4">
  <h2>Upload RVTools Export</h2>
  <input type="file" id="fileInput" class="form-control mb-4" accept=".xlsx" />
  <div id="spinner" class="text-center my-3">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
    <p>Processing...</p>
  </div>
  <div class="toast-container">
    <div id="toastSuccess" class="toast align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex"><div class="toast-body">✅ File loaded successfully!</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
    </div>
    <div id="toastError" class="toast align-items-center text-bg-danger border-0" role="alert">
      <div class="d-flex"><div class="toast-body">❌ No rows found in the selected sheet.</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
    </div>
  </div>
  <h3>Matched VMs</h3>
  <table class="table table-bordered" id="vmTable">
    <thead><tr><th>VM</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>Matched SKU</th><th>Azure Price</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let fullCatalog = [], ataPricing = {};
let selectedRow = null;
let lastVmData = [];
let matchedSkus = [];
const octopusFeePerWindowsVM = 20;

fetch('./az_data-export.json')
  .then(r => r.json())
  .then(data => {
    fullCatalog = data.map(d => ({
      name: d.name,
      cpu: d.numberOfCores,
      ram: d.memoryInMB,
      storage: d.osDiskSizeInMB || 0,
      priceLinux: parseFloat(d.linuxPrice) || 0,
      priceWindows: parseFloat(d.windowsPrice) || 0
    }));
  });

fetch('./cld-pricing.json')
  .then(r => {
    if (!r.ok) throw new Error(`Failed to load cld-pricing.json (${r.status})`);
    return r.json();
  })
  .then(data => ataPricing = data)
  .catch(err => console.error('❌ Error loading cld-pricing.json:', err.message));

document.getElementById('fileInput').addEventListener('change', e => {
  if (!e.target.files.length) return;
  document.getElementById('spinner').style.display = 'block';
  const reader = new FileReader();
  reader.onload = evt => {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets['vInfo'] || workbook.Sheets[workbook.SheetNames[0]];
    const vmData = XLSX.utils.sheet_to_json(sheet);
    document.getElementById('spinner').style.display = 'none';
    if (!vmData.length) return new bootstrap.Toast(document.getElementById('toastError')).show();
    lastVmData = vmData;
    renderTable(vmData);
    new bootstrap.Toast(document.getElementById('toastSuccess')).show();
  };
  reader.readAsArrayBuffer(e.target.files[0]);
});

function renderTable(vmData) {
  const tbody = document.querySelector('#vmTable tbody');
  tbody.innerHTML = '';
  matchedSkus = [];
  vmData.forEach((vm, i) => {
    const cpu = +vm['CPUs'] || 0;
    const ram = +vm['Memory'] || 0;
    const storage = +vm['Provisioned Storage (GB)'] || 0;
    const os = (vm['OS according to the configuration file'] || '').toLowerCase();
    const match = fullCatalog.find(sku => Math.abs(sku.cpu - cpu) <= 1 && Math.abs(sku.ram - ram) <= 2);
    matchedSkus[i] = match || null;
    const price = match ? (os.includes('win') ? match.priceWindows : match.priceLinux) : 0;
    tbody.innerHTML += `
      <tr>
        <td>${vm['VM']}</td>
        <td>${cpu}</td>
        <td>${ram}</td>
        <td>${storage}</td>
        <td>${os}</td>
        <td>${match ? match.name : 'No match'}</td>
        <td>$${price.toFixed(2)}</td>
      </tr>`;
  });
  updateSummary();
}

function updateSummary() {
  const total = matchedSkus.reduce((sum, sku, i) => {
    const os = (lastVmData[i]['OS according to the configuration file'] || '').toLowerCase();
    return sum + (sku ? (os.includes('win') ? sku.priceWindows : sku.priceLinux) : 0);
  }, 0);
  document.getElementById('totalPrice').innerText = `$${total.toFixed(2)}`;

  const ataTotal = lastVmData.reduce((sum, vm) => {
    const cpu = +vm['CPUs'] || 0;
    const ram = +vm['Memory'] || 0;
    const storage = +vm['Provisioned Storage (GB)'] || 0;
    const os = (vm['OS according to the configuration file'] || '').toLowerCase();
    const octopus = os.includes('win') ? octopusFeePerWindowsVM : 0;
    return sum + ((cpu * ataPricing.unitCPU) + (ram * ataPricing.unitRAM) + (storage * ataPricing.unitStorage) + octopus);
  }, 0);
  document.getElementById('ataPrice').innerText = `$${ataTotal.toFixed(2)}`;

  const storageCharge = lastVmData.reduce((sum, vm) => {
    const gb = +vm['Provisioned Storage (GB)'] || 0;
    const tbChunks = Math.ceil(gb / 1024) || 1;
    return sum + tbChunks * 1024 * 0.30;
  }, 0);
  document.getElementById('storageCharge').innerText = `$${storageCharge.toFixed(2)}`;

  const grandTotal = total + ataTotal + storageCharge;
  document.getElementById('grandTotal').innerText = `$${grandTotal.toFixed(2)}`;
}
</script>
</body>
</html>
