<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RVTools Matcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <!-- Upload, filter, and table UI would go here -->
    <h2>Match Azure SKUs</h2>
    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">CPU Filter</label>
        <input type="number" class="form-control" id="filterCpuInput" placeholder="e.g., 2">
      </div>
      <div class="col-md-4">
        <label class="form-label">RAM Filter (GB)</label>
        <input type="number" class="form-control" id="filterRamInput" placeholder="e.g., 16">
      </div>
      <div class="col-md-4">
        <label class="form-label">Region Filter</label>
        <input type="text" class="form-control" id="filterRegion" placeholder="e.g., australiaeast">
      </div>
    </div>

    <button class="btn btn-primary mb-3" onclick="filterSkuTable()">Apply Filters</button>
    
    <div id="skuSelectorResults"></div>
  </div>

<script>
let fullCatalog = []; // should be populated with JSON on page load or via upload

function filterSkuTable() {
  console.log('🔍 Running filterSkuTable');
  const cpu = parseInt(document.getElementById('filterCpuInput').value);
  const ram = parseFloat(document.getElementById('filterRamInput').value);
  const region = document.getElementById('filterRegion').value.trim().toLowerCase();

  console.log('➡️ Inputs:', { cpu, ram, region });
  console.log('📦 Full catalog size:', fullCatalog.length);

  const filteredCatalog = fullCatalog.filter(p => {
    const matchCpu = isNaN(cpu) || Math.abs(p.cpu - cpu) <= 1;
    const matchRam = isNaN(ram) || Math.abs(p.ram - ram) <= 2;
    const matchRegion = !region || (p.region && p.region.includes(region));
    return matchCpu && matchRam && matchRegion;
  });

  console.log('✅ Filtered results count:', filteredCatalog.length);

  const results = filteredCatalog.map(p => `
    <tr onclick="selectSku('${p.name}', ${p.cpu}, ${p.ram}, '${p.description}', ${p.priceLinux}, ${p.priceWindows})" style="cursor:pointer">
      <td>${p.name}</td>
      <td>${p.cpu}</td>
      <td>${p.ram.toFixed(2)}</td>
      <td>${p.description}</td>
      <td>$${p.priceLinux.toFixed(4)} (Linux)</td>
      <td>$${p.priceWindows.toFixed(4)} (Windows)</td>
    </tr>
  `).join('');

  document.getElementById('skuSelectorResults').innerHTML = `
    <table class="table table-hover">
      <thead><tr><th>Name</th><th>CPU</th><th>RAM</th><th>Description</th><th>Linux Price</th><th>Windows Price</th></tr></thead>
      <tbody>${results}</tbody>
    </table>
  `;
}
</script>
</body>
</html>
