<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RVTools Matcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body { padding-top: 5rem; }
    .sticky-header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1020;
      background: #fff;
      padding: 0.5rem 1rem;
      box-shadow: 0 2px 2px rgba(0,0,0,0.1);
    }
    .summary-tile {
      padding: 1rem;
      border-radius: 0.75rem;
      color: white;
      font-weight: bold;
      text-align: center;
      min-width: 160px;
    }
    .azure-tile {
      background-color: #0072C6;
    }
    .atturra-tile {
      background-color: #00a19b;
    }
    .grand-total {
      font-size: 1.25rem;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-light">
  <div class="sticky-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">RVTools Matcher</h4>
    <div class="d-flex gap-3 align-items-center">
      <div class="summary-tile azure-tile">
        Azure Total<br>
        <span id="combinedAzureTotal">$0.00</span>
      </div>
      <div class="summary-tile atturra-tile">
        ATA Total<br>
        <span id="ataPrice">$0.00</span>
      </div>
      <div class="grand-total">
        Grand Total:<br><span id="grandTotal">$0.00</span>
      </div>
    </div>
  </div>
  <div class="container mt-4">
    <h2>Upload RVTools Export</h2>
    <input type="file" id="fileInput" class="form-control mb-4" accept=".xlsx" />
    <div id="spinner" class="text-center my-3">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
      <p>Processing...</p>
    </div>
    <h3>Matched VMs</h3>
    <table class="table table-bordered" id="vmTable">
      <thead><tr><th>VM</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>Matched SKU</th><th>Azure Price</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let fullCatalog = [], ataPricing = {};
    let selectedRow = null;
    let lastVmData = [];
    let matchedSkus = [];
    const octopusFeePerWindowsVM = 20;

    fetch('./az_data-export.json')
      .then(r => r.json())
      .then(data => {
        fullCatalog = data.map(d => ({
          name: d.name,
          cpu: d.numberOfCores,
          ram: d.memoryInMB,
          storage: d.osDiskSizeInMB || 0,
          priceLinux: parseFloat(d.linuxPrice) || 0,
          priceWindows: parseFloat(d.windowsPrice) || 0
        }));
      });

    fetch('./cld-pricing.json')
      .then(r => r.json())
      .then(data => ataPricing = data);

    document.getElementById('fileInput').addEventListener('change', e => {
      if (!e.target.files.length) return;
      document.getElementById('spinner').style.display = 'block';
      const reader = new FileReader();
      reader.onload = evt => {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets['vInfo'] || workbook.Sheets[workbook.SheetNames[0]];
        const vmData = XLSX.utils.sheet_to_json(sheet);
        document.getElementById('spinner').style.display = 'none';
        if (!vmData.length) return;
        lastVmData = vmData;
        renderTable(vmData);
      };
      reader.readAsArrayBuffer(e.target.files[0]);
    });

    function renderTable(vmData) {
      const tbody = document.querySelector('#vmTable tbody');
      tbody.innerHTML = '';
      matchedSkus = [];
      vmData.forEach((vm, i) => {
        const cpu = +vm['CPUs'] || 0;
        const ram = +vm['Memory'] || 0;
        const storage = +vm['Provisioned Storage (GB)'] || 0;
        const os = (vm['OS according to the configuration file'] || '').toLowerCase();
        const match = fullCatalog.find(sku => Math.abs(sku.cpu - cpu) <= 1 && Math.abs(sku.ram - ram) <= 2);
        matchedSkus[i] = match || null;
        const price = match ? (os.includes('win') ? match.priceWindows : match.priceLinux) : 0;
        tbody.innerHTML += `
          <tr>
            <td>${vm['VM']}</td>
            <td>${cpu}</td>
            <td>${ram}</td>
            <td>${storage}</td>
            <td>${os}</td>
            <td>${match ? match.name : 'No match'}</td>
            <td>$${price.toFixed(2)}</td>
          </tr>`;
      });
      updateSummary();
    }

    function updateSummary() {
      const azureTotal = matchedSkus.reduce((sum, sku, i) => {
        const os = (lastVmData[i]['OS according to the configuration file'] || '').toLowerCase();
        return sum + (sku ? (os.includes('win') ? sku.priceWindows : sku.priceLinux) : 0);
      }, 0);
      document.getElementById('combinedAzureTotal').innerText = `$${azureTotal.toFixed(2)}`;

      const ataTotal = lastVmData.reduce((sum, vm) => {
        const cpu = +vm['CPUs'] || 0;
        const ram = +vm['Memory'] || 0;
        const storage = +vm['Provisioned Storage (GB)'] || 0;
        const os = (vm['OS according to the configuration file'] || '').toLowerCase();
        const octopus = os.includes('win') ? octopusFeePerWindowsVM : 0;
        return sum + ((cpu * ataPricing.unitCPU) + (ram * ataPricing.unitRAM) + (storage * ataPricing.unitStorage) + octopus);
      }, 0);
      document.getElementById('ataPrice').innerText = `$${ataTotal.toFixed(2)}`;

      const grandTotal = azureTotal + ataTotal;
      document.getElementById('grandTotal').innerText = `$${grandTotal.toFixed(2)}`;
    }
  </script>
</body>
</html>
