<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVTools Matcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .highlight { background-color: #d1e7dd; }
    .no-match { background-color: #f8d7da; }
    #spinner { display: none; }
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1055; }
    .filter-input { width: 100%; padding: 0.25rem; margin-bottom: 0.5rem; }
    .sticky-header { position: sticky; top: 0; background: #fff; z-index: 1040; padding: 1rem 0; border-bottom: 1px solid #dee2e6; }
  </style>
</head>
<body class="bg-light">
<div class="container py-4">
  <!-- Sticky Header -->
  <div class="sticky-header">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">RVTools Matcher</h1>
      <div>Total Azure Price (Monthly): <strong id="summaryPrice">$0.00</strong></div>
    </div>
  </div>

  <h2 class="mt-4">Upload RVTools Export</h2>
  <input type="file" id="fileInput" class="form-control mb-4" accept=".xlsx" />
  <div id="spinner" class="text-center my-3">
    <div class="spinner-border text-primary" role="status"></div>
    <p>Processing...</p>
  </div>
  <div class="toast-container">
    <div id="toastSuccess" class="toast text-bg-success" role="alert"><div class="toast-body">✅ File loaded!</div></div>
    <div id="toastError" class="toast text-bg-danger" role="alert"><div class="toast-body">❌ No data found.</div></div>
  </div>

  <h3>Matched VMs</h3>
  <table class="table table-bordered" id="vmTable">
    <thead><tr><th>VM</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>Matched SKU</th><th>Azure Price (Monthly)</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal fade" id="skuModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Select SKU</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row mb-2">
          <div class="col"><input class="form-control" id="filterName" placeholder="Filter by Name"></div>
          <div class="col"><input class="form-control" id="filterCPU" placeholder="Filter by CPU"></div>
          <div class="col"><input class="form-control" id="filterRAM" placeholder="Filter by RAM"></div>
        </div>
        <table class="table table-sm table-striped">
          <thead><tr><th>Name</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS Disk</th><th>Price</th><th>Select</th></tr></thead>
          <tbody id="skuTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let fullCatalog = [], matchedSkus = [], selectedRow = 0, lastVmData = [];

// Initialize Bootstrap tooltips
function initTooltips() {
  const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
  tooltipTriggerList.forEach(el => new bootstrap.Tooltip(el, {html: true}));
}

function getSkuPrice(sku, os) {
  const isWin = os.includes('win');
  const price = isWin ? sku.priceWindows : sku.priceLinux;
  return price.toFixed(2);
}

function updateSummary() {
  const total = matchedSkus.reduce((sum, sku, i) => {
    if (!sku) return sum;
    const os = (lastVmData[i]["OS according to the configuration file"] || '').toLowerCase();
    return sum + parseFloat(getSkuPrice(sku, os));
  }, 0);
  document.getElementById('summaryPrice').innerText = `$${total.toFixed(2)}`;
}

function showToast(id) {
  new bootstrap.Toast(document.getElementById(id)).show();
}

fetch('./az_data-export.json').then(r => r.json()).then(data => {
  fullCatalog = data.map(d => ({
    name: d.name,
    cpu: d.numberOfCores,
    ram: d.memoryInMB,
    storage: parseFloat(d.osDiskSizeInMB || 0) / 1024,
    description: d.osDiskSizeInMB ? `${(d.osDiskSizeInMB/1024).toFixed(2)} GB` : '—',
    priceWindows: parseFloat(d.windowsPrice),
    priceLinux: parseFloat(d.linuxPrice)
  }));
});

document.getElementById("fileInput").addEventListener("change", e => {
  if (e.target.files.length) readXlsx(e.target.files[0]);
});

function readXlsx(file) {
  document.getElementById('spinner').style.display = 'block';
  const reader = new FileReader();
  reader.onload = e => {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const vmData = XLSX.utils.sheet_to_json(sheet);
    document.getElementById('spinner').style.display = 'none';
    if (!vmData.length) return showToast('toastError');
    renderVMTable(vmData);
    showToast('toastSuccess');
  };
  reader.readAsArrayBuffer(file);
}

function renderVMTable(vmData) {
  lastVmData = vmData;
  const tbody = document.querySelector("#vmTable tbody");
  tbody.innerHTML = "";
  matchedSkus = [];
  vmData.forEach((vm, idx) => {
    const cpu = parseFloat(vm["CPUs"]);
    const ram = parseFloat(vm["Memory"]);
    const storageVal = parseFloat(vm["Provisioned Storage (GB)"] ?? vm["GiB"] ?? vm["Storage"] ?? 0);
    const os = (vm["OS according to the configuration file"] || '').toLowerCase();
    const matches = fullCatalog.filter(s =>
      Math.abs(s.cpu - cpu) <= 0 && Math.abs(s.ram - ram) <= 0
    );
    const best = matches[0] || null;
    matchedSkus[idx] = best;
    const tip = best ?
      `<strong>Name:</strong> ${best.name}<br>` +
      `<strong>CPU:</strong> ${best.cpu}<br>` +
      `<strong>RAM:</strong> ${best.ram.toFixed(2)} GB<br>` +
      `<strong>Storage:</strong> ${best.storage.toFixed(2)} GB<br>` +
      `<strong>Price:</strong> $${getSkuPrice(best, os)}`
      : 'Click to select';
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${vm["VM"]}</td>
      <td>${cpu}</td>
      <td>${ram.toFixed(2)}</td>
      <td>${storageVal.toFixed(2)}</td>
      <td>${os}</td>
      <td><span class="text-primary" style="cursor:pointer" data-bs-toggle="tooltip" data-bs-html="true" title="${tip}" onclick="openSkuPopup(${idx})">${best?.name || 'Select SKU'}</span></td>
      <td>$${best ? getSkuPrice(best, os) : '-'}</td>
    `;
    tbody.appendChild(row);
  });
  initTooltips();
  updateSummary();
}

function openSkuPopup(index) {
  selectedRow = index;
  const os = (lastVmData[index]["OS according to the configuration file"] || '').toLowerCase();
  document.getElementById('skuTableBody').innerHTML = fullCatalog.map((sku, idx) => `
    <tr>
      <td>${sku.name}</td>
      <td>${sku.cpu}</td>
      <td>${sku.ram.toFixed(2)}</td>
      <td>${sku.storage.toFixed(2)}</td>
      <td>${sku.description}</td>
      <td>$${getSkuPrice(sku, os)}</td>
      <td><button class="btn btn-sm btn-success" onclick="selectSku(${idx})">✔</button></td>
    </tr>`).join('');
  new bootstrap.Modal(document.getElementById('skuModal')).show();
}

function selectSku(idx) {
  const sku = fullCatalog[idx];
  const row = document.querySelector(`#vmTable tbody`).children[selectedRow];
  const os = (lastVmData[selectedRow]["OS according to the configuration file"] || '').toLowerCase();
  const tip = `<strong>Name:</strong> ${sku.name}<br>` +
              `<strong>CPU:</strong> ${sku.cpu}<br>` +
              `<strong>RAM:</strong> ${sku.ram.toFixed(2)} GB<br>` +
              `<strong>Storage:</strong> ${sku.storage.toFixed(2)} GB<br>` +
              `<strong>Price:</strong> $${getSkuPrice(sku, os)}`;
  row.cells[5].innerHTML = `<span class="text-primary" style="cursor:pointer" data-bs-toggle="tooltip" data-bs-html="true" title="${tip}" onclick="openSkuPopup(${selectedRow})">${sku.name}</span>`;
  row.cells[6].innerText = `$${getSkuPrice(sku, os)}`;
  matchedSkus[selectedRow] = sku;
  bootstrap.Modal.getInstance(document.getElementById('skuModal')).hide();
  initTooltips();
  updateSummary();
}
</script>
</body>
</html>
