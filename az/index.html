<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVTools Matcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .highlight { background-color: #d1e7dd; }
    .no-match { background-color: #f8d7da; }
    #spinner { display: none; }
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1055; }
    .modal-dialog-scrollable { max-height: 90vh; }
    .filter-input { width: 100%; padding: 0.25rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body class="bg-light">
<div class="container py-5">
  <h2>Upload RVTools Export</h2>
  <input type="file" id="fileInput" class="form-control mb-4" accept=".xlsx" />

  <div id="spinner" class="text-center my-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Processing...</p>
  </div>

  <div class="toast-container">
    <div id="toastSuccess" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">✅ File loaded successfully!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
    <div id="toastError" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">❌ No rows found in the selected sheet.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <h3>Matched VMs</h3>
  <table class="table table-bordered" id="vmTable">
    <thead>
      <tr><th>VM</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>Matched SKU</th><th>Price (Monthly)</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- SKU Selection Modal -->
<div class="modal fade" id="skuModal" tabindex="-1" aria-labelledby="skuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Select a Matching SKU</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-2">
          <div class="col"><input class="form-control filter-input" id="filterName" placeholder="Filter by Name"></div>
          <div class="col"><input class="form-control filter-input" id="filterCPU" placeholder="Filter by CPU"></div>
          <div class="col"><input class="form-control filter-input" id="filterRAM" placeholder="Filter by RAM (GB)"></div>
        </div>
        <table class="table table-sm table-striped">
          <thead>
            <tr><th>Name</th><th>CPU</th><th>RAM (GB)</th><th>Storage (GB)</th><th>OS</th><th>Monthly Price</th><th>Select</th></tr>
          </thead>
          <tbody id="skuTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let fullCatalog = [];
let selectedRow = null;
let matchedSkus = [];

fetch('./az_data-export.json')
  .then(r => r.json())
  .then(data => {
    fullCatalog = data.map(d => ({
      name: d.name,
      cpu: d.numberOfCores,
      ram: d.memoryInMB,
      storage: d.osDiskSizeInMB / 1024,
      priceLinux: d.linuxPrice,
      priceWindows: d.windowsPrice,
      description: d.description || '',
      region: d.bestPriceRegion || ''
    }));
    console.log('📦 Azure SKU catalog loaded:', fullCatalog.length);
  });

function showToast(id) {
  const toast = new bootstrap.Toast(document.getElementById(id));
  toast.show();
}

function readXlsx(file) {
  document.getElementById('spinner').style.display = 'block';
  const reader = new FileReader();
  reader.onload = e => {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheetName = workbook.SheetNames.includes("vInfo") ? "vInfo" : workbook.SheetNames[0];
    const vmData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
    console.log(`📄 Loaded sheet: ${sheetName}, Rows: ${vmData.length}`);
    document.getElementById('spinner').style.display = 'none';
    if (!vmData.length) {
      showToast('toastError');
      return;
    }
    renderVMTable(vmData);
    showToast('toastSuccess');
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById("fileInput").addEventListener("change", e => {
  if (e.target.files.length) readXlsx(e.target.files[0]);
});

function renderVMTable(vmData) {
  const tbody = document.querySelector("#vmTable tbody");
  tbody.innerHTML = "";
  matchedSkus = [];
  vmData.forEach((vm, index) => {
    try {
      const cpu = parseFloat(vm["CPUs"]);
      const ram = parseFloat(vm["Memory"]);
      const os = (vm["OS according to the configuration file"] || '').toLowerCase();
      const region = "australiaeast";
      const matches = fullCatalog.filter(sku => Math.abs(sku.cpu - cpu) <= 1 && Math.abs(sku.ram - ram) <= 2 && sku.region.toLowerCase().includes(region));
      const best = matches.sort((a, b) => (Math.abs(a.cpu - cpu) + Math.abs(a.ram - ram)) - (Math.abs(b.cpu - cpu) + Math.abs(b.ram - ram)))[0];
      const price = os.includes("win") ? best?.priceWindows : best?.priceLinux;
      const rowClass = best ? 'highlight' : 'no-match';
      matchedSkus.push(best || null);
      const row = document.createElement('tr');
      row.className = rowClass;
      row.innerHTML = `
        <td>${vm["VM"]}</td>
        <td>${cpu}</td>
        <td>${ram.toFixed(2)}</td>
        <td>${vm["Provisioned Storage (GB)"] ? parseFloat(vm["Provisioned Storage (GB)"]).toFixed(2) : '-'}</td>
        <td>${os}</td>
        <td><span class="text-primary" style="cursor:pointer" onclick="openSkuPopup(${index})">${best?.name || 'Select SKU'}</span></td>
        <td>${price ? `$${parseFloat(price).toFixed(2)}` : '-'}</td>
      `;
      tbody.appendChild(row);
    } catch (err) {
      console.error('❌ Error matching row:', vm, err);
    }
  });
}

function openSkuPopup(rowIndex) {
  selectedRow = rowIndex;
  const currentRow = document.querySelector(`#vmTable tbody`).children[selectedRow];
  const currentCPU = parseFloat(currentRow.cells[1].innerText);
  const currentRAM = parseFloat(currentRow.cells[2].innerText);

  const sortedCatalog = [...fullCatalog].sort((a, b) => {
    const scoreA = Math.abs(a.cpu - currentCPU) + Math.abs(a.ram - currentRAM);
    const scoreB = Math.abs(b.cpu - currentCPU) + Math.abs(b.ram - currentRAM);
    if (scoreA === scoreB) return (parseFloat(a.priceLinux) || 0) - (parseFloat(b.priceLinux) || 0);
    return scoreA - scoreB;
  });

  document.getElementById('skuTableBody').innerHTML = sortedCatalog.map((sku, idx) => `
    <tr>
      <td>${sku.name}</td>
      <td>${sku.cpu}</td>
      <td>${sku.ram.toFixed(2)}</td>
      <td>${sku.storage.toFixed(2)}</td>
      <td>${sku.description}</td>
      <td>$${parseFloat(sku.priceLinux).toFixed(2)}</td>
      <td><button class="btn btn-sm btn-success" onclick="selectSku(${fullCatalog.indexOf(sku)})">✔</button></td>
    </tr>`).join('');

  new bootstrap.Modal(document.getElementById('skuModal')).show();
}

function selectSku(idx) {
  const sku = fullCatalog[idx];
  const row = document.querySelector(`#vmTable tbody`).children[selectedRow];
  row.cells[5].innerHTML = `<span class="text-primary" style="cursor:pointer" onclick="openSkuPopup(${selectedRow})">${sku.name}</span>`;
  row.cells[6].innerText = `$${parseFloat(sku.priceLinux).toFixed(2)}`;
  matchedSkus[selectedRow] = sku;
  bootstrap.Modal.getInstance(document.getElementById('skuModal')).hide();
}

["filterName", "filterCPU", "filterRAM"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    const nameVal = document.getElementById("filterName").value.toLowerCase();
    const cpuVal = document.getElementById("filterCPU").value;
    const ramVal = document.getElementById("filterRAM").value;
    const filtered = fullCatalog.filter(sku =>
      (!nameVal || sku.name.toLowerCase().includes(nameVal)) &&
      (!cpuVal || sku.cpu == parseInt(cpuVal)) &&
      (!ramVal || sku.ram.toFixed(2) == parseFloat(ramVal).toFixed(2))
    );
    document.getElementById('skuTableBody').innerHTML = filtered.map((sku, idx) => `
      <tr>
        <td>${sku.name}</td>
        <td>${sku.cpu}</td>
        <td>${sku.ram.toFixed(2)}</td>
        <td>${sku.storage.toFixed(2)}</td>
        <td>${sku.description}</td>
        <td>$${parseFloat(sku.priceLinux).toFixed(2)}</td>
        <td><button class="btn btn-sm btn-success" onclick="selectSku(${fullCatalog.indexOf(sku)})">✔</button></td>
      </tr>`).join('');
  });
});
</script>
</body>
</html>
