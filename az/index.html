<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVTools Matcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .highlight { background-color: #d1e7dd; }
    .no-match { background-color: #f8d7da; }
    #spinner { display: none; }
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1055; }
  </style>
</head>
<body class="bg-light">
<div class="container py-5">
  <h2>Upload RVTools Export</h2>
  <input type="file" id="fileInput" class="form-control mb-4" accept=".xlsx" />

  <div id="spinner" class="text-center my-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Processing...</p>
  </div>

  <div class="toast-container">
    <div id="toastSuccess" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">✅ File loaded successfully!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
    <div id="toastError" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">❌ No rows found in the selected sheet.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <h3>Matched VMs</h3>
  <table class="table table-bordered" id="vmTable">
    <thead>
      <tr><th>VM</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>Matched SKU</th><th>Price (Monthly)</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h4>Filter Azure SKUs</h4>
  <div class="row mb-3">
    <div class="col-md-4">
      <label>CPU</label>
      <input type="number" class="form-control" id="filterCpuInput">
    </div>
    <div class="col-md-4">
      <label>RAM (GB)</label>
      <input type="number" class="form-control" id="filterRamInput">
    </div>
    <div class="col-md-4">
      <label>Region</label>
      <input type="text" class="form-control" id="filterRegion" placeholder="e.g., australiaeast">
    </div>
  </div>
  <button class="btn btn-primary mb-4" onclick="filterSkuTable()">Filter</button>
  <div id="skuSelectorResults"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let fullCatalog = [];

fetch('./az_data-export.json')
  .then(r => r.json())
  .then(data => {
    fullCatalog = data.map(d => ({
      name: d.name,
      cpu: d.numberOfCores,
      ram: d.memoryInMB / 1024,
      priceLinux: d.linuxPrice,
      priceWindows: d.windowsPrice,
      description: d.description || '',
      region: d.bestPriceRegion || ''
    }));
    console.log('📦 Azure SKU catalog loaded:', fullCatalog.length);
  });

function showToast(id) {
  const toast = new bootstrap.Toast(document.getElementById(id));
  toast.show();
}

function readXlsx(file) {
  document.getElementById('spinner').style.display = 'block';
  const reader = new FileReader();
  reader.onload = e => {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    const sheetName = workbook.SheetNames.includes("vInfo") ? "vInfo" : workbook.SheetNames[0];
    const vmData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
    console.log(`📄 Loaded sheet: ${sheetName}, Rows: ${vmData.length}`);

    document.getElementById('spinner').style.display = 'none';

    if (!vmData.length) {
      showToast('toastError');
      return;
    }

    renderVMTable(vmData);
    showToast('toastSuccess');
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById("fileInput").addEventListener("change", e => {
  if (e.target.files.length) readXlsx(e.target.files[0]);
});

function renderVMTable(vmData) {
  const tbody = document.querySelector("#vmTable tbody");
  tbody.innerHTML = "";
  vmData.forEach(vm => {
    const cpu = parseFloat(vm["CPUs"]);
    const ram = parseFloat(vm["Memory"]);
    const os = (vm["OS according to the configuration file"] || '').toLowerCase();
    const region = "australiaeast";

    const matches = fullCatalog.filter(sku =>
      Math.abs(sku.cpu - cpu) <= 1 &&
      Math.abs(sku.ram - ram) <= 2 &&
      sku.region.toLowerCase().includes(region)
    );

    const best = matches.sort((a, b) => {
      const scoreA = Math.abs(a.cpu - cpu) + Math.abs(a.ram - ram);
      const scoreB = Math.abs(b.cpu - cpu) + Math.abs(b.ram - ram);
      return scoreA - scoreB;
    })[0];

    const price = os.includes("win") ? best?.priceWindows : best?.priceLinux;
    const rowClass = best ? '' : ' class="no-match"';

    const row = `<tr${rowClass}>
      <td>${vm["VM"]}</td>
      <td>${cpu}</td>
      <td>${ram}</td>
      <td>${vm["Provisioned Storage (GB)"]}</td>
      <td>${os}</td>
      <td>${best?.name || 'No match'}</td>
      <td>${price ? `$${(price * 720).toFixed(2)}` : '-'}</td>
    </tr>`;

    tbody.innerHTML += row;
  });
}

function filterSkuTable() {
  console.log('🔍 Running filterSkuTable');
  const cpu = parseInt(document.getElementById('filterCpuInput').value);
  const ram = parseFloat(document.getElementById('filterRamInput').value);
  const region = document.getElementById('filterRegion').value.trim().toLowerCase();

  console.log('➡️ Inputs:', { cpu, ram, region });
  console.log('📦 Full catalog size:', fullCatalog.length);

  const filteredCatalog = fullCatalog.filter(p => {
    const matchCpu = isNaN(cpu) || Math.abs(p.cpu - cpu) <= 1;
    const matchRam = isNaN(ram) || Math.abs(p.ram - ram) <= 2;
    const matchRegion = !region || (p.region && p.region.includes(region));
    return matchCpu && matchRam && matchRegion;
  });

  console.log('✅ Filtered results count:', filteredCatalog.length);

  const results = filteredCatalog.map(p => `
    <tr>
      <td>${p.name}</td>
      <td>${p.cpu}</td>
      <td>${p.ram.toFixed(2)}</td>
      <td>${p.description}</td>
      <td>$${p.priceLinux.toFixed(4)} (Linux)</td>
      <td>$${p.priceWindows.toFixed(4)} (Windows)</td>
    </tr>
  `).join('');

  document.getElementById('skuSelectorResults').innerHTML = `
    <table class="table table-hover">
      <thead><tr><th>Name</th><th>CPU</th><th>RAM</th><th>Description</th><th>Linux Price</th><th>Windows Price</th></tr></thead>
      <tbody>${results}</tbody>
    </table>
  `;
}
</script>
</body>
</html>
