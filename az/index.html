<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RVTools Matcher</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container py-5">
  <h1 class="mb-4">RVTools VM Matcher</h1>

  <div class="mb-3">
    <label for="fileInput" class="form-label">Upload RVTools Export (CSV/XLSX)</label>
    <input type="file" class="form-control" id="fileInput" />
  </div>

  <div class="mb-3" id="mappingArea" style="display:none">
    <h5>Map Columns</h5>
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label">VM Name</label>
        <select class="form-select" id="mapName"></select>
      </div>
      <div class="col-md-3">
        <label class="form-label">vCPU</label>
        <select class="form-select" id="mapCPU"></select>
      </div>
      <div class="col-md-3">
        <label class="form-label">RAM (GB)</label>
        <select class="form-select" id="mapRAM"></select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Provisioned Storage (GB)</label>
        <select class="form-select" id="mapStorage"></select>
      </div>
    </div>
    <button class="btn btn-primary mt-3" onclick="matchVMs()">Match VMs</button>
  </div>

  <div id="resultArea" class="mt-4"></div>
</div>

<script>
let sheetData = [];
let productCatalog = [];

fetch("/mnt/data/data-export (2).json")
  .then(res => res.json())
  .then(data => {
    productCatalog = data.map(p => ({
      name: p.name,
      cpu: p.numberOfCores,
      ram: Math.round(p.memoryInMB / 1024),
      price: parseFloat(p.linuxPrice),
      description: p.bestPriceRegion || "Azure VM"
    }));
  });

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheetName = workbook.SheetNames[0];
    const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
    const headers = sheet[0];
    sheetData = sheet.slice(1).map(row => Object.fromEntries(headers.map((h, i) => [h, row[i]])));
    populateMappingDropdowns(headers);
    document.getElementById('mappingArea').style.display = 'block';
  };
  reader.readAsArrayBuffer(file);
});

function populateMappingDropdowns(headers) {
  ["mapName", "mapCPU", "mapRAM", "mapStorage"].forEach(id => {
    const select = document.getElementById(id);
    select.innerHTML = headers.map(h => `<option value="${h}">${h}</option>`).join('');
  });
}

function matchVMs() {
  const nameKey = document.getElementById("mapName").value;
  const cpuKey = document.getElementById("mapCPU").value;
  const ramKey = document.getElementById("mapRAM").value;
  const storageKey = document.getElementById("mapStorage").value;

  const results = sheetData.map((vm, index) => {
    const cpu = parseInt(vm[cpuKey]);
    const ram = parseInt(vm[ramKey]);
    const storage = parseFloat(vm[storageKey]);

    const match = productCatalog.find(p => (
      p.cpu === cpu && Math.abs(p.ram - ram) <= 2
    ));

    return {
      id: index,
      name: vm[nameKey],
      cpu,
      ram,
      storage,
      match: match || { name: "No match", price: 0, description: "--" }
    };
  });

  renderResults(results);
}

function renderResults(results) {
  let html = `<table class="table table-bordered table-striped"><thead><tr>
    <th>VM Name</th><th>CPU</th><th>RAM</th><th>Storage</th><th>Matched SKU</th><th>Description</th><th>Price/hr (Linux)</th><th>Override</th></tr></thead><tbody>`;

  let total = 0;
  results.forEach((r, idx) => {
    html += `<tr>
      <td>${r.name}</td>
      <td>${r.cpu}</td>
      <td>${r.ram}</td>
      <td>${r.storage}</td>
      <td><input class="form-control" id="sku-${idx}" value="${r.match.name}" /></td>
      <td><input class="form-control" id="desc-${idx}" value="${r.match.description}" /></td>
      <td><input class="form-control" id="price-${idx}" value="${r.match.price.toFixed(4)}" /></td>
      <td><button class="btn btn-sm btn-outline-primary" onclick="applyOverride(${idx})">Apply</button></td>
    </tr>`;
    total += r.match.price;
  });
  html += `</tbody></table><h5>Total Estimated Price/hr: $<span id="totalPrice">${total.toFixed(4)}</span></h5>`;

  window._currentResults = results;
  document.getElementById('resultArea').innerHTML = html;
}

function applyOverride(idx) {
  const sku = document.getElementById(`sku-${idx}`).value;
  const desc = document.getElementById(`desc-${idx}`).value;
  const price = parseFloat(document.getElementById(`price-${idx}`).value);

  window._currentResults[idx].match = { name: sku, description: desc, price };

  renderResults(window._currentResults);
}
</script>
</body>
</html>
