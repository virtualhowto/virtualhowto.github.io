<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVTools Matcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .highlight { background-color: #d1e7dd; }
    .no-match { background-color: #f8d7da; }
    #spinner { display: none; }
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1055; }
    .filter-input { width: 100%; padding: 0.25rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body class="bg-light">
<div class="container py-4">
  <h2>Upload RVTools Export</h2>
  <input type="file" id="fileInput" class="form-control mb-4" accept=".xlsx" />
  <div id="spinner" class="text-center my-3">
    <div class="spinner-border text-primary" role="status"></div>
    <p>Processing...</p>
  </div>
  <div class="toast-container">
    <div id="toastSuccess" class="toast text-bg-success" role="alert"><div class="toast-body">✅ File loaded!</div></div>
    <div id="toastError" class="toast text-bg-danger" role="alert"><div class="toast-body">❌ No data found.</div></div>
  </div>
  <h3>Matched VMs</h3>
  <table class="table table-bordered" id="vmTable">
    <thead><tr><th>VM</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>Matched SKU</th><th>Price (Monthly)</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal fade" id="skuModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Select SKU</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row mb-2">
          <div class="col"><input class="form-control" id="filterName" placeholder="Filter by Name"></div>
          <div class="col"><input class="form-control" id="filterCPU" placeholder="Filter by CPU"></div>
          <div class="col"><input class="form-control" id="filterRAM" placeholder="Filter by RAM"></div>
        </div>
        <table class="table table-sm table-striped">
          <thead><tr><th>Name</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>Price</th><th>Select</th></tr></thead>
          <tbody id="skuTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let fullCatalog = [], matchedSkus = [], selectedRow = 0, lastVmData = [];

function getSkuPrice(sku, os) {
  const isWin = os.includes('win');
  const price = isWin ? sku.priceWindows : sku.priceLinux;
  return (typeof price === 'number' ? price : parseFloat(price || 0)).toFixed(2);
}

function showToast(id) {
  new bootstrap.Toast(document.getElementById(id)).show();
}

fetch('./az_data-export.json').then(r => r.json()).then(data => {
  fullCatalog = data.map(d => ({
    name: d.name,
    cpu: d.numberOfCores,
    ram: d.memoryInMB,
    storage: d.osDiskSizeInMB || 0,
    description: d.description || '',
    priceWindows: parseFloat(d.windowsPrice),
    priceLinux: parseFloat(d.linuxPrice),
    region: (d.bestPriceRegion || '').toLowerCase()
  }));
});

document.getElementById("fileInput").addEventListener("change", e => {
  if (e.target.files.length) readXlsx(e.target.files[0]);
});

function readXlsx(file) {
  document.getElementById('spinner').style.display = 'block';
  const reader = new FileReader();
  reader.onload = e => {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets["vInfo"] || workbook.Sheets[workbook.SheetNames[0]];
    const vmData = XLSX.utils.sheet_to_json(sheet);
    document.getElementById('spinner').style.display = 'none';
    if (!vmData.length) return showToast('toastError');
    renderVMTable(vmData);
    showToast('toastSuccess');
  };
  reader.readAsArrayBuffer(file);
}

function renderVMTable(vmData) {
  lastVmData = vmData;
  const tbody = document.querySelector("#vmTable tbody");
  tbody.innerHTML = "";
  matchedSkus = [];
  vmData.forEach((vm, idx) => {
    const cpu = parseFloat(vm["CPUs"]);
    const ram = parseFloat(vm["Memory"]);
    const os = (vm["OS according to the configuration file"] || '').toLowerCase();
    const region = 'australiaeast';
    const matches = fullCatalog.filter(s =>
      Math.abs(s.cpu - cpu) <= 1 &&
      Math.abs(s.ram - ram) <= 2 &&
      s.region.includes(region)
    );
    const best = matches.sort((a, b) =>
      (Math.abs(a.cpu - cpu) + Math.abs(a.ram - ram)) -
      (Math.abs(b.cpu - cpu) + Math.abs(b.ram - ram))
    )[0];
    matchedSkus[idx] = best;
    const titleAttr = best ? `title='${JSON.stringify(best)}'` : '';
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${vm["VM"]}</td>
      <td>${cpu}</td>
      <td>${ram.toFixed(2)}</td>
      <td>${parseFloat(vm["Provisioned Storage (GB)"] || 0).toFixed(2)}</td>
      <td>${os}</td>
      <td ${titleAttr}><span class="text-primary" style="cursor:pointer" onclick="openSkuPopup(${idx})">${best?.name || 'Select SKU'}</span></td>
      <td>$${best ? getSkuPrice(best, os) : '-'}</td>`;
    tbody.appendChild(row);
  });
}

function openSkuPopup(index) {
  selectedRow = index;
  const os = (lastVmData[index]["OS according to the configuration file"] || '').toLowerCase();
  document.getElementById('skuTableBody').innerHTML = fullCatalog.map((sku, idx) => `
    <tr>
      <td>${sku.name}</td>
      <td>${sku.cpu}</td>
      <td>${sku.ram.toFixed(2)}</td>
      <td>${sku.storage.toFixed(2)}</td>
      <td>${sku.description}</td>
      <td>$${getSkuPrice(sku, os)}</td>
      <td><button class="btn btn-sm btn-success" onclick="selectSku(${idx})">✔</button></td>
    </tr>`).join('');
  new bootstrap.Modal(document.getElementById('skuModal')).show();
}

function selectSku(idx) {
  const sku = fullCatalog[idx];
  const row = document.querySelector(`#vmTable tbody`).children[selectedRow];
  const os = (lastVmData[selectedRow]["OS according to the configuration file"] || '').toLowerCase();
  const titleAttr = `title='${JSON.stringify(sku)}'`;
  row.cells[5].innerHTML = `<span ${titleAttr} class="text-primary" style="cursor:pointer" onclick="openSkuPopup(${selectedRow})">${sku.name}</span>`;
  row.cells[6].innerText = `$${getSkuPrice(sku, os)}`;
  matchedSkus[selectedRow] = sku;
  bootstrap.Modal.getInstance(document.getElementById('skuModal')).hide();
}

["filterName", "filterCPU", "filterRAM"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    const nameVal = document.getElementById("filterName").value.toLowerCase();
    const cpuVal = document.getElementById("filterCPU").value;
    const ramVal = document.getElementById("filterRAM").value;
    const os = (lastVmData[selectedRow]["OS according to the configuration file"] || '').toLowerCase();
    const filtered = fullCatalog.filter(sku =>
      (!nameVal || sku.name.toLowerCase().includes(nameVal)) &&
      (!cpuVal || sku.cpu == parseInt(cpuVal)) &&
      (!ramVal || sku.ram.toFixed(2) == parseFloat(ramVal).toFixed(2))
    );
    document.getElementById('skuTableBody').innerHTML = filtered.map((sku, idx) => `
      <tr>
        <td>${sku.name}</td>
        <td>${sku.cpu}</td>
        <td>${sku.ram.toFixed(2)}</td>
        <td>${sku.storage.toFixed(2)}</td>
        <td>${sku.description}</td>
        <td>$${getSkuPrice(sku, os)}</td>
        <td><button class="btn btn-sm btn-success" onclick="selectSku(${idx})">✔</button></td>
      </tr>`).join('');
  });
});
</script>
</body>
</html>
