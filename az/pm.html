<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVTools Matcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .summary-tile { padding: 10px; margin: 5px; cursor: pointer; border-radius: 5px; color: white; }
    .azure-tile { background-color: #0078d4; }
    .aws-tile { background-color: #FF9900; }
    .ata-tile { background-color: #6c757d; }
    body.dark-mode { background-color: #222; color: #fff; }
    body.dark-mode .table { background-color: #333; color: #fff; }
    body.dark-mode .modal-content { background-color: #333; color: #fff; }
    body.dark-mode .form-control, body.dark-mode .form-select { background-color: #444; color: #fff; border-color: #555; }
    .badge { cursor: pointer; }
  </style>
</head>
<body>
  <div class="container my-3">
    <h1>RVTools Matcher</h1>
    <div class="mb-3">
      <input type="file" id="fileInput" class="form-control" accept=".csv">
    </div>
    <div class="mb-3">
      <button class="btn btn-primary" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </div>
    <div class="mb-3 d-flex">
      <span class="summary-tile azure-tile" onclick="exportCSV('azure')" title="Click to export detailed Azure pricing breakdown">
        Azure Total: <strong id="totalPrice">A$0.00</strong>
      </span>
      <span class="summary-tile aws-tile" onclick="exportCSV('aws')" title="Click to export detailed AWS pricing breakdown">
        AWS Total: <strong id="awsTotalPrice">A$0.00</strong>
      </span>
      <span class="summary-tile ata-tile" onclick="exportCSV('ata')" title="Click to export detailed Private Cloud pricing breakdown">
        Private Cloud Total: <strong id="ataPrice">A$0.00</strong>
      </span>
    </div>
    <table id="vmTable" class="table table-bordered">
      <thead>
        <tr>
          <th>VM</th>
          <th>CPU</th>
          <th>RAM</th>
          <th>Storage</th>
          <th>OS</th>
          <th>AZ_SKU</th>
          <th>AWS_SKU</th>
          <th>Storage Tier</th>
          <th>Azure</th>
          <th>AWS</th>
          <th>Private</th>
          <th>Tags</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- SKU Modal -->
  <div class="modal fade" id="skuModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Select a Matching SKU</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <select id="providerSelect" class="form-select mb-3">
            <option value="Azure">Azure</option>
            <option value="AWS">AWS</option>
          </select>
          <div class="row mb-3">
            <div class="col">
              <input type="text" id="filterName" class="form-control" placeholder="Filter by name">
            </div>
            <div class="col">
              <input type="text" id="filterCPU" class="form-control" placeholder="Min CPUs">
            </div>
            <div class="col">
              <input type="text" id="filterRAM" class="form-control" placeholder="RAM (GB)">
            </div>
            <div class="col">
              <input type="text" id="filterStorage" class="form-control" placeholder="Storage (GB)">
            </div>
          </div>
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Name</th>
                <th>CPUs</th>
                <th>RAM</th>
                <th>Storage</th>
                <th>Price</th>
                <th>Select</th>
              </tr>
            </thead>
            <tbody id="skuTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Tag Modal -->
  <div class="modal fade" id="tagModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Assign SQL Tag</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <select id="sqlTagSelect" class="form-select">
            <option value="SQL-Std">SQL Standard</option>
            <option value="SQL-Ent">SQL Enterprise</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="applySQLTag()">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    let azureVMPricing = [];
    let azureDiskPricing = { "Standard SSD": [], "Premium SSD": [] };
    let awsVMPricing = [];
    let awsDiskPricing = { "General Purpose SSD (gp3)": [], "Provisioned IOPS SSD (io2)": [] };
    let privateCloudPricing = [];
    let lastVmData = [];
    let matchedSkus = [];
    let matchedAwsSkus = [];
    let selectedRow = null;
    let currency = 'A$';
    const StorageModule = {
      storageUnit: 'GB',
      tuningParameters: { storageMatchToleranceMB: 0 },
      convertToGiB: function(value, unit) {
        if (unit === 'MB') return value / 1024;
        return value;
      },
      filterStorageSKUs: function(input) {
        if (!input) return { storageInMB: 0 };
        const trimmed = input.trim().toLowerCase();
        let value = parseFloat(trimmed);
        let unit = 'GB';
        if (trimmed.includes('gb')) {
          unit = 'GB';
          value = parseFloat(trimmed.replace('gb', '').trim());
        } else if (trimmed.includes('mb')) {
          unit = 'MB';
          value = parseFloat(trimmed.replace('mb', '').trim());
        }
        return { storageInMB: this.convertToGiB(value, unit) * 1024 };
      },
      calculateAzureStorageCost: function(storage, diskType = 'Standard SSD') {
        const storageGiB = this.convertToGiB(parseFloat(storage) || 0, this.storageUnit);
        if (storageGiB <= 0) return 0;

        const diskArray = azureDiskPricing[diskType] || [];
        if (!diskArray.length) {
          console.warn(`No disks available in azureDiskPricing[${diskType}]`);
          return 0;
        }

        // Sort disks by size (ascending) to prioritize smaller disks
        const sortedDisks = diskArray.sort((a, b) => a.sizeGiB - b.sizeGiB);

        // Find the smallest combination of disks to meet or exceed storageGiB
        let remainingStorage = storageGiB;
        let totalCost = 0;
        const selectedDisks = [];

        while (remainingStorage > 0) {
          const disk = sortedDisks.find(d => d.sizeGiB >= remainingStorage) || sortedDisks[sortedDisks.length - 1];
          if (!disk) {
            console.warn(`No disk found in azureDiskPricing[${diskType}] for remaining ${remainingStorage} GiB`);
            return totalCost;
          }
          selectedDisks.push(disk);
          totalCost += disk.pricePerMonth;
          remainingStorage -= disk.sizeGiB;
        }

        if (selectedDisks.length === 0) {
          console.warn(`No disk combination found in azureDiskPricing[${diskType}] for ${storageGiB} GiB`);
          return 0;
        }

        console.log(`Selected disks for ${storageGiB} GiB (${diskType}):`, selectedDisks);
        return totalCost;
      },
      calculateAwsStorageCost: function(storage, awsDiskType = 'General Purpose SSD (gp3)') {
        const storageGiB = this.convertToGiB(parseFloat(storage) || 0, this.storageUnit);
        if (storageGiB <= 0) return 0;

        const diskArray = awsDiskPricing[awsDiskType] || [];
        if (!diskArray.length) {
          console.warn(`No disks available in awsDiskPricing[${awsDiskType}]`);
          return 0;
        }

        const sortedDisks = diskArray.sort((a, b) => a.sizeGiB - b.sizeGiB);

        let remainingStorage = storageGiB;
        let totalCost = 0;
        const selectedDisks = [];

        while (remainingStorage > 0) {
          const disk = sortedDisks.find(d => d.sizeGiB >= remainingStorage) || sortedDisks[sortedDisks.length - 1];
          if (!disk) {
            console.warn(`No disk found in awsDiskPricing[${awsDiskType}] for remaining ${remainingStorage} GiB`);
            return totalCost;
          }
          selectedDisks.push(disk);
          totalCost += disk.pricePerMonth;
          remainingStorage -= disk.sizeGiB;
        }

        if (selectedDisks.length === 0) {
          console.warn(`No disk combination found in awsDiskPricing[${awsDiskType}] for ${storageGiB} GiB`);
          return 0;
        }

        console.log(`Selected disks for ${storageGiB} GiB (${awsDiskType}):`, selectedDisks);
        return totalCost;
      }
    };

    async function loadAzureVMPricingFromJson() {
      try {
        const response = await fetch('./az_data-export.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load Azure VM pricing`);
        const data = await response.json();
        azureVMPricing = data.map(item => ({
          name: item.name,
          vCPUs: parseInt(item.vCPUs) || 0,
          ram: parseFloat(item.ram) || 0,
          storage: item.osDiskSizeInMB ? parseFloat(item.osDiskSizeInMB) / 1024 : 0,
          linuxPrice: parseFloat(item.linuxPrice) || 0,
          windowsPrice: parseFloat(item.windowsPrice) || 0
        }));
        console.log('Azure VM pricing loaded:', azureVMPricing);
      } catch (err) {
        console.error('Azure VM pricing load error:', err);
        alert(`Failed to load Azure VM pricing: ${err.message}. Ensure the file 'az_data-export.json' is accessible and valid.`);
        azureVMPricing = [];
      }
    }

    async function loadAzureDiskPricing() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/virtualhowto/virtualhowto.github.io/refs/heads/main/az/az_storage-pricing.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load Azure disk pricing`);
        const data = await response.json();
        azureDiskPricing = {
          "Standard SSD": data["Standard SSD"].map(item => ({
            name: item.name,
            type: "Standard SSD",
            sizeGiB: parseFloat(item.sizeGiB) || 0,
            pricePerMonth: parseFloat(item.pricePerMonth) || 0
          })),
          "Premium SSD": data["Premium SSD"].map(item => ({
            name: item.name,
            type: "Premium SSD",
            sizeGiB: parseFloat(item.sizeGiB) || 0,
            pricePerMonth: parseFloat(item.pricePerMonth) || 0
          }))
        };
        console.log('Azure disk pricing loaded:', azureDiskPricing);
      } catch (err) {
        console.error('Azure disk pricing load error:', err);
        alert(`Failed to load Azure disk pricing: ${err.message}. Using default cost of 0.`);
        azureDiskPricing = { "Standard SSD": [], "Premium SSD": [] };
      }
    }

    async function loadAwsVMPricingFromJson() {
      try {
        const response = await fetch('./aws_pricing.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load AWS VM pricing`);
        const data = await response.json();
        awsVMPricing = data.map(item => ({
          name: item.name,
          vCPUs: parseInt(item.vCPUs) || 0,
          ram: parseFloat(item.ram) || 0,
          storage: parseFloat(item.storage) || 0,
          linuxPrice: parseFloat(item.linuxPrice) || 0,
          windowsPrice: parseFloat(item.windowsPrice) || 0
        }));
        console.log('AWS VM pricing loaded:', awsVMPricing);
      } catch (err) {
        console.error('AWS VM pricing load error:', err);
        alert(`Failed to load AWS VM pricing: ${err.message}. Ensure the file 'aws_pricing.json' is accessible and valid.`);
        awsVMPricing = [];
      }
    }

    async function loadAwsDiskPricing() {
      try {
        const response = await fetch('./aws_storage-pricing.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load AWS disk pricing`);
        const data = await response.json();
        awsDiskPricing = {
          "General Purpose SSD (gp3)": data["General Purpose SSD (gp3)"].map(item => ({
            name: item.name,
            type: "General Purpose SSD (gp3)",
            sizeGiB: parseFloat(item.sizeGiB) || 0,
            pricePerMonth: parseFloat(item.pricePerMonth) || 0
          })),
          "Provisioned IOPS SSD (io2)": data["Provisioned IOPS SSD (io2)"].map(item => ({
            name: item.name,
            type: "Provisioned IOPS SSD (io2)",
            sizeGiB: parseFloat(item.sizeGiB) || 0,
            pricePerMonth: parseFloat(item.pricePerMonth) || 0
          }))
        };
        console.log('AWS disk pricing loaded:', awsDiskPricing);
      } catch (err) {
        console.error('AWS disk pricing load error:', err);
        alert(`Failed to load AWS disk pricing: ${err.message}. Using default cost of 0.`);
        awsDiskPricing = { "General Purpose SSD (gp3)": [], "Provisioned IOPS SSD (io2)": [] };
      }
    }

    async function loadPrivateCloudPricing() {
      try {
        const response = await fetch('./private_cloud_pricing.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load Private Cloud pricing`);
        privateCloudPricing = await response.json();
        console.log('Private Cloud pricing loaded:', privateCloudPricing);
      } catch (err) {
        console.error('Private Cloud pricing load error:', err);
        alert(`Failed to load Private Cloud pricing: ${err.message}. Using default cost of 0.`);
        privateCloudPricing = [];
      }
    }

    function calculateSqlLicenseCost(numCPUs, licenseType) {
      const costPerCore = licenseType === 'SQL-Ent' ? 500 : licenseType === 'SQL-Std' ? 200 : 0;
      return costPerCore * (parseInt(numCPUs) || 0);
    }

    function calculateAzureVMPrice(index) {
      const vm = lastVmData[index];
      const sku = matchedSkus[index] || vm.manualSku;
      const storage = parseFloat(vm['Provisioned Storage (GB)'] || 0);
      const diskType = vm.diskType || 'Standard SSD';
      const sqlCost = vm.sqlLicensed ? calculateSqlLicenseCost(vm['Num CPU'], vm.sqlLicenseType) : 0;
      const storageCost = StorageModule.calculateAzureStorageCost(storage, diskType);
      const os = (vm['OS'] || vm['Guest OS'] || '').toLowerCase().includes('windows') ? 'Windows' : 'Linux';
      const baseCost = sku ? (os === 'Windows' ? sku.windowsPrice : sku.linuxPrice) : 0;
      const total = baseCost + storageCost + sqlCost;
      return { total, base: baseCost, storage: storageCost, sql: sqlCost };
    }

    function calculateAwsVMPrice(index) {
      const vm = lastVmData[index];
      const sku = matchedAwsSkus[index] || vm.manualAwsSku;
      const storage = parseFloat(vm['Provisioned Storage (GB)'] || 0);
      const awsDiskType = vm.awsDiskType || 'General Purpose SSD (gp3)';
      const sqlCost = vm.sqlLicensed ? calculateSqlLicenseCost(vm['Num CPU'], vm.sqlLicenseType) : 0;
      const storageCost = StorageModule.calculateAwsStorageCost(storage, awsDiskType);
      const os = (vm['OS'] || vm['Guest OS'] || '').toLowerCase().includes('windows') ? 'Windows' : 'Linux';
      const baseCost = sku ? (os === 'Windows' ? sku.windowsPrice : sku.linuxPrice) : 0;
      const total = baseCost + storageCost + sqlCost;
      return { total, base: baseCost, storage: storageCost, sql: sqlCost };
    }

    function calculatePrivateCloudPrice(index) {
      const vm = lastVmData[index];
      const cpu = parseInt(vm['Num CPU'] || vm['CPUs'] || 0);
      const ram = parseFloat(vm['Memory'] || 0);
      const storage = parseFloat(vm['Provisioned Storage (GB)'] || 0);
      const sqlCost = vm.sqlLicensed ? calculateSqlLicenseCost(vm['Num CPU'], vm.sqlLicenseType) : 0;
      return (cpu * 100 + ram * 50 + storage * 0.1 + sqlCost) || 0;
    }

    function openSkuPopup(index, provider = 'Azure') {
      selectedRow = index;
      lastVmData[index].provider = provider;
      const vm = lastVmData[index];
      const vmName = vm['Display Name'] || vm['VM'] || 'Unnamed';
      const cpu = parseInt(vm['Num CPU'] || vm['CPUs'] || 0);
      const ram = parseFloat(vm['Memory'] || 0);
      const storage = parseFloat(vm['Provisioned Storage (GB)'] || 0);
      const modalTitle = document.querySelector('#skuModal .modal-title');
      modalTitle.textContent = `Select a Matching SKU (VM: ${vmName}, CPU: ${cpu}, RAM: ${ram.toFixed(1)} GB, Storage: ${storage.toFixed(1)} ${StorageModule.storageUnit})`;
      
      const providerSelect = document.querySelector('#providerSelect');
      providerSelect.value = provider;
      providerSelect.onchange = () => {
        lastVmData[index].provider = providerSelect.value;
        filterSKUs();
      };

      document.getElementById('filterName').value = '';
      document.getElementById('filterCPU').value = '';
      document.getElementById('filterRAM').value = '';
      document.getElementById('filterStorage').value = '';
      
      filterSKUs();
      new bootstrap.Modal(document.getElementById('skuModal')).show();
    }

    function selectSkuByName(name, provider) {
      const selectedSku = (provider === 'Azure' ? azureVMPricing : awsVMPricing).find(s => s.name === name);
      if (selectedSku && selectedRow !== null) {
        if (provider === 'Azure') {
          matchedSkus[selectedRow] = selectedSku;
          lastVmData[selectedRow].manualSku = selectedSku;
        } else {
          matchedAwsSkus[selectedRow] = selectedSku;
          lastVmData[selectedRow].manualAwsSku = selectedSku;
        }
        renderVMTable(lastVmData);
        updateSummary();
        bootstrap.Modal.getInstance(document.getElementById('skuModal')).hide();
      }
    }

    function filterSKUs() {
      if (selectedRow === null) return;
      const vm = lastVmData[selectedRow];
      const provider = vm.provider || 'Azure';
      const diskType = vm.diskType || 'Standard SSD';
      const awsDiskType = vm.awsDiskType || 'General Purpose SSD (gp3)';
      const os = vm['OS']?.toLowerCase().includes('windows') ? 'Windows' : 'Linux';

      const name = document.getElementById('filterName')?.value.toLowerCase() || '';
      const cpuInput = document.getElementById('filterCPU')?.value || '';
      const ramInput = document.getElementById('filterRAM')?.value || '';
      const storageInput = document.getElementById('filterStorage')?.value || '';

      const cpuValue = parseInt(cpuInput) || 0;
      let ramValue = 0;
      let ramUnit = 'GB';
      if (ramInput) {
        const trimmedRam = ramInput.trim().toLowerCase();
        if (trimmedRam.includes('gb')) {
          ramUnit = 'GB';
          ramValue = parseFloat(trimmedRam.replace('gb', '').trim());
        } else if (trimmedRam.includes('mb')) {
          ramUnit = 'MB';
          ramValue = parseFloat(trimmedRam.replace('mb', '').trim()) / 1024;
        } else {
          ramValue = parseFloat(trimmedRam);
          if (!isNaN(ramValue)) ramUnit = 'GB';
        }
      }

      const { storageInMB } = StorageModule.filterStorageSKUs(storageInput);
      const pricingData = provider === 'Azure' ? azureVMPricing : awsVMPricing;
      const diskPricing = provider === 'Azure' ? azureDiskPricing : awsDiskPricing;
      const calculateStorageCost = provider === 'Azure' ? StorageModule.calculateAzureStorageCost : StorageModule.calculateAwsStorageCost;
      const selectedDiskType = provider === 'Azure' ? diskType : awsDiskType;

      let filtered = pricingData.filter(sku => {
        const storageMatch = !storageInput || 
          Math.abs((sku.storage * 1024) - storageInMB) <= StorageModule.tuningParameters.storageMatchToleranceMB;
        return (
          (!name || sku.name.toLowerCase().includes(name)) &&
          (!cpuInput || sku.vCPUs >= cpuValue) &&
          (!ramInput || Math.abs(sku.ram - ramValue) <= 0.01) &&
          storageMatch
        );
      });

      filtered = filtered.map(sku => {
        const vmPrice = os === 'Windows' ? sku.windowsPrice : sku.linuxPrice;
        const storageCost = calculateStorageCost(
          vm['Provisioned Storage (GB)'] || 0,
          selectedDiskType
        );
        return { sku, totalCost: vmPrice + storageCost };
      }).sort((a, b) => a.totalCost - b.totalCost).map(item => item.sku);

      const tbody = document.getElementById('skuTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';
      filtered.forEach(s => {
        const vmPrice = os === 'Windows' ? s.windowsPrice : s.linuxPrice;
        const storageCost = calculateStorageCost(
          vm['Provisioned Storage (GB)'] || 0,
          selectedDiskType
        );
        const totalPrice = vmPrice + storageCost;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${s.name}</td>
          <td>${s.vCPUs}</td>
          <td>${s.ram.toFixed(1)} GB</td>
          <td>${s.storage.toFixed(1)} GB</td>
          <td>A$${totalPrice.toFixed(2)}</td>
          <td><button class="btn btn-sm btn-success" onclick="selectSkuByName('${s.name.replace(/'/g, '')}', '${provider}')">✔</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function assignSQLTag(index) {
      selectedRow = index;
      new bootstrap.Modal(document.getElementById('tagModal')).show();
    }

    function applySQLTag() {
      if (selectedRow !== null) {
        const sqlTag = document.getElementById('sqlTagSelect').value;
        lastVmData[selectedRow].sqlLicensed = true;
        lastVmData[selectedRow].sqlLicenseType = sqlTag;
        renderVMTable(lastVmData);
        updateSummary();
        bootstrap.Modal.getInstance(document.getElementById('tagModal')).hide();
      }
    }

    function clearSQLTag(index) {
      lastVmData[index].sqlLicensed = false;
      lastVmData[index].sqlLicenseType = null;
      renderVMTable(lastVmData);
      updateSummary();
    }

    function renderVMTable(vmData) {
      if (!vmData || !vmData.length) return;
      const tbody = document.querySelector('#vmTable tbody');
      tbody.innerHTML = '';
      vmData.forEach((vm, index) => {
        const cpu = parseInt(vm['Num CPU'] || vm['CPUs'] || 0);
        const ram = parseFloat(vm['Memory'] || 0);
        const storage = parseFloat(vm['Provisioned Storage (GB)'] || 0);
        const os = (vm['OS'] || vm['Guest OS'] || '').includes('Windows') ? 'Windows' : 'Linux';
        const azureSku = matchedSkus[index] || vm.manualSku;
        const awsSku = matchedAwsSkus[index] || vm.manualAwsSku;
        const azureCostBreakdown = calculateAzureVMPrice(index);
        const awsCostBreakdown = calculateAwsVMPrice(index);
        const privatePrice = calculatePrivateCloudPrice(index);

        const azureTooltip = azureSku
          ? `Currency: ${currency}\nAZ_SKU: ${azureSku.name}\nCPUs: ${azureSku.vCPUs}\nRAM: ${azureSku.ram.toFixed(1)} GB\nStorage: ${azureSku.storage.toFixed(1)} GB\nBase VM Cost: ${currency}${azureCostBreakdown.base.toFixed(2)}\nStorage (${vm.diskType || 'Standard SSD'}): ${currency}${azureCostBreakdown.storage.toFixed(2)} (${storage} ${StorageModule.storageUnit})\n${azureCostBreakdown.sql ? `SQL License (${vm.sqlLicenseType}): ${currency}${azureCostBreakdown.sql.toFixed(2)}\n` : ''}Total: ${currency}${azureCostBreakdown.total.toFixed(2)}`
          : 'No AZ_SKU selected';
        const awsTooltip = awsSku
          ? `Currency: ${currency}\nAWS_SKU: ${awsSku.name}\nCPUs: ${awsSku.vCPUs}\nRAM: ${awsSku.ram.toFixed(1)} GB\nStorage: ${awsSku.storage.toFixed(1)} GB\nBase VM Cost: ${currency}${awsCostBreakdown.base.toFixed(2)}\nStorage (${vm.awsDiskType || 'General Purpose SSD (gp3)'}): ${currency}${awsCostBreakdown.storage.toFixed(2)} (${storage} ${StorageModule.storageUnit})\n${awsCostBreakdown.sql ? `SQL License (${vm.sqlLicenseType}): ${currency}${awsCostBreakdown.sql.toFixed(2)}\n` : ''}Total: ${currency}${awsCostBreakdown.total.toFixed(2)}`
          : 'No AWS_SKU selected';
        const privateTooltip = `Currency: ${currency}\nCPUs: ${cpu}\nRAM: ${ram.toFixed(1)} GB\nStorage: ${storage.toFixed(2)} ${StorageModule.storageUnit}\n${vm.sqlLicensed ? `SQL License (${vm.sqlLicenseType}): ${currency}${calculateSqlLicenseCost(vm['Num CPU'], vm.sqlLicenseType).toFixed(2)}\n` : ''}Total: ${currency}${privatePrice.toFixed(2)}`;

        const tr = document.createElement('tr');
        tr.title = `Azure: A$${azureCostBreakdown.total.toFixed(2)}\nAWS: A$${awsCostBreakdown.total.toFixed(2)}\nPrivate: A$${privatePrice.toFixed(2)}`;
        if (!azureSku || !awsSku) tr.classList.add('table-danger');

        tr.innerHTML = `
          <td>${vm['Display Name'] || vm['VM'] || 'Unnamed'}</td>
          <td>${cpu}</td>
          <td>${ram.toFixed(1)} GB</td>
          <td>${storage.toFixed(2)} ${StorageModule.storageUnit}</td>
          <td>${os}</td>
          <td>${azureSku ? azureSku.name : '<em>No Match</em>'}<button class="btn btn-sm btn-warning ms-2" onclick="openSkuPopup(${index}, 'Azure')">Adj</button></td>
          <td>${awsSku ? awsSku.name : '<em>No Match</em>'}<button class="btn btn-sm btn-warning ms-2" onclick="openSkuPopup(${index}, 'AWS')">Adj</button></td>
          <td>
            <select class="form-select form-select-sm" onchange="lastVmData[${index}].diskType = this.value.split('|')[0]; lastVmData[${index}].awsDiskType = this.value.split('|')[1]; renderVMTable(lastVmData); updateSummary();">
              <option value="Standard SSD|General Purpose SSD (gp3)" ${vm.diskType === 'Standard SSD' ? 'selected' : ''}>Standard SSD (AWS: gp3)</option>
              <option value="Premium SSD|Provisioned IOPS SSD (io2)" ${vm.diskType === 'Premium SSD' ? 'selected' : ''}>Premium SSD (AWS: io2)</option>
            </select>
          </td>
          <td data-bs-toggle="tooltip" data-bs-placement="top" title="${azureTooltip}">A$${azureCostBreakdown.total.toFixed(2)}</td>
          <td data-bs-toggle="tooltip" data-bs-placement="top" title="${awsTooltip}">A$${awsCostBreakdown.total.toFixed(2)}</td>
          <td data-bs-toggle="tooltip" data-bs-placement="top" title="${privateTooltip}">A$${privatePrice.toFixed(2)}</td>
          <td>
            ${vm.sqlLicenseType 
              ? `<span class="badge bg-success">${vm.sqlLicenseType}<span style="cursor:pointer;" onclick="clearSQLTag(${index})"> ×</span></span><button class="btn btn-sm btn-outline-primary ms-1" onclick="assignSQLTag(${index})">+</button>`
              : `<button class="btn btn-sm btn-outline-primary" onclick="assignSQLTag(${index})">+</button>`
            }
          </td>
        `;
        tbody.appendChild(tr);
      });

      initializeTooltips();
    }

    function updateSummary() {
      const azureTotal = lastVmData.reduce((sum, _, i) => sum + calculateAzureVMPrice(i).total, 0);
      const awsTotal = lastVmData.reduce((sum, _, i) => sum + calculateAwsVMPrice(i).total, 0);
      const privateTotal = lastVmData.reduce((sum, _, i) => sum + calculatePrivateCloudPrice(i), 0);
      document.getElementById('totalPrice').innerText = `A$${azureTotal.toFixed(2)}`;
      document.getElementById('awsTotalPrice').innerText = `A$${awsTotal.toFixed(2)}`;
      document.getElementById('ataPrice').innerText = `A$${privateTotal.toFixed(2)}`;
    }

    function escapeCsvValue(value) {
      if (!value) return '';
      return `"${value.toString().replace(/"/g, '""')}"`;
    }

    function downloadCsv() {
      const rows = [['VM Name', 'CPU', 'RAM', 'Storage', 'OS', 'AZ_SKU', 'AWS_SKU', 'Storage Tier', 'Azure Cost (A$)', 'Azure Storage Cost (A$)', 'AWS Cost (A$)', 'AWS Storage Cost (A$)', 'Private Cloud Cost (A$)', 'Tag']];
      lastVmData.forEach((vm, i) => {
        const azureCostBreakdown = calculateAzureVMPrice(i);
        const awsCostBreakdown = calculateAwsVMPrice(i);
        rows.push([
          escapeCsvValue(vm['Display Name'] || vm['VM'] || 'Unnamed'),
          vm['Num CPU'] || vm['CPUs'] || '',
          vm['Memory'] || '',
          `${vm['Provisioned Storage (GB)'] || ''} ${StorageModule.storageUnit}`,
          (vm['OS'] || vm['Guest OS'] || '').includes('Windows') ? 'Windows' : 'Linux',
          escapeCsvValue(matchedSkus[i]?.name || 'No Match'),
          escapeCsvValue(matchedAwsSkus[i]?.name || 'No Match'),
          `${vm.diskType || 'Standard SSD'} (AWS: ${vm.awsDiskType || 'General Purpose SSD (gp3)'})`,
          `A$${azureCostBreakdown.total.toFixed(2)}`,
          `A$${azureCostBreakdown.storage.toFixed(2)}`,
          `A$${awsCostBreakdown.total.toFixed(2)}`,
          `A$${awsCostBreakdown.storage.toFixed(2)}`,
          `A$${calculatePrivateCloudPrice(i).toFixed(2)}`,
          escapeCsvValue(vm.sqlLicenseType || '')
        ]);
      });
      const csvContent = rows.map(row => row.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'vm_pricing.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportCSV(type) {
      const headers = ['VM Name', 'CPU', 'RAM', 'Storage', 'OS', 'AZ_SKU', 'AWS_SKU', 'Storage Tier', type === 'azure' ? 'Azure Cost (A$)' : type === 'aws' ? 'AWS Cost (A$)' : 'Private Cloud Cost (A$)', 'Tag'];
      const rows = [headers];
      lastVmData.forEach((vm, i) => {
        const azureCostBreakdown = calculateAzureVMPrice(i);
        const awsCostBreakdown = calculateAwsVMPrice(i);
        const privatePrice = calculatePrivateCloudPrice(i);
        rows.push([
          escapeCsvValue(vm['Display Name'] || vm['VM'] || 'Unnamed'),
          vm['Num CPU'] || vm['CPUs'] || '',
          vm['Memory'] || '',
          `${vm['Provisioned Storage (GB)'] || ''} ${StorageModule.storageUnit}`,
          (vm['OS'] || vm['Guest OS'] || '').includes('Windows') ? 'Windows' : 'Linux',
          escapeCsvValue(matchedSkus[i]?.name || 'No Match'),
          escapeCsvValue(matchedAwsSkus[i]?.name || 'No Match'),
          `${vm.diskType || 'Standard SSD'} (AWS: ${vm.awsDiskType || 'General Purpose SSD (gp3)'})`,
          type === 'azure' ? `A$${azureCostBreakdown.total.toFixed(2)}` : type === 'aws' ? `A$${awsCostBreakdown.total.toFixed(2)}` : `A$${privatePrice.toFixed(2)}`,
          escapeCsvValue(vm.sqlLicenseType || '')
        ]);
      });
      const csvContent = rows.map(row => row.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `vm_pricing_${type}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function initializeTooltips() {
      const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.forEach(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      initializeTooltips();
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          lastVmData = results.data.map(vm => ({
            ...vm,
            diskType: 'Standard SSD',
            awsDiskType: 'General Purpose SSD (gp3)',
            provider: 'Azure',
            manualSku: null,
            manualAwsSku: null,
            sqlLicensed: false,
            sqlLicenseType: null
          }));
          matchedSkus = new Array(lastVmData.length).fill(null);
          matchedAwsSkus = new Array(lastVmData.length).fill(null);
          renderVMTable(lastVmData);
          updateSummary();
        }
      });
    });

    window.onload = async () => {
      await loadAzureVMPricingFromJson();
      await loadAzureDiskPricing();
      await loadAwsVMPricingFromJson();
      await loadAwsDiskPricing();
      await loadPrivateCloudPricing();
      initializeTooltips();
    };
  </script>
</body>
</html>
