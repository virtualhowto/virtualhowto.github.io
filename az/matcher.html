<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>RVTools Matcher</title> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" /> <style> body { padding-top: 5.5rem; } .highlight { background-color: #d1e7dd; } .no-match { background-color: #f8d7da; } #spinner { display: none; } .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1055; } .modal-dialog-scrollable { max-height: 90vh; } .filter-input { width: 100%; padding: 0.25rem; margin-bottom: 0.5rem; } .sticky-header { position: fixed; top: 0; width: 100%; z-index: 1020; background: #fff; padding: .75rem 1rem; box-shadow: 0 2px 2px rgba(0,0,0,0.1); } .summary-tile { display: inline-block; padding: 0.5rem 1rem; border-radius: 0.5rem; color: #fff; margin-right: 1rem; min-width: 200px; text-align: center; font-weight: 500; cursor: pointer; } .azure-tile { background-color: #0072C6; } .privatecloud-tile { background-color: #00a19b; } .tooltip-inner { max-width: 350px; text-align: left; white-space: pre-wrap; font-size: 0.875rem; line-height: 1.4; } </style> </head> <body class="bg-light"> <div class="sticky-header d-flex justify-content-between align-items-center"> <h4 class="mb-0">RVTools Matcher</h4> <div> <span class="summary-tile azure-tile" onclick="exportCSV('azure')" title="Click to export detailed Azure pricing breakdown">Azure Total: <strong id="totalPrice">$0.00</strong></span> <span class="summary-tile privatecloud-tile" onclick="exportCSV('private')" title="Click to export detailed Private Cloud pricing breakdown">Private Cloud: <strong id="ataPrice">$0.00</strong></span> </div> </div> <div class="container mt-4"> <input type="file" id="fileInput" class="form-control mb-3" accept=".xlsx" /> <div id="spinner" class="text-center my-3"> <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div> <p>Processing...</p> </div> <table class="table table-bordered" id="vmTable"> <thead><tr><th>VM</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>SKU</th><th>Azure</th><th>Private</th></tr></thead> <tbody></tbody> </table> </div> <div class="modal fade" id="skuModal" tabindex="-1" aria-hidden="true"> <div class="modal-dialog modal-xl modal-dialog-scrollable"> <div class="modal-content"> <div class="modal-header"><h5 class="modal-title">Select a Matching SKU</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div> <div class="modal-body"> <div class="row mb-2"> <div class="col"><input class="form-control filter-input" id="filterName" placeholder="Filter by Name"></div> <div class="col"><input class="form-control filter-input" id="filterCPU" placeholder="Filter by CPU"></div> <div class="col"><input class="form-control filter-input" id="filterRAM" placeholder="Filter by RAM"></div> </div> <table class="table table-sm table-striped"> <thead><tr><th>Name</th><th>CPU</th><th>RAM</th><th>Storage</th><th>Linux Price</th><th>Select</th></tr></thead> <tbody id="skuTableBody"></tbody> </table> </div> </div> </div> </div> <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <script> let fullCatalog = [], ataPricing = {}, selectedRow = null, lastVmData = [], matchedSkus = []; const octopusFeePerWindowsVM = 20; fetch('./az_data-export.json').then(r => r.json()).then(data => { fullCatalog = data.map(d => ({ name: d.name, cpu: d.numberOfCores, ram: d.memoryInMB, storage: d.osDiskSizeInMB || 0, priceLinux: parseFloat(d.linuxPrice) || 0, priceWindows: parseFloat(d.windowsPrice) || 0 })); }); fetch('./cld-pricing.json').then(r => r.json()).then(data => { ataPricing = data; }); document.getElementById('fileInput').addEventListener('change', e => { if (e.target.files.length) readXlsx(e.target.files[0]); }); function readXlsx(file) { document.getElementById('spinner').style.display = 'block'; const reader = new FileReader(); reader.onload = e => { const data = new Uint8Array(e.target.result); const wb = XLSX.read(data, { type: 'array' }); const sheetName = wb.SheetNames.includes('vInfo') ? 'vInfo' : wb.SheetNames[0]; try { const vmData = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]); document.getElementById('spinner').style.display = 'none'; if (!vmData.length) return alert('No data found'); lastVmData = vmData; renderVMTable(vmData); } catch (err) { document.getElementById('spinner').style.display = 'none'; alert('XLSX parsing failed'); } }; reader.readAsArrayBuffer(file); } function renderVMTable(vmData) { const tbody = document.querySelector('#vmTable tbody'); tbody.innerHTML = ''; matchedSkus = []; vmData.forEach((vm, i) => { const cpu = +vm['CPUs'] || 0; const ram = +vm['Memory'] || 0; const storage = +vm['Provisioned Storage (GB)'] || 0; const os = (vm['OS according to the configuration file'] || '').toLowerCase(); const matches = fullCatalog.filter(s => Math.abs(s.cpu - cpu) <= 1 && Math.abs(s.ram - ram) <= 2048); const best = matches.sort((a, b) => (Math.abs(a.cpu - cpu) + Math.abs(a.ram - ram)) - (Math.abs(b.cpu - cpu) + Math.abs(b.ram - ram)))[0] || {}; matchedSkus[i] = best; const azurePrice = os.includes('win') ? best.priceWindows : best.priceLinux; const azureStorageCost = calculateAzureStorageCost(storage); const totalAzure = (azurePrice + azureStorageCost).toFixed(2); const ataPrice = ( (cpu * ataPricing.unitCPU) + (ram * ataPricing.unitRAM) + (storage * ataPricing.unitStorage) + (os.includes('win') ? octopusFeePerWindowsVM : 0) ).toFixed(2); const row = document.createElement('tr'); row.innerHTML = ` <td>${vm['VM']}</td> <td>${cpu}</td> <td>${ram}</td> <td>${storage}</td> <td>${os}</td> <td><span class="text-primary" style="cursor:pointer" onclick="openSkuPopup(${i})">${best.name || 'Select SKU'}</span></td> <td title="VM: $${azurePrice.toFixed(2)} + Storage: $${azureStorageCost.toFixed(2)}">$${totalAzure}</td> <td title="CPU: ${cpu} x $${ataPricing.unitCPU} + RAM: ${ram} x $${ataPricing.unitRAM} + Storage: ${storage} x $${ataPricing.unitStorage}${os.includes('win') ? ' + Octopus: $20' : ''}">$${ataPrice}</td> `; tbody.appendChild(row); }); updateSummary(); } function calculateAzureStorageCost(storageGB) { const unitPrice = 0.30; if (storageGB <= 128) return 128 * unitPrice; if (storageGB <= 512) return 512 * unitPrice; if (storageGB <= 1024) return 1024 * unitPrice; return Math.ceil(storageGB / 1024) * 1024 * unitPrice; } function updateSummary() { let azureTotal = 0; document.querySelectorAll('#vmTable tbody tr').forEach(row => { const priceCell = row.children[6]; if (priceCell && priceCell.textContent.includes('$')) { azureTotal += parseFloat(priceCell.textContent.replace('$', '')) || 0; } }); const privateTotal = lastVmData.reduce((sum, vm, i) => { const cpu = +vm['CPUs'] || 0; const ram = +vm['Memory'] || 0; const storage = +vm['Provisioned Storage (GB)'] || 0; const os = (vm['OS according to the configuration file'] || '').toLowerCase(); const octopus = os.includes('win') ? octopusFeePerWindowsVM : 0; return sum + ((cpu * ataPricing.unitCPU) + (ram * ataPricing.unitRAM) + (storage * ataPricing.unitStorage) + octopus); }, 0); document.getElementById('totalPrice').innerText = `$${azureTotal.toFixed(2)}`; document.getElementById('ataPrice').innerText = `$${privateTotal.toFixed(2)}`; } function openSkuPopup(idx) { selectedRow = idx; const cpu = +lastVmData[idx]['CPUs']; const ram = +lastVmData[idx]['Memory']; const sorted = [...fullCatalog].sort((a, b) => (Math.abs(a.cpu - cpu) + Math.abs(a.ram - ram)) - (Math.abs(b.cpu - cpu) + Math.abs(b.ram - ram)) ); document.getElementById('skuTableBody').innerHTML = sorted.map((s, i) => ` <tr> <td>${s.name}</td> <td>${s.cpu}</td> <td>${s.ram}</td> <td>${s.storage}</td> <td>$${s.priceLinux.toFixed(2)}</td> <td><button class="btn btn-sm btn-success" onclick="selectSku(${i})">✔</button></td> </tr> `).join(''); new bootstrap.Modal(document.getElementById('skuModal')).show(); } function selectSku(idx) { matchedSkus[selectedRow] = fullCatalog[idx]; renderVMTable(lastVmData); bootstrap.Modal.getInstance(document.getElementById('skuModal')).hide(); } function exportCSV(type) { let csv = 'VM,CPU,RAM,Storage,OS,SKU,Azure VM Cost,Azure Storage,Azure Total,Private Cost\n'; lastVmData.forEach((vm, i) => { const cpu = +vm['CPUs'] || 0; const ram = +vm['Memory'] || 0; const storage = +vm['Provisioned Storage (GB)'] || 0; const os = (vm['OS according to the configuration file'] || '').toLowerCase(); const sku = matchedSkus[i]?.name || ''; const azurePrice = os.includes('win') ? matchedSkus[i]?.priceWindows || 0 : matchedSkus[i]?.priceLinux || 0; const azureStoragePrice = calculateAzureStorageCost(storage); const totalAzure = (azurePrice + azureStoragePrice).toFixed(2); const ataPrice = ((cpu * ataPricing.unitCPU) + (ram * ataPricing.unitRAM) + (storage * ataPricing.unitStorage) + (os.includes('win') ? 20 : 0)).toFixed(2); csv += `"${vm['VM']}",${cpu},${ram},${storage},${os},"${sku}",$${azurePrice.toFixed(2)},$${azureStoragePrice.toFixed(2)},$${totalAzure},$${ataPrice}\n`; }); const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = type + '_summary.csv'; link.click(); } </script> </body> </html>
