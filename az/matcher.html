
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RVTools Matcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    .dark-mode {
  background-color: #121212;
  color: #f1f1f1;
}

.dark-mode .table,
.dark-mode .modal-content {
  background-color: #1e1e1e;
  color: #eee;
}

.dark-mode .summary-tile {
  opacity: 0.9;
}

@media (max-width: 768px) {
  .table thead th:nth-child(3),
  .table tbody td:nth-child(3),
  .table thead th:nth-child(4),
  .table tbody td:nth-child(4),
  .table thead th:nth-child(5),
  .table tbody td:nth-child(5) {
    display: none;
  }

  .sticky-header h4 {
    font-size: 1.1rem;
  }

  .summary-tile {
    font-size: 0.85rem;
    min-width: 130px;
    margin-bottom: 0.5rem;
  }
}
    
    body { padding-top: 5.5rem; }
    .highlight { background-color: #d1e7dd; }
    .no-match { background-color: #f8d7da; }
    #spinner { display: none; }
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1055; }
    .modal-dialog-scrollable { max-height: 90vh; }
    .filter-input { width: 100%; padding: 0.25rem; margin-bottom: 0.5rem; }
    .sticky-header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1020;
      background: #fff;
      padding: .75rem 1rem;
      box-shadow: 0 2px 2px rgba(0, 0, 0, 0.1);
    }
    .summary-tile {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      color: #fff;
      margin-right: 1rem;
      min-width: 200px;
      text-align: center;
      font-weight: 500;
      cursor: pointer;
    }
    .azure-tile { background-color: #0072C6; }
    .privatecloud-tile { background-color: #00a19b; }
    .tooltip-inner {
      max-width: 350px;
      text-align: left;
      white-space: pre-wrap;
      font-size: 0.875rem;
      line-height: 1.4;
    }
  </style>
</head>
<body class="bg-light">
  <div class="sticky-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">RVTools Matcher</h4>
    <div>
      <span class="summary-tile azure-tile" onclick="exportCSV('azure')" title="Click to export detailed Azure pricing breakdown">
        Azure Total: <strong id="totalPrice">$0.00</strong>
      </span>
      <span class="summary-tile privatecloud-tile" onclick="exportCSV('private')" title="Click to export detailed Private Cloud pricing breakdown">
        Private Cloud: <strong id="ataPrice">$0.00</strong>
      </span>
    </div>
    <button class="btn btn-outline-dark btn-sm me-2" onclick="toggleDarkMode()" title="Toggle Dark Mode">
  🌓
</button>
  </div>

  <div class="container mt-4">
    <input type="file" id="fileInput" class="form-control mb-3" accept=".xlsx" />
    <div id="spinner" class="text-center my-3">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
      <p>Processing...</p>
    </div>

    <table class="table table-bordered" id="vmTable">
      <thead>
        <tr>
          <th>VM</th><th>CPU</th><th>RAM</th><th>Storage</th><th>OS</th><th>SKU</th><th>Azure</th><th>Private</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="modal fade" id="skuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Select a Matching SKU</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row mb-2">
            <div class="col"><input class="form-control filter-input" id="filterName" placeholder="Filter by Name"></div>
            <div class="col"><input class="form-control filter-input" id="filterCPU" placeholder="Filter by CPU"></div>
            <div class="col"><input class="form-control filter-input" id="filterRAM" placeholder="Filter by RAM"></div>
          </div>
          <table class="table table-sm table-striped">
            <thead><tr><th>Name</th><th>CPU</th><th>RAM</th><th>Storage</th><th>Linux Price</th><th>Select</th></tr></thead>
            <tbody id="skuTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
