<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Azure VM Matcher</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <h2>Azure VM Matcher (Excel + az_data-export.json)</h2>

  <input type="file" id="excelFile" accept=".xlsx" />
  <br><br>

  <label for="vcpuCol">Select vCPU Column:</label>
  <select id="vcpuCol"></select>

  <label for="ramCol">Select RAM Column:</label>
  <select id="ramCol"></select>
  <br><br>

  <button onclick="processFile()">Match Azure VMs</button>
  <pre id="output">Upload a file and select columns to begin...</pre>

  <script>
    let azureVMs = [];
    let detectedRows = [];

    async function loadAzureVMs() {
      const res = await fetch("az_data-export.json");
      const data = await res.json();
      return data.filter(vm =>
        vm.regionName === "Australia East" &&
        vm.linuxPrice &&
        !isNaN(vm.numberOfCores) &&
        !isNaN(vm.memoryInMB)
      );
    }

    function findBestMatch(vmList, reqVcpu, reqRamGiB) {
      let best = null;
      let minExcess = Infinity;

      for (const vm of vmList) {
        const vmCores = parseInt(vm.numberOfCores);
        const vmRamGiB = vm.memoryInMB / 1024;

        const extraCPU = vmCores - reqVcpu;
        const extraRAM = vmRamGiB - reqRamGiB;

        if (extraCPU >= 0 && extraRAM >= 0) {
          const totalExcess = extraCPU + extraRAM;
          if (totalExcess < minExcess) {
            best = { ...vm, matchCores: vmCores, matchRam: vmRamGiB.toFixed(1) };
            minExcess = totalExcess;
          }
        }
      }

      return best;
    }

    document.getElementById("excelFile").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: "array" });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      detectedRows = XLSX.utils.sheet_to_json(sheet);

      if (detectedRows.length > 0) {
        const columns = Object.keys(detectedRows[0]);
        const vcpuSelect = document.getElementById("vcpuCol");
        const ramSelect = document.getElementById("ramCol");
        vcpuSelect.innerHTML = "";
        ramSelect.innerHTML = "";

        columns.forEach(col => {
          const opt1 = document.createElement("option");
          opt1.value = col;
          opt1.text = col;
          vcpuSelect.appendChild(opt1);

          const opt2 = document.createElement("option");
          opt2.value = col;
          opt2.text = col;
          ramSelect.appendChild(opt2);
        });
      }
    });

    async function processFile() {
      const vcpuKey = document.getElementById("vcpuCol").value.trim();
      const ramKey = document.getElementById("ramCol").value.trim();
      const outputEl = document.getElementById("output");

      if (!vcpuKey || !ramKey || detectedRows.length === 0) {
        alert("Please upload a file and select columns first.");
        return;
      }

      outputEl.textContent = "Loading Azure pricing...";

      if (azureVMs.length === 0) {
        azureVMs = await loadAzureVMs();
      }

      const results = [];
      for (const row of detectedRows) {
        const vcpu = parseFloat(row[vcpuKey]);
        const ram = parseFloat(row[ramKey]); // GiB

        if (isNaN(vcpu) || isNaN(ram)) {
          results.push({ input: row, match: "Invalid vCPU or RAM" });
          continue;
        }

        const match = findBestMatch(azureVMs, vcpu, ram);
        if (match) {
          results.push({
            input: row,
            matchedSKU: match.name,
            match_vCPU: match.matchCores,
            match_RAM: `${match.matchRam} GiB`,
            linuxPriceAUD: `$${match.linuxPrice}`,
            premiumDisk: match.supportPremiumDisk || "unknown"
          });
        } else {
          results.push({ input: row, match: "No suitable match found" });
        }
      }

      outputEl.textContent = JSON.stringify(results, null, 2);
    }
  </script>
</body>
</html>
