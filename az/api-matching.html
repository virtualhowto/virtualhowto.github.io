<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Azure VM Matcher</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h2 {
      color: #0066cc;
    }

    select, input, button {
      margin: 5px;
      padding: 5px;
      font-size: 14px;
    }

    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
    }

    table, th, td {
      border: 1px solid #ccc;
    }

    th, td {
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    .match-found {
      background-color: #e8f9e9;
    }

    .no-match {
      background-color: #fbeaea;
    }
  </style>
</head>
<body>
  <h2>Azure VM Matcher (Excel + az_data-export.json)</h2>

  <input type="file" id="excelFile" accept=".xlsx" />
  <br><br>

  <label for="vcpuCol">Select vCPU Column:</label>
  <select id="vcpuCol"></select>

  <label for="ramCol">Select RAM Column:</label>
  <select id="ramCol"></select>
  <br><br>

  <button onclick="processFile()">Match Azure VMs</button>
  <div id="output">Upload a file and select columns to begin...</div>

  <script>
    let azureVMs = [];
    let detectedRows = [];

    async function loadAzureVMs() {
      const res = await fetch("az_data-export.json");
      const data = await res.json();
      return data.filter(vm =>
        vm.regionName === "Australia East" &&
        vm.linuxPrice &&
        !isNaN(vm.numberOfCores) &&
        !isNaN(vm.memoryInMB)
      );
    }

    function findBestMatch(vmList, reqVcpu, reqRamGiB) {
      let best = null;
      let minExcess = Infinity;

      for (const vm of vmList) {
        const vmCores = parseInt(vm.numberOfCores);
        const vmRamGiB = vm.memoryInMB / 1024;

        const extraCPU = vmCores - reqVcpu;
        const extraRAM = vmRamGiB - reqRamGiB;

        if (extraCPU >= 0 && extraRAM >= 0) {
          const totalExcess = extraCPU + extraRAM;
          if (totalExcess < minExcess) {
            best = { ...vm, matchCores: vmCores, matchRam: vmRamGiB.toFixed(1) };
            minExcess = totalExcess;
          }
        }
      }

      return best;
    }

    document.getElementById("excelFile").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: "array" });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      detectedRows = XLSX.utils.sheet_to_json(sheet);

      if (detectedRows.length > 0) {
        const columns = Object.keys(detectedRows[0]);
        const vcpuSelect = document.getElementById("vcpuCol");
        const ramSelect = document.getElementById("ramCol");
        vcpuSelect.innerHTML = "";
        ramSelect.innerHTML = "";

        columns.forEach(col => {
          const opt1 = document.createElement("option");
          opt1.value = col;
          opt1.text = col;
          vcpuSelect.appendChild(opt1);

          const opt2 = document.createElement("option");
          opt2.value = col;
          opt2.text = col;
          ramSelect.appendChild(opt2);
        });
      }
    });

    async function processFile() {
      const vcpuKey = document.getElementById("vcpuCol").value.trim();
      const ramKey = document.getElementById("ramCol").value.trim();
      const outputEl = document.getElementById("output");

      if (!vcpuKey || !ramKey || detectedRows.length === 0) {
        alert("Please upload a file and select columns first.");
        return;
      }

      outputEl.innerHTML = "Loading Azure pricing...";

      if (azureVMs.length === 0) {
        azureVMs = await loadAzureVMs();
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Requested vCPU</th>
              <th>Requested RAM (GiB)</th>
              <th>Matched VM</th>
              <th>Match vCPU</th>
              <th>Match RAM</th>
              <th>Linux Price (AUD)</th>
              <th>Premium Disk?</th>
            </tr>
          </thead>
          <tbody>
      `;

      detectedRows.forEach((row, index) => {
        const vcpu = parseFloat(row[vcpuKey]);
        const ram = parseFloat(row[ramKey]);
        let match = null;

        if (!isNaN(vcpu) && !isNaN(ram)) {
          match = findBestMatch(azureVMs, vcpu, ram);
        }

        if (match) {
          html += `
            <tr class="match-found">
              <td>${index + 1}</td>
              <td>${vcpu}</td>
              <td>${ram}</td>
              <td>${match.name}</td>
              <td>${match.matchCores}</td>
              <td>${match.matchRam}</td>
              <td>$${match.linuxPrice}</td>
              <td>${match.supportPremiumDisk}</td>
            </tr>
          `;
        } else {
          html += `
            <tr class="no-match">
              <td>${index + 1}</td>
              <td>${vcpu || "?"}</td>
              <td>${ram || "?"}</td>
              <td colspan="5">No suitable match found</td>
            </tr>
          `;
        }
      });

      html += "</tbody></table>";
      outputEl.innerHTML = html;
    }
  </script>
</body>
</html>
