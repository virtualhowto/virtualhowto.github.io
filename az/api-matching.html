<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Azure VM Matcher from Excel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <h2>Upload Excel & Match Azure VMs (Australia East)</h2>

  <input type="file" id="excelFile" accept=".xlsx" />
  <br><br>

  <label for="vcpuCol">Select vCPU Column:</label>
  <select id="vcpuCol"></select>

  <label for="ramCol">Select RAM Column:</label>
  <select id="ramCol"></select>

  <br><br>
  <button onclick="processFile()">Match Azure VMs</button>
  <pre id="output">Upload a file and select columns to begin...</pre>

  <script>
    let azureVMs = [];
    let detectedRows = [];

    // Fetch Azure pricing with CORS proxy (for GitHub Pages demo)
    async function fetchAzureVMs() {
      const corsProxy = "https://corsproxy.io/?";
      const baseUrl = "https://prices.azure.com/api/retail/prices";
      const filter = encodeURIComponent(
        "serviceFamily eq 'Compute' and armRegionName eq 'australiaeast' and productName contains 'Virtual Machines' and priceType eq 'Consumption'"
      );
      let nextLink = `${corsProxy}${encodeURIComponent(`${baseUrl}?$filter=${filter}`)}`;
      const results = [];

      while (nextLink && results.length < 500) {
        const res = await fetch(nextLink);
        const data = await res.json();
        results.push(...data.Items);
        nextLink = data.NextPageLink ? corsProxy + encodeURIComponent(data.NextPageLink) : null;
      }

      return results.filter(vm =>
        vm.unitOfMeasure === "1 Hour" &&
        vm.skuName.toLowerCase().includes("linux")
      );
    }

    function estimateSpecs(skuName) {
      const match = skuName.match(/(\d+)[a-z]?_?v?\d*/i);
      const vcpu = match ? parseInt(match[1]) : null;
      let ram = vcpu ? vcpu * 4 : null;
      if (skuName.toLowerCase().includes("e")) ram = vcpu * 8;
      if (skuName.toLowerCase().includes("f")) ram = vcpu * 2;
      return { vcpu, ram };
    }

    function findBestMatch(vmList, reqVcpu, reqRam) {
      let best = null;
      let minExcess = Infinity;
      for (const vm of vmList) {
        const specs = estimateSpecs(vm.armSkuName);
        if (!specs.vcpu || !specs.ram) continue;
        const extraCPU = specs.vcpu - reqVcpu;
        const extraRAM = specs.ram - reqRam;
        if (extraCPU >= 0 && extraRAM >= 0) {
          const totalExcess = extraCPU + extraRAM;
          if (totalExcess < minExcess) {
            best = { ...vm, specs };
            minExcess = totalExcess;
          }
        }
      }
      return best;
    }

    // Handle file upload and extract column headers
    document.getElementById("excelFile").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: "array" });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      detectedRows = XLSX.utils.sheet_to_json(sheet);

      if (detectedRows.length > 0) {
        const columns = Object.keys(detectedRows[0]);
        const vcpuSelect = document.getElementById("vcpuCol");
        const ramSelect = document.getElementById("ramCol");
        vcpuSelect.innerHTML = "";
        ramSelect.innerHTML = "";
        columns.forEach(col => {
          const opt1 = document.createElement("option");
          opt1.value = col;
          opt1.text = col;
          vcpuSelect.appendChild(opt1);

          const opt2 = document.createElement("option");
          opt2.value = col;
          opt2.text = col;
          ramSelect.appendChild(opt2);
        });
      }
    });

    async function processFile() {
      const vcpuKey = document.getElementById("vcpuCol").value.trim();
      const ramKey = document.getElementById("ramCol").value.trim();
      const outputEl = document.getElementById("output");

      if (!vcpuKey || !ramKey || detectedRows.length === 0) {
        alert("Please upload a file and select columns first.");
        return;
      }

      outputEl.textContent = "Fetching Azure pricing...";

      if (azureVMs.length === 0) {
        azureVMs = await fetchAzureVMs();
      }

      const results = [];
      for (const row of detectedRows) {
        const vcpu = parseFloat(row[vcpuKey]);
        const ram = parseFloat(row[ramKey]);

        if (isNaN(vcpu) || isNaN(ram)) {
          results.push({ input: row, match: "Invalid vCPU or RAM" });
          continue;
        }

        const match = findBestMatch(azureVMs, vcpu, ram);
        if (match) {
          results.push({
            input: row,
            matchedSKU: match.skuName,
            match_vCPU: match.specs.vcpu,
            match_RAM: match.specs.ram,
            price: `$${match.retailPrice.toFixed(3)} / hr`,
          });
        } else {
          results.push({ input: row, match: "No suitable match found" });
        }
      }

      outputEl.textContent = JSON.stringify(results, null, 2);
    }
  </script>
</body>
</html>
