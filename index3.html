<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMaaS - Virtual Machine as a Service</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.2/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="pricing.js"></script> <!-- External pricing -->

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #f0f4f8, #d9e4f5);
      color: #333;
    }
    header {
      background: linear-gradient(90deg, #1c3f94, #cc5500);
      color: white;
      padding: 20px 0;
      text-align: center;
      font-size: 2em;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    header button {
      float: right;
      margin-right: 20px;
      padding: 5px 10px;
      border-radius: 6px;
      background: #fff;
      color: #1c3f94;
      border: none;
      cursor: pointer;
    }
    .hero, .pricing, .container, footer { text-align: center; }
    .hero, .pricing { background: white; border-radius: 12px; margin: 30px auto; max-width: 900px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); padding: 30px; }
    .container { max-width: 1200px; margin: auto; padding: 20px; }
    .vm-table-container { overflow-x: auto; margin-top: 20px; }
    .vm-table { width: 100%; border-collapse: collapse; background: #fff; }
    .vm-table th, .vm-table td { padding: 12px; border: 1px solid #ddd; text-align: center; }
    .vm-table th { background: #1c3f94; color: white; }
    .vm-table tr:hover { background-color: #f1f9ff; }
    .vm-table tr.selected { background-color: #ffe0b2; }
    .manual-entry-form input, .manual-entry-form button, select, input[type="range"] {
      padding: 10px;
      font-size: 1em;
      margin: 5px;
      border-radius: 6px;
    }
    .actions button {
      background: #cc5500;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
    }
    .cart, footer {
      background: #1c3f94;
      color: white;
      padding: 20px;
    }
    @media print {
      body, header, footer, .cart {
        background: white !important;
        color: black !important;
        box-shadow: none !important;
      }
      .actions, .manual-entry-form, .restore-chart {
        display: none !important;
      }
    }
    body.dark-mode {
      background: #1e1e1e;
      color: #f0f0f0;
    }
    body.dark-mode header, body.dark-mode footer, body.dark-mode .cart {
      background: #2e2e2e;
      color: #f0f0f0;
    }
    body.dark-mode .pricing, body.dark-mode .hero, body.dark-mode .vm-table th, body.dark-mode .vm-table td {
      background: #333 !important;
      color: #fff !important;
    }
  </style>
</head>
<body>
  <header>
    Virtual Machine as a Service (VMaaS)
    <button onclick="document.body.classList.toggle('dark-mode')">Toggle Dark Mode</button>
  </header>

  <section class="hero">
    <h1>Scalable, Secure, and Reliable Cloud VMs</h1>
    <p>Deploy your virtual machines in minutes with flexible pricing and high performance.</p>
  </section>

  <div class="container">
    <section class="pricing">
      <h2>VM Pricing Calculator</h2>

      <label><strong>Total Bandwidth (Mbps):</strong> <span id="bandwidthValue">0</span></label>
      <input type="range" id="bandwidthRange" min="0" max="1000" value="0" step="100" list="bandwidthTicks" />
      <datalist id="bandwidthTicks">
        <option value="0" label="0 Mbps"></option>
        <option value="500" label="500"></option>
        <option value="1000" label="1000 Mbps"></option>
      </datalist>

      <br><br>

      <label><strong>Firewall Option:</strong></label>
      <select id="firewallType"></select>

      <br><br>

      <label><strong>Number of Public IPs:</strong></label>
      <select id="publicIPCount">
        <option value="0">0 (Private Only)</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="16">16</option>
      </select>

      <br><br>

      <input type="file" id="fileUpload" accept=".xlsx" />

      <div class="vm-table-container">
        <table id="vm-table" class="vm-table">
          <thead>
            <tr>
              <th>VM Name</th>
              <th>OS</th>
              <th>vCPU</th>
              <th>RAM (GB)</th>
              <th>Storage (GB)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="manual-entry-form">
        <input type="text" id="vmName" placeholder="VM Name">
        <input type="text" id="vmOS" placeholder="OS">
        <input type="number" id="vmCPU" placeholder="vCPU">
        <input type="number" step="0.01" id="vmRAM" placeholder="RAM GB">
        <input type="number" step="0.01" id="vmStorage" placeholder="Storage GB">
        <button onclick="addManualVM()">➕</button>
      </div>

      <div class="actions">
        <button onclick="exportCSV()">Export as CSV</button>
      </div>
    </section>
  </div>

  <footer>&copy; 2025 VMaaS - All Rights Reserved</footer>

  <script>
    function calculateCost(cpu, ram, storage, bandwidth, publicIPs) {
      return cpu * 10 + ram * 5 + storage * 0.1 + bandwidth * 0.5 + publicIPs * 15;
    }

    function exportCSV() {
      const rows = document.querySelectorAll(".vm-table tbody tr.selected");
      if (rows.length === 0) return alert("Please select at least one VM.");

      let csv = '';
      let totalCPU = 0, totalRAM = 0, totalStorage = 0, totalCost = 0;

      const bandwidth = parseInt(document.getElementById('bandwidthRange').value || 0);
      const publicIPs = parseInt(document.getElementById('publicIPCount').value || 0);
      const fwType = document.getElementById('firewallType').value || 'ipsec';

      const bandwidthCost = bandwidth * (FLAT_PRICING.bandwidth_mbps?.cost || 0);
      const publicIPCost = publicIPs * (FLAT_PRICING.public_ip?.cost || 0);
      const vcspCost = FLAT_PRICING.vcsp?.cost || 0;
      const msLicCost = FLAT_PRICING.microsoft_license?.corporate?.cost || 0;
      const fwCost = FLAT_PRICING.firewall?.[fwType]?.cost || 0;

      rows.forEach(row => {
        const cells = row.children;
        const name = cells[0].textContent;
        const os = cells[1].textContent;
        const cpu = parseInt(cells[2].textContent);
        const ram = parseFloat(cells[3].textContent);
        const storage = parseFloat(cells[4].textContent);
        const cost = calculateCost(cpu, ram, storage, bandwidth, publicIPs);

        csv += `${name},${os},${cpu},${ram},${storage},$${cost.toFixed(2)}\n`;

        totalCPU += cpu;
        totalRAM += ram;
        totalStorage += storage;
        totalCost += cost;
      });

      csv += `\nTotal CPU,Total RAM,Total Storage,Total Bandwidth,Total Public IPs,Subtotal\n`;
      csv += `${totalCPU},${totalRAM.toFixed(2)},${totalStorage.toFixed(2)},${bandwidth},${publicIPs},$${totalCost.toFixed(2)}\n`;

      csv += `\nExtras\n`;
      csv += `Bandwidth Cost,$${bandwidthCost.toFixed(2)}\n`;
      csv += `Public IP Cost,$${publicIPCost.toFixed(2)}\n`;
      csv += `VCSP,$${vcspCost.toFixed(2)}\n`;
      csv += `Firewall Hosting,$${fwCost.toFixed(2)}\n`;
      csv += `Microsoft License (Corporate),$${msLicCost.toFixed(2)}\n`;

      const finalTotal = totalCost + bandwidthCost + publicIPCost + vcspCost + fwCost + msLicCost;
      csv += `\nTotal Estimated Cost,$${finalTotal.toFixed(2)}\n`;

      const blob = new Blob([csv], { type: 'text/csv' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "vmaas_pricing_summary.csv";
      link.click();
    }

    function updateCart() {
      // Placeholder for live cart update logic
      console.log("Cart updated.");
    }

    function addManualVM() {
      const name = document.getElementById('vmName').value;
      const os = document.getElementById('vmOS').value;
      const cpu = document.getElementById('vmCPU').value;
      const ram = document.getElementById('vmRAM').value;
      const storage = document.getElementById('vmStorage').value;

      if (!name || !cpu || !ram || !storage) return alert("Please complete all fields.");

      const table = document.querySelector("#vm-table tbody");
      const row = table.insertRow();
      [name, os, cpu, ram, storage].forEach(val => {
        const cell = row.insertCell();
        cell.textContent = val;
      });
      row.classList.add("selected");
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("bandwidthRange").addEventListener("input", e => {
        const val = Math.round(e.target.value / 100) * 100;
        e.target.value = val;
        document.getElementById("bandwidthValue").textContent = val;
        updateCart();
      });

      document.getElementById("publicIPCount").addEventListener("change", updateCart);

      const fwSelect = document.getElementById("firewallType");
      fwSelect.innerHTML = `<option value="ipsec">IPSec</option><option value="sophos">Sophos</option>`;
    });
  </script>
</body>
</html>
