<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple P2P File Transfer</title>
</head>
<body>
  <h2>Simple File Transfer</h2>
  <input type="file" id="fileInput"><br><br>

  <button onclick="createLink()">Create Link</button>
  <textarea id="connectionPhrase" placeholder="Share this phrase..." rows="4" cols="80"></textarea><br><br>

  <button onclick="joinLink()">Join Link</button>
  <textarea id="joinInput" placeholder="Paste phrase to join..." rows="4" cols="80"></textarea><br><br>

  <button onclick="sendFile()">Send File</button>

  <script>
    let pc = new RTCPeerConnection();
    let dc;
    let fileInput = document.getElementById('fileInput');

    // Receiving side
    pc.ondatachannel = event => {
      dc = event.channel;
      const receivedChunks = [];
      dc.onmessage = event => {
        if (event.data !== 'EOF') {
          receivedChunks.push(event.data);
        } else {
          const blob = new Blob(receivedChunks);
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'received_file';
          link.click();
        }
      };
    };

    // Create Link - initiator
    async function createLink() {
      dc = pc.createDataChannel('file');
      await pc.setLocalDescription(await pc.createOffer());
      await waitForICEGathering();
      document.getElementById('connectionPhrase').value = btoa(JSON.stringify({ offer: pc.localDescription }));
    }

    // Join Link - responder
    async function joinLink() {
      const data = JSON.parse(atob(document.getElementById('joinInput').value));
      await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
      await pc.setLocalDescription(await pc.createAnswer());
      await waitForICEGathering();
      const phrase = btoa(JSON.stringify({ answer: pc.localDescription }));
      alert("Paste this back to the other person:\n\n" + phrase);
    }

    // Set answer (for initiator)
    window.addEventListener('paste', async (e) => {
      try {
        const text = e.clipboardData.getData('text');
        const { answer } = JSON.parse(atob(text));
        if (answer) await pc.setRemoteDescription(new RTCSessionDescription(answer));
      } catch (e) {}
    });

    function sendFile() {
      const file = fileInput.files[0];
      const chunkSize = 16384;
      let offset = 0;
      const reader = new FileReader();

      reader.onload = e => {
        dc.send(e.target.result);
        offset += e.target.result.byteLength;
        if (offset < file.size) {
          readSlice(offset);
        } else {
          dc.send('EOF');
        }
      };

      const readSlice = o => {
        const slice = file.slice(o, o + chunkSize);
        reader.readAsArrayBuffer(slice);
      };

      readSlice(0);
    }

    function waitForICEGathering() {
      return new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') {
          resolve();
        } else {
          pc.onicegatheringstatechange = () => {
            if (pc.iceGatheringState === 'complete') {
              resolve();
            }
          };
        }
      });
    }
  </script>
</body>
</html>
