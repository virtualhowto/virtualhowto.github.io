<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure P2P File Transfer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #2a4365;
    }
    .drop-zone {
      border: 2px dashed #90cdf4;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      background-color: #ebf8ff;
      cursor: pointer;
      margin-bottom: 15px;
    }
    .drop-zone.dragover {
      background-color: #bee3f8;
    }
    input[type="file"] {
      display: none;
    }
    input, button, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 6px;
    }
    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #2c5282;
    }
    textarea {
      height: 80px;
      font-family: monospace;
    }
    .progress-container {
      margin-top: 10px;
    }
    .progress-bar {
      width: 100%;
      background-color: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      height: 20px;
    }
    .progress-bar-fill {
      height: 100%;
      background-color: #68d391;
      width: 0%;
      transition: width 0.2s ease;
    }
    .progress-info {
      font-size: 13px;
      text-align: center;
      margin-top: 4px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Secure P2P File Transfer</h2>
    <label class="drop-zone" id="dropZone">Drag and drop a file here or tap to choose</label>
    <input type="file" id="fileInput">
    <input type="text" id="passphrase" placeholder="Enter shared passphrase">

    <button onclick="createLink()">🔐 Generate Encrypted Offer</button>
    <textarea id="encryptedOffer" placeholder="Copy & send this encrypted phrase"></textarea>

    <textarea id="receivedEncryptedOffer" placeholder="Paste received encrypted offer"></textarea>
    <button onclick="respondToOffer()">🔓 Decrypt Offer & Respond</button>
    <textarea id="encryptedAnswer" placeholder="Send this encrypted answer back"></textarea>

    <textarea id="receivedEncryptedAnswer" placeholder="Paste received encrypted answer"></textarea>
    <button onclick="decryptAnswer()">✅ Finalize Connection</button>

    <button onclick="sendFile()">🚀 Send File</button>

    <div class="progress-container" id="progressBox" style="display:none;">
      <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-info" id="progressText"></div>
    </div>
  </div>

  <script>
    const pc = new RTCPeerConnection();
    let dc;
    let file;
    const chunkSize = 16384;

    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const progressBox = document.getElementById("progressBox");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", e => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      if (e.dataTransfer.files.length) file = e.dataTransfer.files[0];
    });
    fileInput.addEventListener("change", () => { if (fileInput.files.length) file = fileInput.files[0]; });

    pc.ondatachannel = event => {
      dc = event.channel;
      const receivedChunks = [];
      let receivedBytes = 0;
      dc.onmessage = e => {
        if (e.data !== "EOF") {
          receivedChunks.push(e.data);
          receivedBytes += e.data.byteLength;
          updateProgress(receivedBytes, null, true);
        } else {
          const blob = new Blob(receivedChunks);
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "received_file";
          a.click();
        }
      };
    };

    async function createLink() {
      const pass = document.getElementById("passphrase").value;
      dc = pc.createDataChannel("file");
      await pc.setLocalDescription(await pc.createOffer());
      await waitForICE();
      const encrypted = await encryptWithPass(pass, JSON.stringify(pc.localDescription));
      document.getElementById("encryptedOffer").value = encrypted;
    }

    async function respondToOffer() {
      const pass = document.getElementById("passphrase").value;
      const encOffer = document.getElementById("receivedEncryptedOffer").value;
      const offer = JSON.parse(await decryptWithPass(pass, encOffer));
      await pc.setRemoteDescription(offer);
      await pc.setLocalDescription(await pc.createAnswer());
      await waitForICE();
      const encrypted = await encryptWithPass(pass, JSON.stringify(pc.localDescription));
      document.getElementById("encryptedAnswer").value = encrypted;
    }

    async function decryptAnswer() {
      const pass = document.getElementById("passphrase").value;
      const encAnswer = document.getElementById("receivedEncryptedAnswer").value;
      const answer = JSON.parse(await decryptWithPass(pass, encAnswer));
      await pc.setRemoteDescription(answer);
    }

    async function sendFile() {
      if (!dc || !file) return alert("Missing file or connection.");
      let offset = 0;
      const reader = new FileReader();
      progressBox.style.display = "block";

      reader.onload = e => {
        dc.send(e.target.result);
        offset += e.target.result.byteLength;
        updateProgress(offset, file.size, false);
        if (offset < file.size) readSlice(offset);
        else dc.send("EOF");
      };
      function readSlice(o) {
        const slice = file.slice(o, o + chunkSize);
        reader.readAsArrayBuffer(slice);
      }
      readSlice(0);
    }

    function updateProgress(current, total, receiving) {
      const percent = total ? Math.floor((current / total) * 100) : 0;
      progressFill.style.width = `${percent}%`;
      progressText.textContent = receiving
        ? `Receiving: ${Math.ceil(current / 1024)} KB`
        : `Sending: ${Math.ceil(current / 1024)} KB of ${Math.ceil(total / 1024)} KB`;
    }

    function waitForICE() {
      return new Promise(resolve => {
        if (pc.iceGatheringState === "complete") resolve();
        else pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === "complete") resolve();
        };
      });
    }

    async function encryptWithPass(pass, data) {
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(pass, salt);
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(data));
      const full = new Uint8Array([...salt, ...iv, ...new Uint8Array(encrypted)]);
      return btoa(String.fromCharCode(...full));
    }

    async function decryptWithPass(pass, encryptedB64) {
      const raw = Uint8Array.from(atob(encryptedB64), c => c.charCodeAt(0));
      const salt = raw.slice(0, 16);
      const iv = raw.slice(16, 28);
      const data = raw.slice(28);
      const key = await deriveKey(pass, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return new TextDecoder().decode(decrypted);
    }

    async function deriveKey(pass, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pass), { name: "PBKDF2" }, false, ["deriveKey"]);
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    }
  </script>
</body>
</html>
