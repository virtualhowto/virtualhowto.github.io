<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Files Bookmark Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff7eb3, #ff758c);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 90%;
            max-width: 600px;
        }
        li {
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        a {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            text-align: center;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        a:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            a {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <h1>HTML Files in Repository</h1>
    <ul id="bookmarkList"></ul>

    <script>
        const repoOwner = "virtualhowto";
        const repoName = "virtualhowto.github.io";
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents`;

        async function fetchHtmlFiles() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const bookmarkList = document.getElementById("bookmarkList");

                data.forEach(file => {
                    if (file.name.endsWith(".html")) {
                        const listItem = document.createElement("li");
                        const link = document.createElement("a");
                        link.href = `https://${repoOwner}.github.io/${file.name}`;
                        link.textContent = file.name;
                        link.target = "_blank";
                        listItem.appendChild(link);
                        bookmarkList.appendChild(listItem);
                    }
                });
            } catch (error) {
                console.error("Error fetching repository contents:", error);
            }
        }

        fetchHtmlFiles();
    </script>
</body>
</html>
