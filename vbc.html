<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veeam Backup Storage Calculator</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      max-width: 900px;
      margin: auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.25rem;
    }
    input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      box-sizing: border-box;
      border-radius: 4px;
    }
    input#dailyRetention { background-color: #e8f5e9; border: 2px solid #4caf50; }
    input#weeklyRetention { background-color: #e3f2fd; border: 2px solid #2196f3; }
    input#monthlyRetention { background-color: #fff3e0; border: 2px solid #ff9800; }
    input#yearlyRetention { background-color: #f3e5f5; border: 2px solid #9c27b0; }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .card {
      margin-top: 2rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      background: #f9f9f9;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin: 0.5rem 0;
    }
    .visual-bar {
      display: flex;
      align-items: center;
      margin: 4px 0;
    }
    .visual-bar span.label {
      width: 70px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .bar {
      height: 20px;
      margin-left: 8px;
      position: relative;
      background-color: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-inner {
      height: 100%;
      text-align: right;
      color: white;
      font-size: 0.75rem;
      padding-right: 4px;
      line-height: 20px;
      transition: width 0.5s ease;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      margin-top: 1rem;
      gap: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <h1>Veeam Backup Storage Calculator</h1>
  <div class="grid">
    <div>
      <label>Source Data (TB)</label>
      <input type="number" id="sourceData" value="10" />
    </div>
    <div>
      <label>Daily Change Rate (%)</label>
      <input type="number" id="dailyChange" value="5" />
    </div>
    <div>
      <label>Yearly Growth Rate (%)</label>
      <input type="number" id="yearlyGrowth" value="10" />
    </div>
    <div>
      <label>Compression Ratio</label>
      <input type="number" id="compression" value="2" />
    </div>
    <div>
      <label style="color: #4caf50">Daily Retention (Days)</label>
      <input type="number" id="dailyRetention" value="30" />
    </div>
    <div>
      <label style="color: #2196f3">Weekly Retention (Weeks)</label>
      <input type="number" id="weeklyRetention" value="4" />
    </div>
    <div>
      <label style="color: #ff9800">Monthly Retention (Months)</label>
      <input type="number" id="monthlyRetention" value="12" />
    </div>
    <div>
      <label style="color: #9c27b0">Yearly Retention (Years)</label>
      <input type="number" id="yearlyRetention" value="1" />
    </div>
    <div style="grid-column: span 2;">
      <label style="color: #795548"><input type="checkbox" id="capacityTier" checked> Enable Capacity Tier (offload older backups)</label>
    </div>
    <div style="grid-column: span 2;">
      <label style="color: #c2185b"><input type="checkbox" id="immutableFlag"> Enable Immutability for GFS (adds storage overhead)</label>
    </div>
  </div>
  <button onclick="calculateStorage()">Calculate</button>

  <div id="results" class="card" style="display:none;">
    <h2>Results (in TB)</h2>
    <div id="output"></div>
    <h3>Restore Points Visualization</h3>
    <div id="bar-visuals"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-color" style="background:#4caf50"></div> Daily</div>
      <div class="legend-item"><div class="legend-color" style="background:#2196f3"></div> Weekly</div>
      <div class="legend-item"><div class="legend-color" style="background:#ff9800"></div> Monthly</div>
      <div class="legend-item"><div class="legend-color" style="background:#9c27b0"></div> Yearly</div>
      <div class="legend-item"><div class="legend-color" style="background:#607d8b"></div> Workspace</div>
      <div class="legend-item"><div class="legend-color" style="background:#795548"></div> Object Tier</div>
      <div class="legend-item"><div class="legend-color" style="background:#c2185b"></div> Immutability</div>
      <div class="legend-item"><div class="legend-color" style="background:#000"></div> Total</div>
    </div>
  </div>

  <script>
    function calculateStorage() {
      const getVal = id => parseFloat(document.getElementById(id).value)
      const sourceData = getVal("sourceData")
      const dailyChange = getVal("dailyChange")
      const yearlyGrowth = getVal("yearlyGrowth")
      const compression = getVal("compression")
      const dailyRetention = getVal("dailyRetention")
      const weeklyRetention = getVal("weeklyRetention")
      const monthlyRetention = getVal("monthlyRetention")
      const yearlyRetention = getVal("yearlyRetention")
      const capacityTierEnabled = document.getElementById("capacityTier").checked
      const immutableFlag = document.getElementById("immutableFlag").checked

      const veeamOverheadFactor = 1.1
      const fullBackup = sourceData / compression
      const dailyIncremental = (sourceData * dailyChange / 100) / compression
      const dailyTotal = ((dailyRetention - 1) * dailyIncremental + fullBackup) * veeamOverheadFactor

      let weeklyGFS = fullBackup * weeklyRetention
      let monthlyGFS = fullBackup * monthlyRetention
      let yearlyGFS = fullBackup * yearlyRetention

      if (immutableFlag) {
        weeklyGFS *= 1.1
        monthlyGFS *= 1.1
        yearlyGFS *= 1.1
      }

      const workspace = fullBackup * 1.1
      const capacityTierStorage = capacityTierEnabled ? (monthlyGFS + yearlyGFS + (weeklyGFS * 0.5)) : 0
      const total = fullBackup + dailyTotal + weeklyGFS + monthlyGFS + yearlyGFS + workspace

      const resultData = {
        "Backup Repository": total - capacityTierStorage,
        ...(capacityTierEnabled && { "Object Storage (Capacity Tier)": capacityTierStorage }),
        ...(immutableFlag && { "Immutability Overhead": (weeklyGFS + monthlyGFS + yearlyGFS) * 0.1 }),
        "Total Storage Required": total
      }

      const outputDiv = document.getElementById("output")
      outputDiv.innerHTML = ""
      for (const [key, val] of Object.entries(resultData)) {
        const div = document.createElement("div")
        div.className = "result-item"
        div.innerHTML = `<span>${key}</span><span>${val.toFixed(2)} TB</span>`
        outputDiv.appendChild(div)
      }

      const barContainer = document.getElementById("bar-visuals")
      barContainer.innerHTML = ""

      const pushBar = (label, value, color) => {
        const bar = document.createElement("div")
        bar.className = "visual-bar"
        const innerWidth = Math.min(100, value * 10) + "%"
        bar.innerHTML = `
          <span class="label">${label}</span>
          <div class="bar" style="width: 300px;">
            <div class="bar-inner" style="width:${innerWidth}; background:${color};">${value.toFixed(2)} TB</div>
          </div>
        `
        barContainer.appendChild(bar)
      }

      pushBar("Daily", dailyTotal, "#4caf50")
      pushBar("Weekly", weeklyGFS, "#2196f3")
      pushBar("Monthly", monthlyGFS, "#ff9800")
      pushBar("Yearly", yearlyGFS, "#9c27b0")
      pushBar("Workspace", workspace, "#607d8b")
      if (capacityTierEnabled) pushBar("Object Tier", capacityTierStorage, "#795548")
      if (immutableFlag) pushBar("IMMUT", (weeklyGFS + monthlyGFS + yearlyGFS) * 0.1, "#c2185b")
      pushBar("TOTAL", total, "#000")

      document.getElementById("results").style.display = "block"
    }
  </script>
</body>
</html>
