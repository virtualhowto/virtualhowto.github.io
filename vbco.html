<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veeam Backup Storage Calculator</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.25rem;
    }
    input[type="number"], input[type="checkbox"] {
      width: 100%;
      padding: 0.5rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .card {
      margin-top: 2rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      background: #f9f9f9;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin: 0.5rem 0;
    }
    .diagram {
      display: flex;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .restore-point {
      width: 16px;
      height: 16px;
      margin: 2px;
      border-radius: 2px;
    }
    .daily { background-color: #4caf50; }
    .weekly { background-color: #2196f3; }
    .monthly { background-color: #ff9800; }
    .yearly { background-color: #9c27b0; }
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Veeam Backup Storage Calculator</h1>
  <div class="grid">
    <div>
      <label>Source Data (TB)</label>
      <input type="number" id="sourceData" value="100" />
    </div>
    <div>
      <label>Daily Change Rate (%)</label>
      <input type="number" id="dailyChange" value="5" />
    </div>
    <div>
      <label>Yearly Growth Rate (%)</label>
      <input type="number" id="yearlyGrowth" value="10" />
    </div>
    <div>
      <label>Compression Ratio</label>
      <input type="number" id="compression" value="2" />
    </div>
    <div>
      <label>Daily Retention (Days)</label>
      <input type="number" id="dailyRetention" value="30" />
    </div>
    <div>
      <label>Weekly Retention (Weeks)</label>
      <input type="number" id="weeklyRetention" value="4" />
    </div>
    <div>
      <label>Monthly Retention (Months)</label>
      <input type="number" id="monthlyRetention" value="12" />
    </div>
    <div>
      <label>Yearly Retention (Years)</label>
      <input type="number" id="yearlyRetention" value="3" />
    </div>
    <div style="grid-column: span 2;">
      <label><input type="checkbox" id="capacityTier" /> Enable Capacity Tier (offload older backups)</label>
    </div>
    <div style="grid-column: span 2;">
      <label><input type="checkbox" id="immutableFlag" /> Enable Immutability for GFS (adds storage overhead)</label>
    </div>
  </div>
  <button onclick="calculateStorage()">Calculate</button>

  <div id="results" class="card" style="display:none;">
    <h2>Results (in TB)</h2>
    <div id="output"></div>
    <h3>Restore Points Diagram</h3>
    <div id="diagram" class="diagram"></div>
  </div>

  <script>
    function calculateStorage() {
      const getVal = id => parseFloat(document.getElementById(id).value)
      const sourceData = getVal("sourceData")
      const dailyChange = getVal("dailyChange")
      const yearlyGrowth = getVal("yearlyGrowth")
      const compression = getVal("compression")
      const dailyRetention = getVal("dailyRetention")
      const weeklyRetention = getVal("weeklyRetention")
      const monthlyRetention = getVal("monthlyRetention")
      const yearlyRetention = getVal("yearlyRetention")
      const capacityTierEnabled = document.getElementById("capacityTier").checked
      const immutableFlag = document.getElementById("immutableFlag").checked

      const adjustedSource = sourceData * (1 + yearlyGrowth / 100)
      const fullBackup = adjustedSource / compression
      const dailyIncremental = (sourceData * dailyChange / 100) / compression
      const dailyTotal = dailyIncremental * dailyRetention
      let weeklyGFS = fullBackup * weeklyRetention
      let monthlyGFS = fullBackup * monthlyRetention
      let yearlyGFS = fullBackup * yearlyRetention

      // Immutability overhead (e.g., +10% on GFS)
      if (immutableFlag) {
        weeklyGFS *= 1.1
        monthlyGFS *= 1.1
        yearlyGFS *= 1.1
      }

      const workspace = fullBackup * 1.25
      const capacityTierStorage = capacityTierEnabled ? (monthlyGFS + yearlyGFS) : 0
      const total = fullBackup + dailyTotal + weeklyGFS + monthlyGFS + yearlyGFS + workspace

      const resultData = {
        "Full Backup": fullBackup,
        "Daily Incrementals": dailyTotal,
        "Weekly GFS": weeklyGFS,
        "Monthly GFS": monthlyGFS,
        "Yearly GFS": yearlyGFS,
        "Workspace": workspace,
        ...(capacityTierEnabled && {"Capacity Tier (Object Storage)": capacityTierStorage}),
        ...(immutableFlag && {"Immutability Overhead": (weeklyGFS + monthlyGFS + yearlyGFS) * 0.1}),
        "Total Storage Required": total
      }

      const outputDiv = document.getElementById("output")
      outputDiv.innerHTML = ""
      for (const [key, val] of Object.entries(resultData)) {
        const div = document.createElement("div")
        div.className = "result-item"
        div.innerHTML = `<span>${key}</span><span>${val.toFixed(2)} TB</span>`
        outputDiv.appendChild(div)
      }

      const diagram = document.getElementById("diagram")
      diagram.innerHTML = ""
      for (let i = 0; i < dailyRetention; i++) {
        const el = document.createElement("div")
        el.className = "restore-point daily"
        diagram.appendChild(el)
      }
      for (let i = 0; i < weeklyRetention; i++) {
        const el = document.createElement("div")
        el.className = "restore-point weekly"
        diagram.appendChild(el)
      }
      for (let i = 0; i < monthlyRetention; i++) {
        const el = document.createElement("div")
        el.className = "restore-point monthly"
        diagram.appendChild(el)
      }
      for (let i = 0; i < yearlyRetention; i++) {
        const el = document.createElement("div")
        el.className = "restore-point yearly"
        diagram.appendChild(el)
      }

      document.getElementById("results").style.display = "block"
    }
  </script>
</body>
</html>
