<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7efe2"><title>What's On Near Me</title><link rel="manifest" href="manifest.webmanifest"><link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--ink:#26342f;--muted:#718078;--cream:#f7efe2;--paper:#fffdf8;--coral:#ee755b;--green:#5c8b70;--lime:#dce7bc;--gold:#f2c766;--sky:#dceaf0;--line:#e7ddce;--shadow:0 16px 42px rgba(72,62,48,.11)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--cream);min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 90% 0,#f7d9c9 0,transparent 28%),radial-gradient(circle at 0 35%,#e0ead0 0,transparent 26%);opacity:.85}header,section,main{position:relative}.top{max-width:1120px;margin:auto;padding:28px 18px 12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}.brand i{width:13px;height:13px;border-radius:50%;background:var(--coral);box-shadow:17px 0 0 var(--gold),34px 0 0 var(--green);margin-right:34px}.hero{padding:30px 0 14px;display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:end}h1{font-size:clamp(3.1rem,8vw,6.5rem);line-height:.84;letter-spacing:-.065em;margin:0;max-width:780px}.hero p{font-size:1.05rem;line-height:1.55;color:var(--muted);margin:0 0 5px}.hero p b{color:var(--ink)}.controls{max-width:1120px;margin:auto;padding:10px 18px 18px}.controlbox{background:rgba(255,253,248,.88);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.radius{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:15px}.radius b{font-size:1rem}.radius output{font-size:1.6rem;font-weight:950;color:var(--coral)}input[type=range]{width:100%;accent-color:var(--coral)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.chip,.locate{border:0;cursor:pointer;font:inherit;font-weight:850;border-radius:999px;padding:10px 15px}.chip{background:#f1eadf;color:var(--ink)}.chip.active{background:var(--green);color:white}.locate{margin-left:auto;background:var(--coral);color:white;padding-inline:20px}.locate:before{content:'●';margin-right:8px;color:#fff2b8}main{max-width:1120px;margin:auto;padding:0 18px 50px}.mapwrap{background:var(--paper);padding:7px;border-radius:30px;box-shadow:var(--shadow)}#map{height:40vh;min-height:320px;border-radius:24px;overflow:hidden}.summary{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 2px 12px}.summary strong{font-size:1.6rem;letter-spacing:-.03em}.status{font-size:.85rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:15px}.card{background:var(--paper);border-radius:25px;padding:18px;border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 25px rgba(72,62,48,.075);transition:.18s transform}.card:hover{transform:translateY(-2px)}.cardTop{display:flex;justify-content:space-between;gap:10px}.name{font-size:1.25rem;font-weight:950;letter-spacing:-.02em}.address,.meta,.fresh{color:var(--muted);font-size:.84rem}.address{margin-top:4px}.distance{background:var(--lime);border-radius:999px;padding:7px 10px;height:max-content;font-size:.78rem;font-weight:900;white-space:nowrap}.section{margin-top:16px}.sectionTitle{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:950;color:var(--green)}.item{margin-top:7px;padding:12px;border-radius:16px;background:#fff1e7;border-left:4px solid var(--coral)}.item.special{background:#eef5e8;border-left-color:var(--green)}.item b{display:block;font-size:.95rem}.meta{margin-top:3px}.links{display:flex;gap:8px;margin-top:15px}.links a{text-decoration:none;color:var(--ink);background:#eee8df;border-radius:12px;padding:8px 11px;font-size:.8rem;font-weight:850}.fresh{margin-top:10px;font-size:.7rem}.empty{background:var(--paper);padding:30px;border-radius:24px;text-align:center;color:var(--muted)}
@media(max-width:700px){.top{padding-top:20px}.hero{grid-template-columns:1fr;padding-top:25px}.hero p{max-width:520px}.radius{grid-template-columns:auto 1fr}.radius output{grid-column:1/-1;grid-row:1;text-align:right;font-size:1.25rem}.actions{display:grid;grid-template-columns:repeat(3,1fr)}.chip{padding:10px 7px;font-size:.82rem}.locate{grid-column:1/-1;margin:3px 0 0;height:48px}#map{height:35vh}.summary{align-items:start;flex-direction:column}.summary strong{font-size:1.4rem}}
</style></head><body><header class="top"><div class="brand"><i></i>Local plans, sorted</div><div class="hero"><h1>What’s on<br>near you?</h1><p>Pick a distance. See the <b>raffles worth leaving home for</b>, plus today’s lunch and dinner specials — all in one friendly little map.</p></div></header><section class="controls"><div class="controlbox"><div class="radius"><b>How far are we going?</b><input id="radius" type="range" min="2" max="40" step="1" value="15"><output><span id="radiusLabel">15</span> km</output></div><div class="actions"><button class="chip active" data-filter="all">Today</button><button class="chip" data-filter="raffle">Raffles</button><button class="chip" data-filter="day">Daytime</button><button class="chip" data-filter="night">Tonight</button><button class="chip" data-filter="lunch">Lunch</button><button class="chip" data-filter="dinner">Dinner</button><button id="locate" class="locate">Use my location</button></div></div></section><main><div class="mapwrap"><div id="map"></div></div><div class="summary"><strong id="count">Finding the good stuff…</strong><span class="status" id="status">Loading local venues</span></div><div id="grid" class="grid"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const fallback={lat:-33.365,lng:151.445};let origin={...fallback},venues=[],filter='all';const map=L.map('map',{zoomControl:false}).setView([origin.lat,origin.lng],12);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);let markers=L.layerGroup().addTo(map),meMarker;const km=(a,b)=>{const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};const today=()=>['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];function valid(v){if(filter==='all')return true;if(filter==='raffle')return(v.raffles||[]).length;if(['lunch','dinner'].includes(filter))return(v.specials||[]).some(s=>s.meal===filter);if(filter==='day')return(v.raffles||[]).some(r=>Number((r.time||'18:00').split(':')[0])<17);if(filter==='night')return(v.raffles||[]).some(r=>Number((r.time||'18:00').split(':')[0])>=17);return true}function render(){const radius=+document.querySelector('#radius').value;radiusLabel.textContent=radius;markers.clearLayers();const list=venues.map(v=>({...v,distance:km(origin,v)})).filter(v=>v.distance<=radius&&valid(v)).sort((a,b)=>a.distance-b.distance);count.textContent=`${list.length} place${list.length===1?'':'s'} within ${radius} km`;grid.innerHTML=list.length?'':'<div class="empty">Nothing matching that just yet. Try widening the distance or tap Today.</div>';list.forEach(v=>{const raff=(v.raffles||[]).filter(r=>!r.days||r.days.includes(today())),specials=(v.specials||[]).filter(s=>!s.days||s.days.includes(today()));const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="cardTop"><div><div class="name">${v.name}</div><div class="address">${v.address||''}</div></div><span class="distance">${v.distance.toFixed(1)} km</span></div>${raff.length?`<div class="section"><div class="sectionTitle">🎟 Today’s raffles</div>${raff.map(r=>`<div class="item"><b>${r.name||'Raffle'} · ${r.time||'time TBC'}</b><div class="meta">${r.details||''}</div></div>`).join('')}</div>`:''}${specials.length?`<div class="section"><div class="sectionTitle">🍴 Eat here today</div>${specials.map(s=>`<div class="item special"><b>${s.title}</b><div class="meta">${s.meal||''}${s.price?' · '+s.price:''}</div></div>`).join('')}</div>`:''}<div class="links">${v.website?`<a href="${v.website}" target="_blank">Venue site</a>`:''}<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.name+' '+(v.address||''))}" target="_blank">Directions</a></div><div class="fresh">Checked: ${v.last_checked||'starter data'}${v.needs_review?' · verify before travelling':''}</div>`;grid.appendChild(c);markers.addLayer(L.marker([v.lat,v.lng]).bindPopup(`<b>${v.name}</b><br>${v.distance.toFixed(1)} km away`))})}async function load(){try{const r=await fetch('data.json?v='+Date.now()),d=await r.json();venues=d.venues||[];status.textContent=`Updated ${d.updated||'recently'}`;render()}catch(e){status.textContent='Could not load venue data'}}radius.addEventListener('input',render);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});locate.onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lng:p.coords.longitude};if(meMarker)map.removeLayer(meMarker);meMarker=L.circleMarker([origin.lat,origin.lng],{radius:9,weight:4,fillOpacity:1}).addTo(map).bindPopup('You are here');map.setView([origin.lat,origin.lng],13);status.textContent='Using your current location';render()},()=>status.textContent='Location permission wasn’t granted');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();
</script></body></html>
