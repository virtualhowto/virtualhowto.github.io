<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>What's On Near Me</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#f7f6f2;--surface:#fff;--ink:#17201d;--muted:#74807a;--line:#e7e9e4;--accent:#ff6948;--green:#227b5d;--soft:#edf5f1;--warm:#fff0ea;--shadow:0 10px 28px rgba(24,33,29,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{padding-bottom:92px}button,a,input{font:inherit}.top{position:sticky;top:0;z-index:1000;background:rgba(247,246,242,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(231,233,228,.85)}.topin{max-width:1160px;margin:auto;padding:13px 16px 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.title small{display:block;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.09em}.title h1{font-size:1.7rem;margin:2px 0 0;letter-spacing:-.045em;line-height:1}.loc{border:0;background:var(--ink);color:#fff;border-radius:14px;padding:11px 13px;font-weight:850;cursor:pointer}.filterGroup{margin-top:10px}.filterLabel{font-size:.64rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;white-space:nowrap;color:var(--ink)}.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}.raffleToggle.active{background:var(--green);border-color:var(--green);color:#fff}.timechip.active{background:var(--accent);border-color:var(--accent);color:white}.shell{max-width:1160px;margin:auto;padding:14px 16px 30px}.radiusCard{background:linear-gradient(135deg,#fff,#fff8f4);border:1px solid #efe9e3;border-radius:21px;padding:14px 15px;box-shadow:var(--shadow)}.radiusTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.radiusTop b{font-size:.98rem}.radiusTop strong{font-size:1.35rem;color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent);margin-top:10px}.views{display:flex;gap:8px;margin:12px 0}.view{flex:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px;font-weight:850;color:var(--muted)}.view.active{background:var(--soft);color:var(--green);border-color:#d7e8df}.mapbox{background:#fff;padding:6px;border-radius:21px;box-shadow:var(--shadow)}#map{height:44vh;min-height:290px;border-radius:16px}.hidden{display:none!important}.summary{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:16px 2px 10px}.summary strong{font-size:1.2rem;letter-spacing:-.025em}.status{font-size:.75rem;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:0 5px 16px rgba(24,33,29,.045)}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:1.05rem;font-weight:900}.addr{color:var(--muted);font-size:.78rem;margin-top:3px}.dist{background:var(--soft);color:var(--green);font-size:.73rem;font-weight:900;border-radius:999px;padding:6px 8px;height:max-content;white-space:nowrap}.sec{margin-top:13px}.sect{font-size:.67rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:6px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;background:var(--warm);border-radius:14px;padding:11px;margin-top:6px}.item.food{background:var(--soft)}.item b{font-size:.89rem}.meta{font-size:.75rem;color:var(--muted);margin-top:3px;line-height:1.35}.when{background:#fff;border-radius:9px;padding:6px 7px;font-size:.73rem;font-weight:900;white-space:nowrap}.links{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.links a{text-decoration:none;text-align:center;padding:10px;border-radius:12px;font-size:.78rem;font-weight:900}.go{background:var(--ink);color:#fff}.site{background:#f0f1ee;color:var(--ink)}.fresh{color:#9aa29e;font-size:.65rem;margin-top:9px}.empty{background:#fff;border:1px dashed #d5dad5;border-radius:18px;text-align:center;padding:25px;color:var(--muted)}.bottom{display:none}@media(max-width:720px){.loc{width:43px;height:43px;padding:0;font-size:0}.loc:after{content:'◎';font-size:1rem}.shell{padding-top:12px}.summary{align-items:flex-start;flex-direction:column}.status{text-align:left}.grid{grid-template-columns:1fr}.bottom{display:grid;position:fixed;z-index:1200;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));grid-template-columns:repeat(4,1fr);background:rgba(23,32,29,.97);padding:6px;border-radius:19px;box-shadow:0 14px 35px rgba(0,0,0,.24)}.bottom button{border:0;background:transparent;color:#bfc6c2;border-radius:13px;padding:8px 3px;font-size:.66rem;font-weight:800}.bottom button span{display:block;font-size:1rem;margin-bottom:2px}.bottom button.active{background:#fff;color:var(--ink)}body.map-mode{padding-bottom:0;overflow:hidden}body.map-mode .top,body.map-mode .radiusCard,body.map-mode .views,body.map-mode #listbox{display:none!important}body.map-mode .shell{position:fixed;inset:0;padding:0;max-width:none;margin:0;z-index:1}body.map-mode .mapbox{display:block!important;position:absolute;inset:0;padding:0;border-radius:0;box-shadow:none;background:#ddd}body.map-mode #map{position:absolute;inset:0;width:100%;height:100%;min-height:100%;border-radius:0}body.map-mode .bottom{z-index:1400}body.map-mode .leaflet-control-zoom{margin-bottom:92px}body.map-mode .leaflet-control-attribution{margin-bottom:82px}}@media(min-width:721px){.topin,.shell{padding-left:20px;padding-right:20px}.title h1{font-size:2rem}}</style></head><body><header class="top"><div class="topin"><div class="row"><div class="title"><small>LOCAL PICKS</small><h1>What’s on near you?</h1></div><button id="locate" class="loc">Use my location</button></div><div class="filterGroup"><div class="filterLabel">Filters</div><div class="chips"><button id="raffleToggle" class="chip raffleToggle">🎟 Raffles: Off</button><button class="chip" data-food="lunch">🍔 Lunch</button><button class="chip" data-food="dinner">🍽 Dinner</button></div></div><div class="filterGroup"><div class="filterLabel">Time of day</div><div class="chips"><button class="chip timechip active" data-time="all">Any time</button><button class="chip timechip" data-time="day">☀ Daytime</button><button class="chip timechip" data-time="night">☾ Tonight</button></div></div></div></header><main class="shell"><section class="radiusCard"><div class="radiusTop"><b>Search distance</b><strong><span id="radiusLabel">15</span> km</strong></div><input id="radius" type="range" min="2" max="50" step="1" value="15"></section><div class="views"><button id="listBtn" class="view active">☷ List</button><button id="mapBtn" class="view">⌖ Map</button></div><section id="mapbox" class="mapbox hidden"><div id="map"></div></section><section id="listbox"><div class="summary"><strong id="count">Finding nearby places…</strong><span id="status" class="status">Loading venue data</span></div><div id="grid" class="grid"></div></section></main><nav class="bottom"><button data-quick="all" class="active"><span>⌂</span>Today</button><button data-quick="raffle"><span>🎟</span>Raffles</button><button data-quick="night"><span>☾</span>Tonight</button><button id="bm"><span>⌖</span>Map</button></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const fallback={lat:-33.365,lng:151.445};let origin={...fallback},venues=[],raffleOnly=false,timeFilter='all',foodFilter='all';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const map=L.map('map',{zoomControl:false}).setView([origin.lat,origin.lng],11);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);let markers=L.layerGroup().addTo(map),me;const km=(a,b)=>{if(!Number.isFinite(b.lat)||!Number.isFinite(b.lng))return 999;const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};const day=()=>['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];const pretty=t=>{if(!t)return'TBC';const[a,b='00']=t.split(':').map(Number);return`${a%12||12}:${String(b).padStart(2,'0')}${a>=12?'pm':'am'}`};const inTime=r=>{if(timeFilter==='all')return true;const h=+(r.time||'18:00').slice(0,2);return timeFilter==='day'?h<17:h>=17};const todaysRaffles=v=>(v.raffles||[]).filter(x=>(!x.days||x.days.includes(day()))&&(!raffleOnly||inTime(x)));const todaysFood=v=>(v.specials||[]).filter(x=>!x.days||x.days.includes(day()));function valid(v){const raff=todaysRaffles(v),food=todaysFood(v);if(raffleOnly&&raff.length===0)return false;if(foodFilter!=='all'&&!food.some(s=>s.meal===foodFilter||s.meal==='both'))return false;return true}function sync(){const rt=$('#raffleToggle');rt.classList.toggle('active',raffleOnly);rt.textContent=`🎟 Raffles: ${raffleOnly?'On':'Off'}`;$$('[data-time]').forEach(x=>x.classList.toggle('active',x.dataset.time===timeFilter));$$('[data-food]').forEach(x=>x.classList.toggle('active',x.dataset.food===foodFilter));$$('[data-quick]').forEach(x=>x.classList.remove('active'));if(!raffleOnly&&timeFilter==='all'&&foodFilter==='all')$('[data-quick="all"]').classList.add('active');if(raffleOnly)$('[data-quick="raffle"]').classList.add('active');if(timeFilter==='night')$('[data-quick="night"]').classList.add('active')}function view(v){const m=v==='map';document.body.classList.toggle('map-mode',m&&window.matchMedia('(max-width:720px)').matches);$('#mapbox').classList.toggle('hidden',!m);$('#listbox').classList.toggle('hidden',m);$('#mapBtn').classList.toggle('active',m);$('#listBtn').classList.toggle('active',!m);$('#bm').classList.toggle('active',m);if(m)setTimeout(()=>map.invalidateSize(),100)}function render(){sync();const r=+$('#radius').value;$('#radiusLabel').textContent=r;markers.clearLayers();const list=venues.map(v=>({...v,distance:km(origin,v)})).filter(v=>v.distance<=r&&valid(v)).sort((a,b)=>a.distance-b.distance);$('#count').textContent=`${list.length} nearby place${list.length===1?'':'s'}`;$('#grid').innerHTML=list.length?'':'<div class="empty">Nothing matches that combination yet.</div>';list.forEach(v=>{const raff=todaysRaffles(v),allFood=todaysFood(v),food=foodFilter==='all'?allFood:allFood.filter(x=>x.meal===foodFilter||x.meal==='both');const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="head"><div><div class="name">${v.name}</div><div class="addr">${v.address||''}</div></div><span class="dist">${v.distance.toFixed(1)} km</span></div>${raff.length?`<div class="sec"><div class="sect">Today’s raffles</div>${raff.map(x=>`<div class="item"><div><b>${x.name||'Raffle'}</b><div class="meta">${x.details||''}</div></div><span class="when">${pretty(x.time)}</span></div>`).join('')}</div>`:''}${food.length?`<div class="sec"><div class="sect">Food specials</div>${food.map(x=>`<div class="item food"><div><b>${x.title}</b><div class="meta">${x.meal||''}${x.price?' · '+x.price:''}</div></div></div>`).join('')}</div>`:''}<div class="links"><a class="go" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.name+' '+(v.address||''))}">Directions</a>${v.website?`<a class="site" target="_blank" href="${v.website}">Venue site</a>`:'<span></span>'}</div><div class="fresh">${v.needs_review?'Times/details need verification · ':''}Checked ${v.last_checked||'pending'}</div>`;$('#grid').appendChild(c);markers.addLayer(L.marker([v.lat,v.lng]).bindPopup(`<b>${v.name}</b><br>${raffleOnly?'Raffles filter on<br>':''}${raffleOnly&&timeFilter==='night'?'Tonight<br>':raffleOnly&&timeFilter==='day'?'Daytime<br>':''}${v.distance.toFixed(1)} km away`))})}async function load(){try{const d=await(await fetch('data.json?v='+Date.now())).json();venues=d.venues||[];$('#status').textContent=`${venues.length} clubs loaded · updated ${d.updated||'recently'}`;render()}catch(e){$('#status').textContent='Could not load venue data'}}$('#radius').oninput=render;$('#raffleToggle').onclick=()=>{raffleOnly=!raffleOnly;render()};$$('[data-food]').forEach(b=>b.onclick=()=>{foodFilter=foodFilter===b.dataset.food?'all':b.dataset.food;render()});$$('[data-time]').forEach(b=>b.onclick=()=>{timeFilter=b.dataset.time;render()});$$('[data-quick]').forEach(b=>b.onclick=()=>{const keepMap=document.body.classList.contains('map-mode')||!$('#mapbox').classList.contains('hidden');if(b.dataset.quick==='all'){raffleOnly=false;timeFilter='all';foodFilter='all'}else if(b.dataset.quick==='raffle'){raffleOnly=!raffleOnly}else if(b.dataset.quick==='night'){timeFilter=timeFilter==='night'?'all':'night'}render();if(keepMap)view('map')});$('#mapBtn').onclick=()=>view('map');$('#listBtn').onclick=()=>view('list');$('#bm').onclick=()=>view('map');function locate(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lng:p.coords.longitude};if(me)map.removeLayer(me);me=L.circleMarker([origin.lat,origin.lng],{radius:8,weight:3,fillOpacity:1}).addTo(map).bindPopup('You are here');map.setView([origin.lat,origin.lng],13);$('#status').textContent='Using your current location';render()},()=>$('#status').textContent='Location permission wasn’t granted')}$('#locate').onclick=locate;window.addEventListener('resize',()=>{if(document.body.classList.contains('map-mode')&&window.innerWidth>720)view('map')});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();</script></body></html>
