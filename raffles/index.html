<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ff7a59" />
  <title>Local Raffles & Specials</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--ink:#21302d;--muted:#61706c;--paper:#fffaf3;--card:#fff;--peach:#ff7a59;--mint:#cfeee4;--sun:#ffd66b;--blue:#dcecff;--line:#e9e1d6;--shadow:0 12px 34px rgba(55,51,42,.12)}
    *{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"SF Pro Rounded",Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff8ee 0,#f6fff9 55%,#eef6ff 100%);min-height:100vh}
    header{padding:22px 18px 12px;max-width:1100px;margin:auto}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#b65138}.hero{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap}h1{margin:5px 0 0;font-size:clamp(2rem,6vw,4.5rem);line-height:.95;letter-spacing:-.05em}.tag{max-width:420px;color:var(--muted);font-size:1rem}
    .controls{max-width:1100px;margin:0 auto;padding:10px 18px 16px;display:grid;grid-template-columns:1fr auto;gap:10px}.panel{background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);border-radius:22px;padding:14px}.radiusRow{display:flex;align-items:center;gap:12px}.radiusRow input{width:100%}.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-weight:750;cursor:pointer}.pill.active{background:var(--ink);color:white}.locate{border:0;border-radius:18px;padding:0 18px;background:var(--peach);color:white;font-weight:900;cursor:pointer;box-shadow:var(--shadow)}
    main{max-width:1100px;margin:auto;padding:0 18px 40px}.map{height:42vh;min-height:320px;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:4px solid white}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 10px}.summary strong{font-size:1.25rem}.status{color:var(--muted);font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 7px 22px rgba(55,51,42,.08)}.cardTop{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.name{font-size:1.18rem;font-weight:900}.distance{white-space:nowrap;background:var(--mint);padding:6px 9px;border-radius:999px;font-size:.8rem;font-weight:850}.address{color:var(--muted);font-size:.87rem;margin-top:3px}.section{margin-top:13px}.sectionTitle{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900}.item{margin-top:7px;padding:10px 11px;border-radius:14px;background:#fff7e6}.item.special{background:#edf8ff}.item b{display:block}.meta{font-size:.83rem;color:var(--muted);margin-top:2px}.links{display:flex;gap:8px;margin-top:13px}.links a{color:var(--ink);font-weight:800;text-decoration:none;padding:8px 10px;background:#f4f0e8;border-radius:12px;font-size:.82rem}.empty{padding:28px;text-align:center;color:var(--muted);background:white;border-radius:22px}.fresh{font-size:.72rem;color:var(--muted);margin-top:9px}
    @media(max-width:620px){.controls{grid-template-columns:1fr}.locate{height:48px}.map{height:38vh}.tag{font-size:.92rem}}
  </style>
</head>
<body>
<header><div class="eyebrow">What are we doing today?</div><div class="hero"><div><h1>Raffles nearby.</h1></div><div class="tag">Find clubs and pubs around you, compare daytime and nighttime raffles, then see what’s on for lunch or dinner.</div></div></header>
<section class="controls"><div class="panel"><div class="radiusRow"><b>Within <span id="radiusLabel">15</span> km</b><input id="radius" type="range" min="2" max="40" step="1" value="15" /></div><div class="pillrow"><button class="pill active" data-filter="all">Everything</button><button class="pill" data-filter="raffle">Raffles</button><button class="pill" data-filter="lunch">Lunch</button><button class="pill" data-filter="dinner">Dinner</button><button class="pill" data-filter="day">Daytime</button><button class="pill" data-filter="night">Night</button></div></div><button id="locate" class="locate">Use my location</button></section>
<main><div id="map" class="map"></div><div class="summary"><strong id="count">Finding places…</strong><span class="status" id="status">Showing starter Central Coast data</span></div><div id="grid" class="grid"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const fallback={lat:-33.365,lng:151.445}; let origin={...fallback}; let venues=[]; let filter='all';
const map=L.map('map',{zoomControl:false}).setView([origin.lat,origin.lng],12); L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
let markers=L.layerGroup().addTo(map), meMarker;
const km=(a,b)=>{const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};
const today=()=>['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
function validFor(v){if(filter==='all')return true;if(filter==='raffle')return (v.raffles||[]).length;if(['lunch','dinner'].includes(filter))return (v.specials||[]).some(s=>s.meal===filter);if(filter==='day')return (v.raffles||[]).some(r=>Number((r.time||'18:00').split(':')[0])<17);if(filter==='night')return (v.raffles||[]).some(r=>Number((r.time||'18:00').split(':')[0])>=17);return true}
function render(){const radius=+document.querySelector('#radius').value;document.querySelector('#radiusLabel').textContent=radius;markers.clearLayers();const list=venues.map(v=>({...v,distance:km(origin,v)})).filter(v=>v.distance<=radius&&validFor(v)).sort((a,b)=>a.distance-b.distance);document.querySelector('#count').textContent=`${list.length} place${list.length===1?'':'s'} within ${radius} km`;const grid=document.querySelector('#grid');grid.innerHTML=list.length?'':'<div class="empty">Nothing matches those filters yet. Try a wider radius or “Everything”.</div>';
list.forEach(v=>{const raff=(v.raffles||[]).filter(r=>!r.days||r.days.includes(today()));const specials=(v.specials||[]).filter(s=>!s.days||s.days.includes(today()));const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="cardTop"><div><div class="name">${v.name}</div><div class="address">${v.address||''}</div></div><span class="distance">${v.distance.toFixed(1)} km</span></div>${raff.length?`<div class="section"><div class="sectionTitle">Today’s raffles</div>${raff.map(r=>`<div class="item"><b>${r.name||'Raffle'} · ${r.time||'time TBC'}</b><div class="meta">${r.details||''}</div></div>`).join('')}</div>`:''}${specials.length?`<div class="section"><div class="sectionTitle">Today’s food</div>${specials.map(s=>`<div class="item special"><b>${s.title}</b><div class="meta">${s.meal||''}${s.price?' · '+s.price:''}</div></div>`).join('')}</div>`:''}<div class="links">${v.website?`<a href="${v.website}" target="_blank">Venue site</a>`:''}<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.name+' '+(v.address||''))}" target="_blank">Directions</a></div><div class="fresh">Checked: ${v.last_checked||'starter data'}${v.needs_review?' · verify before travelling':''}</div>`;grid.appendChild(card);const m=L.marker([v.lat,v.lng]).bindPopup(`<b>${v.name}</b><br>${v.distance.toFixed(1)} km away`);markers.addLayer(m)});
}
async function load(){try{const r=await fetch('data.json?v='+Date.now());const d=await r.json();venues=d.venues||[];document.querySelector('#status').textContent=`Data refreshed ${d.updated||'recently'}`;render()}catch(e){document.querySelector('#status').textContent='Could not load venue data';}}
document.querySelector('#radius').addEventListener('input',render);document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
document.querySelector('#locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lng:p.coords.longitude};if(meMarker)map.removeLayer(meMarker);meMarker=L.circleMarker([origin.lat,origin.lng],{radius:9,weight:4,fillOpacity:1}).addTo(map).bindPopup('You are here');map.setView([origin.lat,origin.lng],13);document.querySelector('#status').textContent='Using your current location';render()},()=>document.querySelector('#status').textContent='Location permission was not granted') : null;
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();
</script></body></html>
